"nav-btn\" data-tab=\"applications\">\n        <span class=\"nav-icon\"><svg class=\"icon\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M4 4h16v16H4z\"><\u002Fpath><path d=\"M4 7l8 5 8-5\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n        <span class=\"nav-label\">Applications<\u002Fspan>\n      <\u002Fbutton>\n      <button class=\"nav-btn\" data-tab=\"materials\">\n        <span class=\"nav-icon\"><svg class=\"icon\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M12 2 3 7v10l9 5 9-5V7z\"><\u002Fpath><path d=\"M3 7l9 5 9-5M12 12v10\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n        <span class=\"nav-label\">Materials<\u002Fspan>\n      <\u002Fbutton>\n    <\u002Fnav>\n\n    <div class=\"sidebar-footer\">\n      <div class=\"sidebar-progress-label\">\n        <span>Overall progress<\u002Fspan>\n        <span id=\"sidebarProgressPct\">0%<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"phase-segments\" id=\"sidebarPhaseSegments\"><\u002Fdiv>\n      <button class=\"ai-status\" id=\"sampleDataBtn\" onclick=\"loadSampleData()\" title=\"Replace this browser's data with a filled-in example\"><span class=\"lamp\" style=\"background:var(--brand); box-shadow:0 0 7px var(--brand);\"><\u002Fspan><span>Load sample data<\u002Fspan><\u002Fbutton>\n      <button class=\"ai-status\" id=\"aiStatusBtn\" onclick=\"openApiSetup()\"><span class=\"lamp\"><\u002Fspan><span id=\"aiStatusLabel\">AI coach: off<\u002Fspan><\u002Fbutton>\n      <div style=\"display:flex; gap:6px; margin-top:12px;\">\n        <button class=\"btn\" style=\"flex:1; font-size:10px; padding:6px 4px;\" onclick=\"exportBackup()\" title=\"Save all your progress to a JSON file\"><svg class=\"icon\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M12 3v12M7 10l5 5 5-5M5 21h14\"><\u002Fpath><\u002Fsvg> Export<\u002Fbutton>\n        <button class=\"btn\" style=\"flex:1; font-size:10px; padding:6px 4px;\" onclick=\"document.getElementById('importBackupFile').click()\" title=\"Load progress from a backup file\"><svg class=\"icon\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M12 15V3M7 8l5-5 5 5M5 21h14\"><\u002Fpath><\u002Fsvg> Import<\u002Fbutton>\n        <input type=\"file\" id=\"importBackupFile\" accept=\".json,application/json\" style=\"display:none;\" onchange=\"importBackup(this)\">\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Faside>\n\n  <!-- ─── Main Content ─── -->\n  <main class=\"main-content\">\n\n    <!-- Header status bar (pure render from stored data) -->\n    <div class=\"status-bar\" id=\"statusBar\"><\u002Fdiv>\n\n    <div id=\"demoBanner\" class=\"demo-banner\" style=\"display:none;\">\n      <span>Sample data<\u002Fspan>\n      <span class=\"db-text\">You're looking at a filled-in example so every view has something to show.<\u002Fspan>\n      <span class=\"db-actions\">\n        <button class=\"btn btn-sm btn-primary\" onclick=\"startFresh()\">Start fresh<\u002Fbutton>\n      <\u002Fspan>\n    <\u002Fdiv>\n\n    <!-- Tab 1: Dashboard -->\n    <div id=\"tab-dashboard\" class=\"tab-panel active\">\n      <div class=\"tab-hero\" data-num=\"01\">\n        <div class=\"hero-media\"><\u002Fdiv>\n        <div class=\"hero-overlay\"><\u002Fdiv>\n        <span class=\"hero-accent\" style=\"background:var(--phase-1);\"><\u002Fspan>\n        <span class=\"eyebrow\">Module 01: Dashboard<\u002Fspan>\n        <h2 class=\"tab-heading\">Home Dashboard<\u002Fh2>\n        <div class=\"hero-sub\">Your 4-month, 16-week program at a glance: current phase, this month's deliverable, and what to build next.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"card intro-card reveal\" id=\"dashIntro\" style=\"display:none; margin-bottom:var(--space-lg);\">\n        <button class=\"intro-dismiss\" onclick=\"dismissIntro()\" aria-label=\"Dismiss\">×<\u002Fbutton>\n        <span class=\"eyebrow\" style=\"padding-right:32px;\">What this is<\u002Fspan>\n        <div class=\"intro-lede\">A structured route into process and manufacturing engineering, built on published work rather than course certificates.<\u002Fdiv>\n        <div class=\"intro-body\">A 4-month, 16-week program for anyone moving into a manufacturing, process, or applications engineering role: new graduates, technicians stepping up, engineers changing industries. It's built on Lean Six Sigma fundamentals, DMAIC, root cause, SPC, process capability, paired with the AI skills that make an engineer faster without replacing their judgment: building dashboards, automating repetitive reporting, and creating templates that make sure work is complete and correct before it goes out. Four phases, one per month, each ending in a real deliverable. Eight tracks hold the curriculum, the portfolio projects with their reports and publishing checklists, the job pipeline and STAR bank, and a week-by-week plan. Set your background and target role below so the AI coach and every generated prompt speak to your situation. Progress stays in this browser. Export a backup from the sidebar.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- ── Today ── -->\n      <div class=\"card today-card\" id=\"dashToday\"><\u002Fdiv>\n\n      <!-- ── Yield hero ── -->\n      <div class=\"card reveal\">\n        <span class=\"eyebrow\">Program yield<\u002Fspan>\n        <div class=\"dash-hero\">\n          <div class=\"wafer-figure\">\n            <div id=\"waferMap\"><\u002Fdiv>\n            <div class=\"wafer-caption\">Progress map · <span id=\"waferDieInfo\">no data<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"yield-readout\">\n            <div class=\"yield-number\" id=\"dashStatPct\">0%<\u002Fdiv>\n            <div class=\"yield-sub\">of curriculum complete<span id=\"dashProgressPct\" style=\"display:none;\">0%<\u002Fspan><\u002Fdiv>\n            <div class=\"yield-stats\">\n              <div class=\"yield-stat\"><span class=\"k\">Tasks done<\u002Fspan><span class=\"v\" id=\"dashStatTasks\">0/36<\u002Fspan><\u002Fdiv>\n              <div class=\"yield-stat\"><span class=\"k\">Projects built<\u002Fspan><span class=\"v\" id=\"dashStatProjects\">0<\u002Fspan><\u002Fdiv>\n              <div class=\"yield-stat\"><span class=\"k\">Current phase<\u002Fspan><span class=\"v\" id=\"dashStatPhase\">P1<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"track-bar\" style=\"margin-top: var(--space-md);\">\n              <div class=\"track-bar-fill\" id=\"dashProgressBar\" style=\"background: linear-gradient(90deg, var(--brand-deep), var(--brand)); color: var(--brand); width: 0%;\"><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- ── This week ── -->\n      <div class=\"section-rule\"><h3>This week<\u002Fh3><\u002Fdiv>\n      <div class=\"card reveal\">\n        <div class=\"week-card\" id=\"dashWeekCard\"><\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- ── Pace ── -->\n      <div class=\"section-rule\"><h3>Pace<\u002Fh3><\u002Fdiv>\n      <div class=\"card reveal\">\n        <div class=\"burnup-wrap\" id=\"dashBurnup\"><\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- ── Consistency ── -->\n      <div class=\"section-rule\"><h3>Consistency<\u002Fh3><\u002Fdiv>\n      <div class=\"card reveal\">\n        <div class=\"consist\" id=\"dashConsistency\"><\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- ── Up next ── -->\n      <div class=\"section-rule\"><h3>Up next<\u002Fh3><\u002Fdiv>\n      <div class=\"card reveal\">\n        <div class=\"upnext\">\n          <div>\n            <div id=\"dashUpNext\" class=\"upnext-task\">Loading…<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"upnext-actions\">\n            <button class=\"btn btn-primary\" onclick=\"generateTodaysPlan()\">Generate today's plan<\u002Fbutton>\n            <button class=\"btn\" onclick=\"switchTab('progress')\">Log progress<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- ── Phase ladder ── -->\n      <div class=\"section-rule\"><h3>Phases<\u002Fh3><\u002Fdiv>\n      <div class=\"card reveal\" style=\"padding: var(--space-sm) var(--space-md);\">\n        <div class=\"phase-ladder\" id=\"dashPhaseLadder\"><\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- ── Profile ── -->\n      <div class=\"section-rule\"><h3>Your profile<\u002Fh3><\u002Fdiv>\n      <div class=\"card reveal\">\n        <span class=\"eyebrow\">Used by the AI coach and every generated prompt<\u002Fspan>\n        <div class=\"profile-grid\">\n          <div><label>Target role<\u002Flabel><input type=\"text\" id=\"profTargetRole\" placeholder=\"e.g. Manufacturing engineer, process engineer, applications engineer\" oninput=\"saveProfile()\"><\u002Fdiv>\n          <div><label>Background<\u002Flabel><input type=\"text\" id=\"profBackground\" placeholder=\"e.g. Mechanical engineering degree, 3 years as a maintenance tech\" oninput=\"saveProfile()\"><\u002Fdiv>\n          <div><label>What you want to get good at<\u002Flabel><input type=\"text\" id=\"profFocus\" placeholder=\"e.g. Running DMAIC projects and building AI tools that automate my reporting\" oninput=\"saveProfile()\"><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- ── Career + quick actions ── -->\n      <div class=\"section-rule\"><h3>Career track<\u002Fh3><\u002Fdiv>\n      <div class=\"grid-2\" style=\"align-items: start;\">\n        <div id=\"dashCareerChecklist\" class=\"reveal\"><\u002Fdiv>\n        <div class=\"card reveal\">\n          <span class=\"eyebrow\">Quick actions<\u002Fspan>\n          <div style=\"display:flex; flex-direction:column; gap:var(--space-sm); align-items:flex-start; margin-top: 10px;\">\n            <button class=\"btn btn-sm\" onclick=\"switchTab('study')\">Launch study session<\u002Fbutton>\n            <button class=\"btn btn-sm\" onclick=\"copyQuizPrompt()\">Copy quiz prompt<\u002Fbutton>\n            <button class=\"btn btn-sm\" onclick=\"copyStuckPrompt()\">Copy “feeling stuck” prompt<\u002Fbutton>\n          <\u002Fdiv>\n          <span class=\"eyebrow\" style=\"margin-top: var(--space-lg);\">From the AI playbook<\u002Fspan>\n          <div id=\"dashTip\" class=\"dash-tip\"><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Tab 2: Progress Tracker -->\n    <div id=\"tab-progress\" class=\"tab-panel\">\n      <div class=\"tab-hero\" data-num=\"02\">\n        <div class=\"hero-media\"><\u002Fdiv>\n        <div class=\"hero-overlay\"><\u002Fdiv>\n        <span class=\"hero-accent\" style=\"background:var(--phase-1);\"><\u002Fspan>\n        <span class=\"eyebrow\">Module 02: Progress<\u002Fspan>\n        <h2 class=\"tab-heading\">Progress Tracker<\u002Fh2>\n        <div class=\"hero-sub\">Track completion across 4 phases, 8 tracks, and every project task.<\u002Fdiv>\n      <\u002Fdiv>\n      <div id=\"progressContainer\"><\u002Fdiv>\n      <div style=\"margin-top:var(--space-xl); text-align:right;\">\n        <button class=\"btn btn-danger\" onclick=\"resetAllData()\">Reset All Progress<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Tab 3: Project Hub -->\n    <div id=\"tab-projects\" class=\"tab-panel\">\n      <div class=\"tab-hero\" data-num=\"03\">\n        <div class=\"hero-media\"><\u002Fdiv>\n        <div class=\"hero-overlay\"><\u002Fdiv>\n        <span class=\"hero-accent\" style=\"background:var(--phase-2);\"><\u002Fspan>\n        <span class=\"eyebrow\">Module 03: Projects<\u002Fspan>\n        <h2 class=\"tab-heading\">Project Hub<\u002Fh2>\n        <div class=\"hero-sub\">Build, document, and publish the portfolio projects that do the signaling work.<\u002Fdiv>\n      <\u002Fdiv>\n      <div id=\"projectHubContainer\"><\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Tab 4: Portfolio Tracker -->\n    <div id=\"tab-portfolio\" class=\"tab-panel\">\n      <div class=\"tab-hero\" data-num=\"04\">\n        <div class=\"hero-media\"><\u002Fdiv>\n        <div class=\"hero-overlay\"><\u002Fdiv>\n        <span class=\"hero-accent\" style=\"background:var(--phase-2);\"><\u002Fspan>\n        <span class=\"eyebrow\">Module 04: Portfolio<\u002Fspan>\n        <h2 class=\"tab-heading\">Portfolio Tracker<\u002Fh2>\n        <div class=\"hero-sub\">The interview flagships: the work you will put in front of hiring managers.<\u002Fdiv>\n      <\u002Fdiv>\n      <div id=\"portfolioContent\"><\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Tab 5: Resources Library -->\n    <div id=\"tab-resources\" class=\"tab-panel\">\n      <div class=\"tab-hero\" data-num=\"05\">\n        <div class=\"hero-media\"><\u002Fdiv>\n        <div class=\"hero-overlay\"><\u002Fdiv>\n        <span class=\"hero-accent\" style=\"background:var(--phase-3);\"><\u002Fspan>\n        <span class=\"eyebrow\">Module 05: Resources<\u002Fspan>\n        <h2 class=\"tab-heading\">Resources Library<\u002Fh2>\n        <div class=\"hero-sub\">Curated references, courses, and tools for each phase of the program.<\u002Fdiv>\n      <\u002Fdiv>\n      <div id=\"resourcesContent\"><\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Tab 6: Study Sessions -->\n    <div id=\"tab-study\" class=\"tab-panel\">\n      <div class=\"tab-hero\" data-num=\"06\">\n        <div class=\"hero-media\"><\u002Fdiv>\n        <div class=\"hero-overlay\"><\u002Fdiv>\n        <span class=\"hero-accent\" style=\"background:var(--phase-3);\"><\u002Fspan>\n        <span class=\"eyebrow\">Module 06: Study<\u002Fspan>\n        <h2 class=\"tab-heading\">Study Session Launcher<\u002Fh2>\n        <div class=\"hero-sub\">Launch focused study sessions with AI-generated plans and quizzes.<\u002Fdiv>\n      <\u002Fdiv>\n      <div id=\"studyContent\"><\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Tab 7: AI Strategy -->\n    <div id=\"tab-ai-strategy\" class=\"tab-panel\">\n      <div class=\"tab-hero\" data-num=\"07\">\n        <div class=\"hero-media\"><\u002Fdiv>\n        <div class=\"hero-overlay\"><\u002Fdiv>\n        <span class=\"hero-accent\" style=\"background:var(--phase-3);\"><\u002Fspan>\n        <span class=\"eyebrow\">Module 07: AI Strategy<\u002Fspan>\n        <h2 class=\"tab-heading\">AI Strategy<\u002Fh2>\n        <div class=\"hero-sub\">When to use AI, and when not to. Use cases, rules, and engineering judgment.<\u002Fdiv>\n      <\u002Fdiv>\n      <div id=\"aiStrategyContent\"><\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Tab 8: Schedule & Planner -->\n    <div id=\"tab-schedule\" class=\"tab-panel\">\n      <div class=\"tab-hero\" data-num=\"08\">\n        <div class=\"hero-media\"><\u002Fdiv>\n        <div class=\"hero-overlay\"><\u002Fdiv>\n        <span class=\"hero-accent\" style=\"background:var(--phase-4);\"><\u002Fspan>\n        <span class=\"eyebrow\">Module 08: Schedule<\u002Fspan>\n        <h2 class=\"tab-heading\">Schedule &amp; Planner<\u002Fh2>\n        <div class=\"hero-sub\">The week-by-week plan and the career milestones across the program.<\u002Fdiv>\n      <\u002Fdiv>\n      <div id=\"scheduleContent\"><\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Tab 9: Applications & STAR Bank -->\n    <div id=\"tab-applications\" class=\"tab-panel\">\n      <div class=\"tab-hero\" data-num=\"09\">\n        <div class=\"hero-media\"><\u002Fdiv>\n        <div class=\"hero-overlay\"><\u002Fdiv>\n        <span class=\"hero-accent\" style=\"background:var(--phase-4);\"><\u002Fspan>\n        <span class=\"eyebrow\">Module 09: Applications<\u002Fspan>\n        <h2 class=\"tab-heading\">Applications &amp; STAR Bank<\u002Fh2>\n        <div class=\"hero-sub\">Track roles, follow-ups, and your STAR story bank for interviews.<\u002Fdiv>\n      <\u002Fdiv>\n      <div id=\"applicationsContent\"><\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Tab 10: Materials -->\n    <div id=\"tab-materials\" class=\"tab-panel\">\n      <div class=\"tab-hero\" data-num=\"10\">\n        <div class=\"hero-media\"><\u002Fdiv>\n        <div class=\"hero-overlay\"><\u002Fdiv>\n        <span class=\"hero-accent\" style=\"background:var(--phase-4);\"><\u002Fspan>\n        <span class=\"eyebrow\">Module 10: Materials<\u002Fspan>\n        <h2 class=\"tab-heading\">Materials &amp; Costs<\u002Fh2>\n        <div class=\"hero-sub\">Parts, kits, and cost planning across the build projects.<\u002Fdiv>\n      <\u002Fdiv>\n      <div id=\"materialsContent\"><\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fmain>\n<\u002Fdiv>\n\n<!-- Scroll-progress hairline -->\n<div id=\"scrollProgress\"><\u002Fdiv>\n\n<!-- ═══ TOAST CONTAINER ═══ -->\n<div class=\"toast-container\" id=\"toastContainer\"><\u002Fdiv>\n\n<!-- ═══ REUSABLE MODAL ═══ -->\n<div class=\"modal-overlay\" id=\"modalOverlay\">\n  <div class=\"modal\">\n    <div class=\"modal-header\">\n      <h3 id=\"modalTitle\">Modal<\u002Fh3>\n      <button class=\"modal-close\" onclick=\"closeModal()\" aria-label=\"Close\"><svg class=\"icon\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M6 6l12 12M18 6L6 18\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n    <\u002Fdiv>\n    <div class=\"modal-body\" id=\"modalBody\"><\u002Fdiv>\n    <div class=\"modal-footer\" id=\"modalFooter\"><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<script>\n/* ═══════════════════════════════════════════════════════\n   CORE PLUMBING\n   ═══════════════════════════════════════════════════════ */\n\n// ─── Constants ───\nconst STORAGE_KEY = 'autoeng_hub_v2';\nconst API_KEY_KEY = 'autoeng_apikey';\nconst API_URL = 'https://api.anthropic.com/v1/messages';\nconst API_MODEL = 'claude-sonnet-4-6';\nconst API_MAX_TOKENS = 4000;\nconst APPLICATION_STATUSES = ['Saved', 'Applied', 'Screen', 'Interview', 'Offer', 'Rejected'];\nfunction genId(prefix) { return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }\n// The mentor persona. Reads the learner profile so the same program works for\n// anyone: a new graduate, a technician moving up, or an engineer switching industries.\nfunction systemPrompt() {\n  var p = (typeof getData === 'function' ? getData().profile : null) || {};\n  var target = (p.targetRole || '').trim() || 'Process or Manufacturing Engineer';\n  var bg = (p.background || '').trim();\n  var focus = (p.focus || '').trim();\n\n  return `You are a senior manufacturing and process engineering mentor: part instructor, Lean Six Sigma coach, hiring manager, technical reviewer, and interview coach: with experience hiring and developing engineers across semiconductor, electronics, chemical and discrete manufacturing.\n\nTHE LEARNER: A self-directed learner working toward a ${target} role.\n${bg ? 'Stated background: ' + bg : 'Background not stated. Ask what they already know before assuming prior knowledge, and calibrate depth from their answers.'}\n${focus ? 'Stated focus: ' + focus : ''}\n\nTHE PROGRAM: A focused 4-month, 16-week curriculum in ${HUB_DATA.phases.length} phases, one phase per month, each ending in a real, shippable deliverable. It is built around published portfolio projects rather than course completion. Pace is the learner's own; do not treat the week numbers as a deadline. Two competencies run through all of it and must be reinforced constantly:\n1. Lean Six Sigma engineering judgment: DMAIC, process mapping, root cause analysis, SPC, process capability, FMEA. This is the foundation everything else sits on, and AI never substitutes for it.\n2. Practical AI leverage for engineers: using AI to build dashboards, automate repetitive reporting and data cleanup, and create templates and checklists that make sure engineering work is complete and correct before it goes out the door. The goal is never to replace the engineer's judgment with AI, it is to make a competent engineer faster and more consistent.\n\nHOW TO TEACH (non-negotiable):\n1. Be Socratic. Do not simply hand over answers. Ask diagnostic questions, challenge assumptions, require reasoning: Why measure this? What happens if it drifts? What would tell you the root cause is right versus just plausible?\n2. Teach from first principles, in order: big picture → why it matters → business impact → manufacturing/applications-engineering relevance → the underlying logic → practical application → common mistakes → tradeoffs.\n3. Verify understanding before implementation. Ask the learner to explain concepts in their own words; correct misconceptions and fill gaps before moving on. Mastery over speed: project completion is not the success metric, engineering understanding is.\n4. Frame projects as DMAIC process-improvement initiatives. In root cause work, force the distinction between symptoms, evidence, causes, contributing factors, and root causes. Never allow unsupported conclusions.\n5. Demand engineering judgment before reaching for AI. Before any AI-built tool, require: what specific, repetitive or error-prone part of the job does this remove, and what happens if the AI-generated output is wrong? AI drafts, checks, and accelerates; the engineer verifies and owns the result.\n6. When a dashboard, script, or template is involved, hold it to a standard a teammate could actually use: clear inputs and outputs, no silent failures, and a way to tell at a glance whether something is wrong.\n7. Continuously relate topics to real production and applications-engineering work: customer specs, process documentation, quality escapes, deadlines, and to whatever work the learner already does.\n8. Tie everything to interview readiness and business value: how a hiring manager would probe it, how to explain it in STAR terms, what time, cost, or quality it saved.\n\nBe specific, practical, and educational. Where the learner has stated a background, build every new concept from it.`;\n}\n\n// One line describing the learner, reused across the copy-to-clipboard prompts.\nfunction learnerLine() {\n  var p = getData().profile || {};\n  var target = (p.targetRole || '').trim() || 'process / manufacturing engineering';\n  var bg = (p.background || '').trim();\n  return 'I am working toward a ' + target + ' role' + (bg ? ' (background: ' + bg + ')' : '');\n}\n\n// ═══════════════════════════════════════════════════════\n//  HUB_DATA: single source of truth for all content\n// ═══════════════════════════════════════════════════════\nconst HUB_DATA = {\n\n  // ── 4 Phases / 8 Tracks / Tasks (4-month, 16-week program) ──\n  phases: [\n    {\n      \"id\": 1,\n      \"name\": \"Lean Six Sigma & Data Foundations\",\n      \"weeks\": \"1 to 4\",\n      \"color\": \"#e8a33d\",\n      \"tracks\": [\n        {\n          \"id\": 1,\n          \"name\": \"Lean Six Sigma core & process mapping\",\n          \"weeks\": \"1 to 2\",\n          \"tasks\": [\n            \"Learn the DMAIC framework and pick a real process problem to improve\",\n            \"Map the current-state process (swimlane / VSM) and identify waste\",\n            \"Build control charts and calculate Cp/Cpk for a baseline process\"\n          ],\n          \"capstone\": \"DMAIC project charter & baseline SPC dashboard\",\n          \"miniProjects\": [\n            \"Current-state process map\",\n            \"5-Why & fishbone root-cause worksheet\",\n            \"Cp/Cpk capability calculator\"\n          ]\n        },\n        {\n          \"id\": 2,\n          \"name\": \"AI-assisted data handling\",\n          \"weeks\": \"3 to 4\",\n          \"tasks\": [\n            \"Use AI to clean and structure messy production or quality data\",\n            \"Write effective prompts for engineering data tasks: specs, tolerances, units\",\n            \"Build a reusable AI-assisted data-cleaning template for the team\"\n          ],\n          \"capstone\": \"Reusable AI data-cleaning template\",\n          \"miniProjects\": [\n            \"Prompt library for data cleanup\",\n            \"Excel-to-Python handoff script\",\n            \"Data-quality checklist template\"\n          ]\n        }\n      ]\n    },\n    {\n      \"id\": 2,\n      \"name\": \"AI-Augmented Root Cause & Quality Engineering\",\n      \"weeks\": \"5 to 8\",\n      \"color\": \"#74b1d6\",\n      \"tracks\": [\n        {\n          \"id\": 3,\n          \"name\": \"Root cause & FMEA with AI\",\n          \"weeks\": \"5 to 6\",\n          \"tasks\": [\n            \"Run a structured 5-Why and fishbone analysis on a real defect\",\n            \"Draft and pressure-test a process FMEA with AI as a thinking partner\",\n            \"Build an AI-generated checklist that catches missed failure modes\"\n          ],\n          \"capstone\": \"AI-assisted FMEA package\",\n          \"miniProjects\": [\n            \"5-Why root-cause writeup\",\n            \"Pareto chart of defect data\",\n            \"FMEA completeness-checklist template\"\n          ]\n        },\n        {\n          \"id\": 4,\n          \"name\": \"Automating repetitive engineering tasks\",\n          \"weeks\": \"7 to 8\",\n          \"tasks\": [\n            \"Automate a recurring report (scrap, yield, downtime) with Python/Excel + AI\",\n            \"Add automatic out-of-control flagging to the report\",\n            \"Package it so a teammate can run it without touching code\"\n          ],\n          \"capstone\": \"Automated recurring-report generator\",\n          \"miniProjects\": [\n            \"One-click report script\",\n            \"Auto-flagging rule engine\",\n            \"Runbook for a non-coder teammate\"\n          ]\n        }\n      ]\n    },\n    {\n      \"id\": 3,\n      \"name\": \"Manufacturing & Applications Engineering Skills\",\n      \"weeks\": \"9 to 12\",\n      \"color\": \"#b394e0\",\n      \"tracks\": [\n        {\n          \"id\": 5,\n          \"name\": \"Process documentation with AI quality gates\",\n          \"weeks\": \"9 to 10\",\n          \"tasks\": [\n            \"Write an SOP, work instruction, or control plan for a real/sample process\",\n            \"Build an AI-powered completeness checker that catches missing steps or specs\",\n            \"Run a document through the checker and revise until it passes\"\n          ],\n          \"capstone\": \"SOP & control plan + AI completeness-checker template\",\n          \"miniProjects\": [\n            \"Control-plan template\",\n            \"Work instruction with revision history\",\n            \"AI checklist-generator prompt\"\n          ]\n        },\n        {\n          \"id\": 6,\n          \"name\": \"Applications engineering fundamentals\",\n          \"weeks\": \"11 to 12\",\n          \"tasks\": [\n            \"Read a customer spec/drawing and flag DFM concerns\",\n            \"Draft a technical RFQ response or spec-compliance matrix with AI assistance\",\n            \"Practice explaining a technical tradeoff to a non-technical stakeholder\"\n          ],\n          \"capstone\": \"Customer spec response & DFM review\",\n          \"miniProjects\": [\n            \"Spec-compliance matrix\",\n            \"DFM checklist\",\n            \"AI-drafted RFQ technical response\"\n          ]\n        }\n      ]\n    },\n    {\n      \"id\": 4,\n      \"name\": \"Capstone & Job Readiness\",\n      \"weeks\": \"13 to 16\",\n      \"color\": \"#e5806f\",\n      \"tracks\": [\n        {\n          \"id\": 7,\n          \"name\": \"End-to-end continuous-improvement capstone\",\n          \"weeks\": \"13 to 14\",\n          \"tasks\": [\n            \"Run a full DMAIC project on a real process problem, start to finish\",\n            \"Use your dashboard, automation, and templates from the program at each stage\",\n            \"Quantify the impact in time, cost, or quality terms\"\n          ],\n          \"capstone\": \"Capstone DMAIC project\",\n          \"miniProjects\": [\n            \"Define/Measure charter\",\n            \"Analyze root-cause report\",\n            \"Improve/Control plan\"\n          ]\n        },\n        {\n          \"id\": 8,\n          \"name\": \"Portfolio & interview readiness\",\n          \"weeks\": \"15 to 16\",\n          \"tasks\": [\n            \"Package the dashboard, automation tool, and templates into a portfolio\",\n            \"Write STAR stories that show engineering judgment plus AI leverage\",\n            \"Prepare resume bullets tied to measurable impact\"\n          ],\n          \"capstone\": \"Published capstone portfolio\",\n          \"miniProjects\": [\n            \"Portfolio writeup\",\n            \"STAR bank entries\",\n            \"Resume bullet draft\"\n          ]\n        }\n      ]\n    }\n  ],\n\n  // ── Projects with full briefs (capstone + minis per track) ──\n  projects: [\n    {\n        \"id\": \"t1_cap\",\n        \"title\": \"DMAIC Project Charter & Baseline SPC Dashboard\",\n        \"careerTier\": 1,\n        \"phase\": 1,\n        \"track\": 1,\n        \"type\": \"capstone\",\n        \"difficulty\": \"intermediate\",\n        \"estimatedHours\": 20,\n        \"techStack\": [\n            \"JMP\",\n            \"Excel\"\n        ],\n        \"brief\": {\n            \"problem\": \"Improvement work stalls when the problem is never defined in measurable terms and the baseline is judged by eye instead of by data.\",\n            \"objectives\": [\n                \"Scope a real process problem into a DMAIC charter with a measurable goal and a defined business case\",\n                \"Pull a baseline dataset and build X-bar/R (or I-MR) control charts in JMP\",\n                \"Calculate baseline Cp/Cpk and read the charts against Western Electric rules\"\n            ],\n            \"deliverables\": [\n                \"One-page DMAIC project charter (problem, goal, scope, CTQ, timeline)\",\n                \"JMP control-chart dashboard on the baseline data\",\n                \"Baseline capability summary a reviewer can act on\"\n            ]\n        }\n    },\n    {\n        \"id\": \"t1_m1\",\n        \"title\": \"Current-State Process Map (Swimlane / VSM)\",\n        \"phase\": 1,\n        \"track\": 1,\n        \"type\": \"mini\",\n        \"difficulty\": \"beginner\",\n        \"estimatedHours\": 6,\n        \"techStack\": [\n            \"Excel\",\n            \"Process mapping\"\n        ],\n        \"brief\": {\n            \"problem\": \"You cannot remove waste from a process you have never mapped end to end.\",\n            \"objectives\": [\n                \"Walk a real or sample process and capture every step and handoff\",\n                \"Draw a swimlane or value-stream map that exposes delays and rework loops\",\n                \"Tag the seven wastes and mark the highest-impact improvement points\"\n            ],\n            \"deliverables\": [\n                \"Current-state swimlane/VSM diagram\",\n                \"Annotated waste list tied to specific steps\"\n            ]\n        }\n    },\n    {\n        \"id\": \"t1_m2\",\n        \"title\": \"Process Capability Calculator (Cp/Cpk)\",\n        \"phase\": 1,\n        \"track\": 1,\n        \"type\": \"mini\",\n        \"difficulty\": \"beginner\",\n        \"estimatedHours\": 5,\n        \"techStack\": [\n            \"Excel\",\n            \"JMP\"\n        ],\n        \"brief\": {\n            \"problem\": \"Capability numbers quoted without showing the math are easy to get wrong and impossible to trust.\",\n            \"objectives\": [\n                \"Compute Cp, Cpk, Pp and Ppk from a measurement sample by hand first, then in the tool\",\n                \"Check the normality assumption before reporting a capability index\",\n                \"Build a reusable sheet that takes specs + data and returns capability\"\n            ],\n            \"deliverables\": [\n                \"Reusable Cp/Cpk calculator (Excel/JMP) with the formulas visible\",\n                \"Worked example validated against a hand calculation\"\n            ]\n        }\n    },\n    {\n        \"id\": \"t2_cap\",\n        \"title\": \"Reusable AI Data-Cleaning Template\",\n        \"phase\": 1,\n        \"track\": 2,\n        \"type\": \"capstone\",\n        \"difficulty\": \"intermediate\",\n        \"estimatedHours\": 18,\n        \"techStack\": [\n            \"Excel\",\n            \"SQL\",\n            \"AI\"\n        ],\n        \"brief\": {\n            \"problem\": \"Most engineering data arrives messy, and hand-cleaning it the same way every week is slow and inconsistent.\",\n            \"objectives\": [\n                \"Take a messy production/quality export and define the clean target schema\",\n                \"Build an AI-assisted cleaning workflow (prompts + Power Query/SQL) that is repeatable\",\n                \"Add validation checks so a bad cleaning run fails loudly instead of silently\"\n            ],\n            \"deliverables\": [\n                \"Documented data-cleaning template a teammate can rerun\",\n                \"Before/after dataset with a validation report\",\n                \"Prompt set that drives the cleaning, with notes on what the engineer must still check\"\n            ]\n        }\n    },\n    {\n        \"id\": \"t2_m1\",\n        \"title\": \"Engineering Prompt Library for Data Tasks\",\n        \"phase\": 1,\n        \"track\": 2,\n        \"type\": \"mini\",\n        \"difficulty\": \"beginner\",\n        \"estimatedHours\": 5,\n        \"techStack\": [\n            \"AI\",\n            \"Excel\"\n        ],\n        \"brief\": {\n            \"problem\": \"Ad-hoc prompts give inconsistent results; reusable prompts that respect specs, tolerances and units do not.\",\n            \"objectives\": [\n                \"Write reusable prompts for cleanup, reshaping and unit handling\",\n                \"Bake in guardrails: preserve units, flag out-of-range values, never invent data\",\n                \"Test each prompt against a real sample and note its failure modes\"\n            ],\n            \"deliverables\": [\n                \"Prompt library (5+ prompts) with usage notes\",\n                \"Test log showing where each prompt needed engineer correction\"\n            ]\n        }\n    },\n    {\n        \"id\": \"t2_m2\",\n        \"title\": \"SQL Query Pack for Production Data\",\n        \"phase\": 1,\n        \"track\": 2,\n        \"type\": \"mini\",\n        \"difficulty\": \"beginner\",\n        \"estimatedHours\": 6,\n        \"techStack\": [\n            \"SQL\",\n            \"Excel\"\n        ],\n        \"brief\": {\n            \"problem\": \"Pulling the same yield/scrap/downtime slices by hand every week wastes engineering time.\",\n            \"objectives\": [\n                \"Model the tables behind a production dataset\",\n                \"Write parameterized queries for the recurring slices you actually need\",\n                \"Verify a query result against a known-good Excel pivot\"\n            ],\n            \"deliverables\": [\n                \"Documented SQL query pack for the recurring pulls\",\n                \"One query validated against a manual cross-check\"\n            ]\n        }\n    },\n    {\n        \"id\": \"t3_cap\",\n        \"title\": \"AI-Assisted Process FMEA Package\",\n        \"careerTier\": 2,\n        \"phase\": 2,\n        \"track\": 3,\n        \"type\": \"capstone\",\n        \"difficulty\": \"intermediate\",\n        \"estimatedHours\": 18,\n        \"techStack\": [\n            \"Excel\",\n            \"JMP\",\n            \"AI\"\n        ],\n        \"brief\": {\n            \"problem\": \"FMEAs miss failure modes when they lean on one engineer's memory; AI can widen the net but cannot own the risk ranking.\",\n            \"objectives\": [\n                \"Build a process FMEA on a real/sample process with severity, occurrence and detection\",\n                \"Use AI to pressure-test the FMEA for missed failure modes and weak controls\",\n                \"Rank by RPN and define concrete actions for the top risks\"\n            ],\n            \"deliverables\": [\n                \"Completed process FMEA with RPN and action plan\",\n                \"AI completeness-check log showing what it caught and what the engineer overruled\",\n                \"Short writeup on which rankings were engineering judgment calls\"\n            ]\n        }\n    },\n    {\n        \"id\": \"t3_m1\",\n        \"title\": \"5-Why & Fishbone Root-Cause Workup\",\n        \"phase\": 2,\n        \"track\": 3,\n        \"type\": \"mini\",\n        \"difficulty\": \"beginner\",\n        \"estimatedHours\": 5,\n        \"techStack\": [\n            \"AI\",\n            \"Process analysis\"\n        ],\n        \"brief\": {\n            \"problem\": \"Jumping to fixes before finding the root cause just moves the defect downstream.\",\n            \"objectives\": [\n                \"Run a structured 5-Why on a real defect, using AI only to ask questions back\",\n                \"Build a fishbone across the 6 Ms to force breadth\",\n                \"Separate verified causes from suspected ones\"\n            ],\n            \"deliverables\": [\n                \"5-Why writeup ending in a verified root cause\",\n                \"Fishbone diagram with evidence notes\"\n            ]\n        }\n    },\n    {\n        \"id\": \"t3_m2\",\n        \"title\": \"Pareto Defect Analysis\",\n        \"phase\": 2,\n        \"track\": 3,\n        \"type\": \"mini\",\n        \"difficulty\": \"beginner\",\n        \"estimatedHours\": 4,\n        \"techStack\": [\n            \"Excel\",\n            \"JMP\"\n        ],\n        \"brief\": {\n            \"problem\": \"Teams fix the loudest defect, not the costliest; a Pareto sorts that out.\",\n            \"objectives\": [\n                \"Aggregate defect data by category and by cost of impact\",\n                \"Build a Pareto chart and identify the vital few\",\n                \"State which categories to attack first and why\"\n            ],\n            \"deliverables\": [\n                \"Pareto chart (by count and by cost)\",\n                \"One-paragraph recommendation on where to focus\"\n            ]\n        }\n    },\n    {\n        \"id\": \"t4_cap\",\n        \"title\": \"Automated Recurring-Report Generator\",\n        \"careerTier\": 2,\n        \"phase\": 2,\n        \"track\": 4,\n        \"type\": \"capstone\",\n        \"difficulty\": \"advanced\",\n        \"estimatedHours\": 22,\n        \"techStack\": [\n            \"Python\",\n            \"SQL\",\n            \"Power BI\"\n        ],\n        \"brief\": {\n            \"problem\": \"A recurring scrap/yield/downtime report rebuilt by hand every week is the kind of repetitive task AI and automation should own.\",\n            \"objectives\": [\n                \"Automate the pull (SQL), the transform (Python/pandas) and the output (Power BI or Excel)\",\n                \"Add automatic out-of-control flagging so exceptions surface without a human scan\",\n                \"Package it so a non-coding teammate can run it on a schedule\"\n            ],\n            \"deliverables\": [\n                \"One-command report pipeline from raw data to published report\",\n                \"Auto-flagging rules for out-of-control conditions\",\n                \"Runbook a non-coder can follow, plus a note on what still needs engineering review\"\n            ]\n        }\n    },\n    {\n        \"id\": \"t4_m1\",\n        \"title\": \"One-Click Scrap/Yield Report Script\",\n        \"phase\": 2,\n        \"track\": 4,\n        \"type\": \"mini\",\n        \"difficulty\": \"intermediate\",\n        \"estimatedHours\": 7,\n        \"techStack\": [\n            \"Python\",\n            \"Excel\"\n        ],\n        \"brief\": {\n            \"problem\": \"The weekly report eats an afternoon that a script could give back.\",\n            \"objectives\": [\n                \"Load the raw export and reproduce the current report exactly\",\n                \"Parameterize the date range and product line\",\n                \"Export a formatted file ready to send\"\n            ],\n            \"deliverables\": [\n                \"Python script that regenerates the weekly report\",\n                \"README with run instructions\"\n            ]\n        }\n    },\n    {\n        \"id\": \"t4_m2\",\n        \"title\": \"Out-of-Control Auto-Flagging Engine\",\n        \"phase\": 2,\n        \"track\": 4,\n        \"type\": \"mini\",\n        \"difficulty\": \"intermediate\",\n        \"estimatedHours\": 6,\n        \"techStack\": [\n            \"Python\",\n            \"SQL\"\n        ],\n        \"brief\": {\n            \"problem\": \"If nobody scans every chart, drift gets caught a shift too late.\",\n            \"objectives\": [\n                \"Encode Western Electric / Nelson rules as reusable checks\",\n                \"Run them over incoming data and emit a flagged-points list\",\n                \"Keep the rule set configurable per process\"\n            ],\n            \"deliverables\": [\n                \"Rule engine module with tests\",\n                \"Sample flagged-exceptions output\"\n            ]\n        }\n    },\n    {\n        \"id\": \"t5_cap\",\n        \"title\": \"SOP & Control Plan with AI Completeness-Checker\",\n        \"phase\": 3,\n        \"track\": 5,\n        \"type\": \"capstone\",\n        \"difficulty\": \"intermediate\",\n        \"estimatedHours\": 18,\n        \"techStack\": [\n            \"Excel\",\n            \"AI\",\n            \"Templates\"\n        ],\n        \"brief\": {\n            \"problem\": \"Documentation that ships with missing steps or specs causes scrap and audit findings; a quality gate catches gaps before release.\",\n            \"objectives\": [\n                \"Write an SOP / work instruction and a control plan for a real/sample process\",\n                \"Build an AI completeness-checker that flags missing steps, specs, owners and revision info\",\n                \"Run the document through the checker and revise until it passes\"\n            ],\n            \"deliverables\": [\n                \"SOP/work instruction + control plan\",\n                \"AI completeness-checker prompt/tool with its rule list\",\n                \"Revision log showing what the checker caught\"\n            ]\n        }\n    },\n    {\n        \"id\": \"t5_m1\",\n        \"title\": \"Control-Plan Template\",\n        \"phase\": 3,\n        \"track\": 5,\n        \"type\": \"mini\",\n        \"difficulty\": \"beginner\",\n        \"estimatedHours\": 5,\n        \"techStack\": [\n            \"Excel\",\n            \"Templates\"\n        ],\n        \"brief\": {\n            \"problem\": \"A reusable control-plan template keeps every process documented to the same standard.\",\n            \"objectives\": [\n                \"Capture process steps, CTQs, specs, measurement method, sample size and reaction plan\",\n                \"Structure it so it maps cleanly to the FMEA and SOP\",\n                \"Fill one example fully\"\n            ],\n            \"deliverables\": [\n                \"Reusable control-plan template\",\n                \"One worked example\"\n            ]\n        }\n    },\n    {\n        \"id\": \"t5_m2\",\n        \"title\": \"AI Completeness-Checker Prompt\",\n        \"phase\": 3,\n        \"track\": 5,\n        \"type\": \"mini\",\n        \"difficulty\": \"beginner\",\n        \"estimatedHours\": 4,\n        \"techStack\": [\n            \"AI\"\n        ],\n        \"brief\": {\n            \"problem\": \"A checklist the author wrote themselves tends to miss the same things the document misses.\",\n            \"objectives\": [\n                \"Define what 'complete' means for a given document type\",\n                \"Write a prompt that audits a document against that definition\",\n                \"Validate it flags real omissions, not noise\"\n            ],\n            \"deliverables\": [\n                \"Completeness-checker prompt with its explicit criteria\",\n                \"Test run on a deliberately incomplete document\"\n            ]\n        }\n    },\n    {\n        \"id\": \"t6_cap\",\n        \"title\": \"Customer Spec Response & DFM Review\",\n        \"phase\": 3,\n        \"track\": 6,\n        \"type\": \"capstone\",\n        \"difficulty\": \"intermediate\",\n        \"estimatedHours\": 16,\n        \"techStack\": [\n            \"Excel\",\n            \"AI\"\n        ],\n        \"brief\": {\n            \"problem\": \"Applications engineers live at the customer boundary: reading specs, flagging what is not manufacturable, and answering RFQs clearly.\",\n            \"objectives\": [\n                \"Read a customer spec/drawing and flag DFM concerns with rationale\",\n                \"Draft a spec-compliance matrix and a technical RFQ response with AI assistance\",\n                \"Practice explaining one tradeoff to a non-technical stakeholder\"\n            ],\n            \"deliverables\": [\n                \"DFM review with prioritized concerns\",\n                \"Spec-compliance matrix\",\n                \"RFQ technical response, with a note on what the engineer verified vs. AI drafted\"\n            ]\n        }\n    },\n    {\n        \"id\": \"t6_m1\",\n        \"title\": \"Spec-Compliance Matrix\",\n        \"phase\": 3,\n        \"track\": 6,\n        \"type\": \"mini\",\n        \"difficulty\": \"beginner\",\n        \"estimatedHours\": 5,\n        \"techStack\": [\n            \"Excel\"\n        ],\n        \"brief\": {\n            \"problem\": \"A wall of spec clauses answered in prose hides the gaps; a matrix makes compliance auditable.\",\n            \"objectives\": [\n                \"Break a customer spec into individual requirements\",\n                \"Mark comply / partial / exception with evidence for each\",\n                \"Summarize the exceptions that need negotiation\"\n            ],\n            \"deliverables\": [\n                \"Requirement-by-requirement compliance matrix\",\n                \"Exception summary for the customer conversation\"\n            ]\n        }\n    },\n    {\n        \"id\": \"t6_m2\",\n        \"title\": \"AI-Drafted RFQ Technical Response\",\n        \"phase\": 3,\n        \"track\": 6,\n        \"type\": \"mini\",\n        \"difficulty\": \"beginner\",\n        \"estimatedHours\": 4,\n        \"techStack\": [\n            \"AI\",\n            \"Excel\"\n        ],\n        \"brief\": {\n            \"problem\": \"RFQ responses are repetitive enough to template but technical enough to need judgment.\",\n            \"objectives\": [\n                \"Draft an RFQ technical response from the spec and compliance matrix with AI\",\n                \"Edit it for accuracy and tone a customer would trust\",\n                \"Flag every claim that needs engineering sign-off\"\n            ],\n            \"deliverables\": [\n                \"Edited RFQ technical response\",\n                \"List of claims requiring engineering verification\"\n            ]\n        }\n    },\n    {\n        \"id\": \"t7_cap\",\n        \"title\": \"End-to-End DMAIC Continuous-Improvement Project\",\n        \"careerTier\": 1,\n        \"phase\": 4,\n        \"track\": 7,\n        \"type\": \"capstone\",\n        \"difficulty\": \"advanced\",\n        \"estimatedHours\": 28,\n        \"techStack\": [\n            \"JMP\",\n            \"SQL\",\n            \"Python\",\n            \"Power BI\"\n        ],\n        \"brief\": {\n            \"problem\": \"The hiring signal is a full improvement project run start to finish, using the dashboard, automation and templates built through the program and quantifying the impact.\",\n            \"objectives\": [\n                \"Run a complete DMAIC on a real process problem: Define, Measure, Analyze, Improve, Control\",\n                \"Use your SPC dashboard, automated report and templates at the relevant stages\",\n                \"Quantify the impact in time, cost or quality, and stand up a control plan to hold the gain\"\n            ],\n            \"deliverables\": [\n                \"Full DMAIC case study (charter through control plan)\",\n                \"Before/after data with capability and a quantified, honestly stated result\",\n                \"Power BI control dashboard that monitors the improved process\"\n            ]\n        }\n    },\n    {\n        \"id\": \"t7_m1\",\n        \"title\": \"Measurement System Analysis (Gage R&R)\",\n        \"phase\": 4,\n        \"track\": 7,\n        \"type\": \"mini\",\n        \"difficulty\": \"intermediate\",\n        \"estimatedHours\": 7,\n        \"techStack\": [\n            \"JMP\",\n            \"Excel\"\n        ],\n        \"brief\": {\n            \"problem\": \"If the measurement system is noisy, every DMAIC conclusion built on it is suspect.\",\n            \"objectives\": [\n                \"Design and run a Gage R&R study\",\n                \"Separate part-to-part variation from measurement variation\",\n                \"Decide whether the gage is adequate for the tolerance\"\n            ],\n            \"deliverables\": [\n                \"Gage R&R study and results\",\n                \"Accept/improve recommendation with rationale\"\n            ]\n        }\n    },\n    {\n        \"id\": \"t7_m2\",\n        \"title\": \"Improve/Control Plan with Power BI Monitoring\",\n        \"phase\": 4,\n        \"track\": 7,\n        \"type\": \"mini\",\n        \"difficulty\": \"intermediate\",\n        \"estimatedHours\": 7,\n        \"techStack\": [\n            \"Power BI\",\n            \"Excel\"\n        ],\n        \"brief\": {\n            \"problem\": \"Improvements that are not monitored quietly erode back to baseline.\",\n            \"objectives\": [\n                \"Define the control plan for the improved process\",\n                \"Build a refreshable Power BI view that tracks the key metric against limits\",\n                \"Set the reaction plan for an out-of-control signal\"\n            ],\n            \"deliverables\": [\n                \"Control plan tied to the improvement\",\n                \"Refreshable Power BI monitoring report\"\n            ]\n        }\n    },\n    {\n        \"id\": \"t8_cap\",\n        \"title\": \"Published Capstone Portfolio\",\n        \"phase\": 4,\n        \"track\": 8,\n        \"type\": \"capstone\",\n        \"difficulty\": \"intermediate\",\n        \"estimatedHours\": 16,\n        \"techStack\": [\n            \"Portfolio site\",\n            \"Power BI\"\n        ],\n        \"brief\": {\n            \"problem\": \"Work that is not packaged and published does nothing for a job search; hiring managers need to see the dashboard, the automation and the templates in one place.\",\n            \"objectives\": [\n                \"Package the SPC dashboard, the automation tool and the templates into a portfolio\",\n                \"Write case studies that show engineering judgment plus AI leverage, not tool operation\",\n                \"Publish it so a recruiter can skim it in two minutes\"\n            ],\n            \"deliverables\": [\n                \"Published portfolio site/repo linking every deliverable\",\n                \"Per-project case studies written for a hiring manager\",\n                \"A clear line in each on what the engineer decided vs. what AI drafted\"\n            ]\n        }\n    },\n    {\n        \"id\": \"t8_m1\",\n        \"title\": \"STAR Story Bank\",\n        \"phase\": 4,\n        \"track\": 8,\n        \"type\": \"mini\",\n        \"difficulty\": \"beginner\",\n        \"estimatedHours\": 5,\n        \"techStack\": [\n            \"Writing\",\n            \"AI\"\n        ],\n        \"brief\": {\n            \"problem\": \"Interviews reward specific, quantified stories, not restated job duties.\",\n            \"objectives\": [\n                \"Draft STAR stories from the program's real projects\",\n                \"Lead with the result and the engineering judgment involved\",\n                \"Map each story to the competencies target roles screen for\"\n            ],\n            \"deliverables\": [\n                \"4+ STAR stories tied to real deliverables\",\n                \"Competency-to-story map\"\n            ]\n        }\n    },\n    {\n        \"id\": \"t8_m2\",\n        \"title\": \"Impact-Quantified Resume Bullets\",\n        \"phase\": 4,\n        \"track\": 8,\n        \"type\": \"mini\",\n        \"difficulty\": \"beginner\",\n        \"estimatedHours\": 4,\n        \"techStack\": [\n            \"Writing\"\n        ],\n        \"brief\": {\n            \"problem\": \"Resume bullets that describe tools used get skimmed past; bullets tied to measurable impact get interviews.\",\n            \"objectives\": [\n                \"Rewrite bullets verb-and-outcome first\",\n                \"Attach an honest, defensible metric to each\",\n                \"Tune wording for manufacturing / process / applications engineer postings\"\n            ],\n            \"deliverables\": [\n                \"Resume bullet set with quantified outcomes\",\n                \"Notes on which metric each bullet can defend in an interview\"\n            ]\n        }\n    }\n  ],\n\n  // ── Learning Resources (Lean Six Sigma + JMP/SQL/Power BI/Excel + AI) ──\n  resources: [\n    // Lean Six Sigma\n    { id: 'res_0', name: 'ASQ: Six Sigma / quality certifications hub', type: 'site', free: true, url: 'asq.org/cert', phase: 1, priority: true, topic: 'Lean Six Sigma' },\n    { id: 'res_1', name: 'ASQ Green Belt / Black Belt Body of Knowledge', type: 'doc', free: true, url: 'asq.org', phase: 1, priority: true, topic: 'Lean Six Sigma' },\n    { id: 'res_2', name: 'The Lean Six Sigma Pocket Toolbook (George et al.)', type: 'book', free: false, url: 'mheducation.com', phase: 1, priority: true, topic: 'Lean Six Sigma' },\n    { id: 'res_3', name: 'NIST/SEMATECH e-Handbook of Statistical Methods (SPC & capability)', type: 'site', free: true, url: 'itl.nist.gov/div898/handbook', phase: 1, priority: true, topic: 'Lean Six Sigma' },\n    { id: 'res_4', name: 'Understanding Statistical Process Control (Wheeler & Chambers)', type: 'book', free: false, url: 'spcpress.com', phase: 2, priority: false, topic: 'Lean Six Sigma' },\n    { id: 'res_5', name: 'iSixSigma: DMAIC, control charts, capability primers', type: 'site', free: true, url: 'isixsigma.com', phase: 1, priority: false, topic: 'Lean Six Sigma' },\n    // JMP & statistics\n    { id: 'res_6', name: 'JMP Learning Library (control charts, capability, DOE)', type: 'doc', free: true, url: 'jmp.com/learn', phase: 1, priority: true, topic: 'JMP & statistics' },\n    { id: 'res_7', name: 'JMP Statistical Thinking for Industrial Problem Solving (free course)', type: 'course', free: true, url: 'jmp.com/stipst', phase: 1, priority: true, topic: 'JMP & statistics' },\n    // SQL\n    { id: 'res_8', name: 'Mode SQL Tutorial', type: 'site', free: true, url: 'mode.com/sql-tutorial', phase: 1, priority: true, topic: 'SQL' },\n    { id: 'res_9', name: 'SQLBolt: interactive SQL lessons', type: 'site', free: true, url: 'sqlbolt.com', phase: 1, priority: false, topic: 'SQL' },\n    { id: 'res_10', name: 'Microsoft SQL / T-SQL documentation', type: 'doc', free: true, url: 'learn.microsoft.com/sql', phase: 2, priority: false, topic: 'SQL' },\n    // Excel & Power Query\n    { id: 'res_11', name: 'ExcelJet: formulas & functions reference', type: 'site', free: true, url: 'exceljet.net', phase: 1, priority: true, topic: 'Excel & Power Query' },\n    { id: 'res_12', name: 'Microsoft Power Query documentation', type: 'doc', free: true, url: 'learn.microsoft.com/power-query', phase: 1, priority: true, topic: 'Excel & Power Query' },\n    // Power BI\n    { id: 'res_13', name: 'Microsoft Power BI guided learning', type: 'course', free: true, url: 'learn.microsoft.com/power-bi', phase: 2, priority: true, topic: 'Power BI' },\n    { id: 'res_14', name: 'SQLBI: DAX & data modeling patterns', type: 'site', free: true, url: 'sqlbi.com', phase: 4, priority: false, topic: 'Power BI' },\n    { id: 'res_15', name: 'Guy in a Cube (Power BI, YouTube)', type: 'video', free: true, url: 'youtube.com/@GuyInACube', phase: 2, priority: false, topic: 'Power BI' },\n    // Python for data automation\n    { id: 'res_16', name: 'Automate the Boring Stuff with Python', type: 'book', free: true, url: 'automatetheboringstuff.com', phase: 2, priority: true, topic: 'Python for data automation' },\n    { id: 'res_17', name: 'pandas documentation', type: 'doc', free: true, url: 'pandas.pydata.org/docs', phase: 2, priority: true, topic: 'Python for data automation' },\n    { id: 'res_18', name: 'Real Python: data & automation tutorials', type: 'site', free: true, url: 'realpython.com', phase: 2, priority: false, topic: 'Python for data automation' },\n    { id: 'res_19', name: 'Python for Everybody (Coursera)', type: 'course', free: true, url: 'coursera.org', phase: 1, priority: false, topic: 'Python for data automation' },\n    // AI for engineers\n    { id: 'res_20', name: 'Anthropic prompt engineering guide', type: 'doc', free: true, url: 'docs.anthropic.com', phase: 1, priority: true, topic: 'AI for engineers' },\n    { id: 'res_21', name: 'OpenAI prompt engineering guide', type: 'doc', free: true, url: 'platform.openai.com/docs/guides/prompt-engineering', phase: 1, priority: false, topic: 'AI for engineers' },\n    { id: 'res_22', name: 'Claude for data analysis & spreadsheets (docs)', type: 'doc', free: true, url: 'docs.anthropic.com', phase: 2, priority: true, topic: 'AI for engineers' },\n    { id: 'res_23', name: 'Prompt engineering for data cleaning & extraction (patterns)', type: 'site', free: true, url: 'docs.anthropic.com', phase: 2, priority: false, topic: 'AI for engineers' },\n    // Quality engineering & documentation\n    { id: 'res_24', name: 'AIAG FMEA & Control Plan reference', type: 'doc', free: false, url: 'aiag.org', phase: 3, priority: true, topic: 'Quality engineering & documentation' },\n    { id: 'res_25', name: 'Quality-One: FMEA, control plans, SPC guides', type: 'site', free: true, url: 'quality-one.com', phase: 3, priority: true, topic: 'Quality engineering & documentation' },\n    { id: 'res_26', name: 'DFMPro / DFM fundamentals primers', type: 'site', free: true, url: 'dfmpro.com', phase: 3, priority: false, topic: 'Quality engineering & documentation' },\n    { id: 'res_27', name: 'ASQ: RFQ, spec review & supplier quality resources', type: 'site', free: true, url: 'asq.org', phase: 3, priority: false, topic: 'Quality engineering & documentation' },\n    // Portfolio & interview\n    { id: 'res_28', name: 'STAR method interview guide', type: 'site', free: true, url: 'themuse.com', phase: 4, priority: true, topic: 'Portfolio & interview' },\n    { id: 'res_29', name: 'GitHub: building a project portfolio / README guides', type: 'doc', free: true, url: 'docs.github.com', phase: 4, priority: false, topic: 'Portfolio & interview' }\n  ],\n\n  // ── Weekly Focus Topics (16 weeks, one phase per month) ──\n  weeklyPlan: [\n    { \"week\": 1, \"focus\": \"DMAIC framework & scoping a real process problem\", \"sessionType\": \"concept\", \"tracks\": [\"Lean Six Sigma core & process mapping\"] },\n    { \"week\": 2, \"focus\": \"Process mapping (swimlane/VSM), control charts & baseline Cp/Cpk\", \"sessionType\": \"project\", \"tracks\": [\"Lean Six Sigma core & process mapping\"] },\n    { \"week\": 3, \"focus\": \"AI-assisted data cleaning: prompts that respect specs, tolerances & units\", \"sessionType\": \"concept/project\", \"tracks\": [\"AI-assisted data handling\"] },\n    { \"week\": 4, \"focus\": \"Reusable data-cleaning template + SQL query pack for recurring pulls\", \"sessionType\": \"project\", \"tracks\": [\"AI-assisted data handling\"] },\n    { \"week\": 5, \"focus\": \"5-Why, fishbone & Pareto on a real defect\", \"sessionType\": \"concept/project\", \"tracks\": [\"Root cause & FMEA with AI\"] },\n    { \"week\": 6, \"focus\": \"Process FMEA pressure-tested with AI\", \"sessionType\": \"project\", \"tracks\": [\"Root cause & FMEA with AI\"] },\n    { \"week\": 7, \"focus\": \"Automating a recurring report (SQL + Python + Power BI)\", \"sessionType\": \"project\", \"tracks\": [\"Automating repetitive engineering tasks\"] },\n    { \"week\": 8, \"focus\": \"Auto-flagging out-of-control conditions; package for a non-coder\", \"sessionType\": \"project\", \"tracks\": [\"Automating repetitive engineering tasks\"] },\n    { \"week\": 9, \"focus\": \"Writing SOPs, work instructions & control plans\", \"sessionType\": \"concept/project\", \"tracks\": [\"Process documentation with AI quality gates\"] },\n    { \"week\": 10, \"focus\": \"AI completeness-checker: catch missing steps & specs before release\", \"sessionType\": \"project\", \"tracks\": [\"Process documentation with AI quality gates\"] },\n    { \"week\": 11, \"focus\": \"Reading customer specs/drawings & flagging DFM concerns\", \"sessionType\": \"concept\", \"tracks\": [\"Applications engineering fundamentals\"] },\n    { \"week\": 12, \"focus\": \"Spec-compliance matrix & AI-assisted RFQ response\", \"sessionType\": \"project\", \"tracks\": [\"Applications engineering fundamentals\"] },\n    { \"week\": 13, \"focus\": \"Capstone DMAIC: Define, Measure, Analyze\", \"sessionType\": \"capstone\", \"tracks\": [\"End-to-end continuous-improvement capstone\"] },\n    { \"week\": 14, \"focus\": \"Capstone DMAIC: Improve, Control & quantified impact\", \"sessionType\": \"capstone\", \"tracks\": [\"End-to-end continuous-improvement capstone\"] },\n    { \"week\": 15, \"focus\": \"Package the portfolio; write STAR stories\", \"sessionType\": \"project\", \"tracks\": [\"Portfolio & interview readiness\"] },\n    { \"week\": 16, \"focus\": \"Impact-first resume bullets & interview readiness\", \"sessionType\": \"capstone\", \"tracks\": [\"Portfolio & interview readiness\"] }\n  ],\n    // ── AI Use Cases (AI as leverage on an engineering foundation) ──\n  aiUseCases: [\n    {\n      id: 'uc_1_1', stage: 1, stageName: \"AI as a Learning Accelerator\",\n      title: \"Concept Scaffolding\",\n      description: \"Before a new concept, have AI build it from what you already know, then tell you what you must understand deeply.\",\n      prompt: \"I understand [known concept]. Explain [new concept] by building from what I already know, using analogies from manufacturing or everyday processes. Then tell me what I must understand at a deep level, not just recognize, before I can use it on the job.\"\n    },\n    {\n      id: 'uc_1_2', stage: 1, stageName: \"AI as a Learning Accelerator\",\n      title: \"Diagnostic Rubber-Duck\",\n      description: \"When stuck, don't ask AI to fix it. Ask it to ask YOU the questions that lead to the answer.\",\n      prompt: \"I am stuck on [problem] in [project]. Do NOT give me the answer. Ask me 3 to 5 diagnostic questions that help me find what I'm missing. After I answer, give me targeted hints only.\"\n    },\n    {\n      id: 'uc_1_3', stage: 1, stageName: \"AI as a Learning Accelerator\",\n      title: \"Active-Recall Quiz\",\n      description: \"After each task, generate a quiz at three levels: recall, application, and synthesis.\",\n      prompt: \"I just finished [task] in [track]. Generate a 6-question quiz: 2 recall, 2 application (apply it to a new scenario), 2 synthesis (connect it to other topics). Ask one at a time and wait for my answer.\"\n    },\n    {\n      id: 'uc_1_4', stage: 1, stageName: \"AI as a Learning Accelerator\",\n      title: \"Feynman Enforcer\",\n      description: \"Explain a concept back to AI as if teaching a new engineer; it grades you and finds the gaps.\",\n      prompt: \"I am going to explain [concept] as if teaching a brand-new engineer. Grade my explanation on accuracy, completeness and clarity, name any misconception, score it 1 to 10, and tell me exactly what to study next.\"\n    },\n    {\n      id: 'uc_2_1', stage: 2, stageName: \"AI as a Productivity Multiplier\",\n      title: \"Automated Report Draft\",\n      description: \"Turn a raw export into a repeatable report, with AI listing what you must verify before you trust it.\",\n      prompt: \"Here is a raw data export: [paste or describe columns]. Draft the transform steps (Power Query or pandas) to turn it into a weekly [scrap/yield/downtime] report. Then list every field I must validate by hand before I trust the output.\"\n    },\n    {\n      id: 'uc_2_2', stage: 2, stageName: \"AI as a Productivity Multiplier\",\n      title: \"Dashboard Spec\",\n      description: \"Design a dashboard before building it, and surface the metrics that are easy to compute but misleading.\",\n      prompt: \"I need a dashboard for [metric] for [audience]. Propose the KPIs, the chart types, and the data model behind them. Flag any metric that is easy to compute but misleading, and tell me what an engineer should check before publishing it.\"\n    },\n    {\n      id: 'uc_2_3', stage: 2, stageName: \"AI as a Productivity Multiplier\",\n      title: \"Quality-Gate Builder\",\n      description: \"Have AI build the completeness checklist your document must pass, not the document itself.\",\n      prompt: \"I am writing a [SOP / control plan / FMEA / work instruction]. Generate a completeness checklist for this document type: every section, field, spec, owner and revision item it must contain. I will run my draft against it. Do NOT write the document, just the gate.\"\n    },\n    {\n      id: 'uc_2_4', stage: 2, stageName: \"AI as a Productivity Multiplier\",\n      title: \"Documentation From Notes\",\n      description: \"You provide the real data and decisions; AI structures it into a professional engineering document.\",\n      prompt: \"Here are my raw notes from [project/task]: [paste]. Structure them into a professional engineering document with Executive Summary, Background, Methodology, Results & Data, Recommendations and Next Steps. Flag any section where you need more information from me, and do not invent data.\"\n    },\n    {\n      id: 'uc_2_5', stage: 2, stageName: \"AI as a Productivity Multiplier\",\n      title: \"Senior-Engineer Review\",\n      description: \"Before submitting, have AI play a critical senior manufacturing/quality engineer.\",\n      prompt: \"Act as a senior manufacturing/quality engineer with 15 years of experience doing a review. Be critical. Look for correctness, maintainability, spec/safety issues, and anything a junior engineer might miss. Here is my [document/analysis/script]: [paste]\"\n    },\n    {\n      id: 'uc_3_1', stage: 3, stageName: \"AI as a Career Edge\",\n      title: \"Stay Current\",\n      description: \"A monthly pattern for tracking what matters in your target roles.\",\n      prompt: \"I am targeting [manufacturing / process / applications] engineering roles, focused on [areas]. What are the most important recent developments in Lean Six Sigma practice, manufacturing/quality analytics, and AI tools for engineers? For each, explain why it matters to my career and what to learn or build.\"\n    },\n    {\n      id: 'uc_3_2', stage: 3, stageName: \"AI as a Career Edge\",\n      title: \"Portfolio Differentiation\",\n      description: \"Find what makes each project impressive and how to position it.\",\n      prompt: \"Here is my project: [description]. Here is my target role: [role]. What makes this compelling to a hiring manager? What is the most impressive thing I might be underselling, and how should I describe it on my resume, LinkedIn and in interviews?\"\n    },\n    {\n      id: 'uc_3_3', stage: 3, stageName: \"AI as a Career Edge\",\n      title: \"Mock Interview\",\n      description: \"Run a structured mock interview before the real one.\",\n      prompt: \"I have an interview for [role] at [company]. Based on this job description: [paste], run a mock interview. Ask one question at a time, mixing behavioral, technical and problem-solving. After each answer give me: what I did well, what I missed, and how a top candidate would answer.\"\n    },\n    {\n      id: 'uc_3_4', stage: 3, stageName: \"AI as a Career Edge\",\n      title: \"Gap Analysis\",\n      description: \"A periodic audit against the job you want.\",\n      prompt: \"I am targeting [role/company] in [timeframe]. My current skills: [list]. The job description: [paste]. Do a gap analysis: what am I missing entirely, what do I have but need to deepen, what to prioritize in the next 90 days, and what project would best demonstrate the missing skills?\"\n    },\n    {\n      id: 'uc_3_5', stage: 3, stageName: \"AI as a Career Edge\",\n      title: \"Build in Public\",\n      description: \"Turn finished work into content that builds a professional reputation.\",\n      prompt: \"I just completed [project/learning]. Help me turn it into content valuable to other engineers: a LinkedIn post angle, a short technical blog outline, a GitHub README structure, and the key insights other manufacturing and process engineers would find genuinely useful.\"\n    },\n    {\n      id: 'uc_4_1', stage: 4, stageName: \"Engineering Judgment & AI Limits\",\n      title: \"Should AI Even Touch This?\",\n      description: \"Interrogate the decision to use AI before you build anything.\",\n      prompt: \"I am considering using AI for [task]. Interrogate the choice before I build: what problem does it actually solve, could a template, a simple rule, SPC or a spreadsheet do it instead, what happens if the output is wrong, and who gets hurt if nobody catches it? Do not let me use AI just because it is available.\"\n    },\n    {\n      id: 'uc_4_2', stage: 4, stageName: \"Engineering Judgment & AI Limits\",\n      title: \"Draw the Judgment Line\",\n      description: \"Split a task into what AI can safely draft and what an engineer must own.\",\n      prompt: \"For [task], split the work into the parts AI can safely draft and the parts that require engineering judgment (root-cause conclusions, risk rankings, dispositions, spec and safety content). For each judgment part, say plainly why a human must own it.\"\n    },\n    {\n      id: 'uc_4_3', stage: 4, stageName: \"Engineering Judgment & AI Limits\",\n      title: \"Pressure-Test the Output\",\n      description: \"Make AI attack its own answer before you rely on it.\",\n      prompt: \"Here is AI-generated [analysis / number / document]: [paste]. Play skeptic: list every assumption it made, every place it could be wrong, and the exact checks I should run against the raw data before I trust or ship it.\"\n    },\n    {\n      id: 'uc_4_4', stage: 4, stageName: \"Engineering Judgment & AI Limits\",\n      title: \"Validate Before You Rely\",\n      description: \"Plan how you will validate and monitor anything AI-built that you depend on.\",\n      prompt: \"I want to rely on [AI-built dashboard / automated report / completeness-checker] going forward. Give me a validation plan: what to test it against, what failure modes to watch, how often to re-check it, and what manual fallback exists if it breaks.\"\n    }\n  ],\n    // ── AI Strategy Rules ─────────────────────────────────\n  // ── AI Strategy Rules (when to trust AI, and when judgment must own it) ──\n  aiRules: [\n    \"Understand before you use. Never ship AI output you cannot explain and defend line by line.\",\n    \"AI drafts, you decide. Every dashboard, report and document is your deliverable, and your judgment owns the final call.\",\n    \"AI is leverage, not a replacement. Use it to build dashboards faster, automate repetitive reporting, and check work for completeness, not to make the engineering decision for you.\",\n    \"Keep the engineering foundation first. Lean Six Sigma, SPC, root cause and DMAIC are the method; AI only multiplies an engineer who already knows the method.\",\n    \"Verify every number. AI miscalculates, mislabels units and invents sources. Treat its output as a draft to check against the raw data.\",\n    \"Never let AI own the spec, tolerance, disposition or safety content unchecked. If it is wrong there, it causes scrap, a recall or an audit finding.\",\n    \"Automate the repetitive, not the judgment. Good candidates: data cleaning, recurring reports, completeness checks, first-draft documentation. Off limits: root-cause conclusions, risk rankings, dispositions.\",\n    \"Give every quality gate explicit criteria. An AI completeness-checker is only as good as the rules you write for it, so write them down.\",\n    \"Document where you used AI. In every report, note what AI drafted and what you verified. That transparency is itself a professional skill.\",\n    \"Know when to turn it off. If you cannot state the problem clearly enough to check the answer, you are not ready to let AI near it.\"\n  ],\n\n  // ── Milestones (one deliverable per month / phase) ──\n    milestones: [\n    { week: 4, phase: 1, title: \"Month 1 deliverable: DMAIC charter + baseline SPC dashboard\", description: \"Process mapped, baseline capability (Cp/Cpk) established in JMP, and a reusable AI-assisted data-cleaning template.\" },\n    { week: 8, phase: 2, title: \"Month 2 deliverable: AI-assisted FMEA + automated report\", description: \"Root cause found and ranked, plus a recurring report that pulls, analyzes and auto-flags out-of-control conditions.\" },\n    { week: 12, phase: 3, title: \"Month 3 deliverable: SOP/control plan + customer spec response\", description: \"Documentation that passes an AI completeness gate, a DFM review and an RFQ response written to applications-engineering standard.\" },\n    { week: 16, phase: 4, title: \"Month 4 deliverable: end-to-end DMAIC capstone + published portfolio\", description: \"A full improvement project with quantified impact, packaged into a portfolio with STAR stories and impact-first resume bullets.\" }\n  ],\n\n  // ── AI tools ──\n    aiTools: [\n    { name: \"Claude\", url: \"claude.ai\", category: \"Assistant\", free: true, useCase: \"Primary learning, documentation and data-analysis assistant\" },\n    { name: \"ChatGPT\", url: \"chat.openai.com\", category: \"Assistant\", free: true, useCase: \"Alternative for concept explanations and drafting\" },\n    { name: \"GitHub Copilot\", url: \"github.com/features/copilot\", category: \"Code\", free: false, useCase: \"Code completion for Python data-automation scripts\" },\n    { name: \"Microsoft Copilot in Excel / Power BI\", url: \"microsoft.com/microsoft-365/copilot\", category: \"Data\", free: false, useCase: \"AI assistance inside spreadsheets and dashboards\" },\n    { name: \"Perplexity\", url: \"perplexity.ai\", category: \"Research\", free: true, useCase: \"Research and staying current with industry developments\" },\n    { name: \"Grammarly\", url: \"grammarly.com\", category: \"Writing\", free: true, useCase: \"Polishing technical documentation and LinkedIn posts\" }\n  ],\n\n  // ── Daily Planner Templates ──\n    dailyPlannerTemplates: {\n    1: { blocks: [{ label: 'Review', range: '0 to 25 min' }, { label: 'New concept', range: '25 to 55 min' }, { label: 'Log progress', range: '55 to 60 min' }], tip: 'At 1 hr/day, consistency beats intensity. One focused hour every day beats a 7-hour weekend binge.' },\n    2: { blocks: [{ label: 'Warm-up quiz', range: '0 to 20 min' }, { label: 'Core study', range: '20 to 60 min' }, { label: 'Hands-on exercise', range: '60 to 100 min' }, { label: 'Document', range: '100 to 120 min' }], tip: '2 hrs/day is the sweet spot for retention, time to learn AND do hands-on work in the same session.' },\n    3: { blocks: [{ label: 'Warm-up', range: '0 to 20 min' }, { label: 'Study block 1', range: '20 to 70 min' }, { label: 'Break', range: '70 to 75 min' }, { label: 'Study block 2', range: '75 to 135 min' }, { label: 'Project work', range: '135 to 180 min' }], tip: 'At 3 hrs you can cover new material and make meaningful project progress in the same sitting.' },\n    4: { blocks: [{ label: 'Warm-up', range: '0 to 15 min' }, { label: 'Study block 1', range: '15 to 75 min' }, { label: 'Break', range: '75 to 80 min' }, { label: 'Study block 2', range: '80 to 140 min' }, { label: 'Break', range: '140 to 145 min' }, { label: 'Project work', range: '145 to 205 min' }, { label: 'Document & commit', range: '205 to 240 min' }], tip: '4 hrs/day means you can finish a complete mini-project in one session. Use that momentum.' },\n    5: { blocks: [{ label: 'Warm-up', range: '0 to 15 min' }, { label: 'Study block 1', range: '15 to 75 min' }, { label: 'Break', range: '75 to 80 min' }, { label: 'Study block 2', range: '80 to 140 min' }, { label: 'Break', range: '140 to 145 min' }, { label: 'Project build', range: '145 to 205 min' }, { label: 'Break', range: '205 to 210 min' }, { label: 'Document', range: '210 to 270 min' }, { label: 'Publish/share', range: '270 to 300 min' }], tip: '5 hrs/day is intensive. Split into two separate sessions (morning + evening) for better retention.' }\n  },\n\n  // ── Study Session Presets ─────────────────────────────\n  sessionPresets: [\n    { title: \"DMAIC charter & process map\", topic: \"Scope a real problem, map current state (VSM), and set a measurable goal\" },\n    { title: \"Baseline SPC in JMP\", topic: \"X-bar/R and I-MR control charts, Cp/Cpk, and Western Electric rules\" },\n    { title: \"AI-assisted data cleaning\", topic: \"Prompts that preserve units and specs, Power Query/SQL, and validation checks\" },\n    { title: \"Root cause & FMEA\", topic: \"5-Why, fishbone, Pareto, and a process FMEA pressure-tested with AI\" },\n    { title: \"Automate a recurring report\", topic: \"SQL pull + pandas transform + Power BI output with auto-flagging\" },\n    { title: \"SOP & control plan with AI gate\", topic: \"Write the document, then build an AI completeness-checker that catches the gaps\" },\n    { title: \"Customer spec & DFM review\", topic: \"Spec-compliance matrix, DFM concerns, and an AI-drafted RFQ response\" },\n    { title: \"Portfolio & STAR prep\", topic: \"Package the deliverables, write STAR stories, and quantify resume bullets\" }\n  ],\n\n  // ── Tool & subscription costs ──\n    materials: {\n    phase1: {\n      hardware: [\n        { item: \"AI assistant plan: Claude Pro or ChatGPT Plus (monthly)\", cost: 20 }\n      ],\n      software: [\"Excel (or free Google Sheets / LibreOffice Calc)\", \"JMP free 30-day trial / JMP Student Edition\", \"DB Browser for SQLite (free)\", \"Python + VS Code (free)\"],\n      courses: [{ item: \"Lean Six Sigma Green Belt course (Coursera/Udemy)\", cost: 15 }]\n    },\n    phase2: {\n      hardware: [\n        { item: \"JMP license (commercial) if continuing past the trial\", cost: 99, optional: true }\n      ],\n      software: [\"Python + pandas (free)\", \"SQL: SQLite / PostgreSQL (free)\", \"Power BI Desktop (free)\"],\n      courses: [{ item: \"Power BI / DAX course\", cost: 15, optional: true }]\n    },\n    phase3: {\n      hardware: [\n        { item: \"Microsoft 365 / Office, if not already licensed (monthly)\", cost: 10, optional: true }\n      ],\n      software: [\"Excel / Docs templates (free)\", \"Your existing AI assistant plan\", \"PDF markup tool (free)\"],\n      courses: []\n    },\n    phase4: {\n      hardware: [\n        { item: \"Power BI Pro, to publish & share reports (monthly)\", cost: 10, optional: true }\n      ],\n      software: [\"Power BI Desktop (free)\", \"GitHub + GitHub Pages portfolio (free)\", \"Canva free tier (optional visuals)\"],\n      courses: [{ item: \"Interview-prep / resume course\", cost: 0, optional: true }]\n    },\n    totals: { required: 35, withOptionals: 169 }\n  }\n};\n\n// ─── Default Data Schema ───\nfunction getDefaultData() {\n  return {\n    currentWeek: 1,\n    hoursPerDay: 2,\n    profile: { targetRole: '', background: '', focus: '' },\n    tasks: {},\n    taskWeeks: {},\n    notes: {},\n    projects: {},\n    resources: {},\n    savedPrompts: [],\n    sessionLog: [],\n    lastBackup: null,\n    applications: [],\n    starStories: [],\n    careerChecklist: {},\n    settings: { apiKeySet: false }\n  };\n}
