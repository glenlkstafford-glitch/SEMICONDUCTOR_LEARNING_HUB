${proj.id}')\">Draft LinkedIn post<\u002Fbutton>`;\n    html += `<\u002Fdiv>`;\n\n    // ── AI Coach Panel (hidden) ──\n    html += `<div id=\"ai-coach-${proj.id}\" style=\"display:none; margin-bottom:var(--space-lg);\">`;\n    html += `<div class=\"ai-panel\">`;\n    html += `<div style=\"display:flex; justify-content:space-between; align-items:center; margin-bottom:var(--space-sm);\">`;\n    html += `<span class=\"ai-label\">AI Coach, ${proj.title}<\u002Fspan>`;\n    html += `<button class=\"btn btn-sm\" onclick=\"closeAICoach('${proj.id}')\">Close<\u002Fbutton>`;\n    html += `<\u002Fdiv>`;\n    html += `<div id=\"ai-coach-messages-${proj.id}\" style=\"max-height:300px; overflow-y:auto; margin-bottom:var(--space-sm);\"><\u002Fdiv>`;\n    html += `<div style=\"display:flex; gap:var(--space-sm);\">`;\n    html += `<input type=\"text\" id=\"ai-coach-input-${proj.id}\" placeholder=\"Ask a question about this project...\" style=\"flex:1;\" onkeydown=\"if(event.key==='Enter')sendCoachMessage('${proj.id}')\">`;\n    html += `<button class=\"btn btn-primary\" onclick=\"sendCoachMessage('${proj.id}')\">Send<\u002Fbutton>`;\n    html += `<\u002Fdiv>`;\n    html += `<\u002Fdiv><\u002Fdiv>`;\n\n    // ── Portfolio Status Selector ──\n    html += `<div style=\"border-top:1px solid var(--border); padding-top:var(--space-md); margin-bottom:var(--space-md);\">`;\n    html += `<div style=\"display:flex; align-items:center; gap:var(--space-md); flex-wrap:wrap;\">`;\n    html += `<div>`;\n    html += `<label>Portfolio status<\u002Flabel>`;\n    html += `<select onchange=\"updateProjectStatus('${proj.id}',this.value)\" style=\"width:auto;\">`;\n    PROJECT_STATUSES.forEach(s => {\n      html += `<option value=\"${s}\"${pd.status === s ? ' selected' : ''}>${s}<\u002Foption>`;\n    });\n    html += `<\u002Fselect>`;\n    html += `<\u002Fdiv>`;\n    html += `<\u002Fdiv><\u002Fdiv>`;\n\n    // ── Publishing Checklist ──\n    html += `<div style=\"margin-bottom:var(--space-sm);\">`;\n    html += `<h3 class=\"sub-label\">Publishing checklist<\u002Fh3>`;\n    PUBLISH_CHECKLIST.forEach(c => {\n      const cChecked = pd.publishChecklist[c.key] ? 'checked' : '';\n      html += `<div class=\"checkbox-row\">`;\n      html += `<input type=\"checkbox\" ${cChecked} onchange=\"togglePublishChecklist('${proj.id}','${c.key}',this.checked)\">`;\n      html += `<span style=\"font-size:13px; color:var(--text-secondary);\">${c.label}<\u002Fspan>`;\n      html += `<\u002Fdiv>`;\n    });\n    html += `<\u002Fdiv>`;\n\n  return html;\n}\n\n// ── Project Hub: Data Handlers ──\n\nfunction toggleDeliverable(projId, dKey, checked) {\n  updateData(d => {\n    if (!d.projects[projId]) d.projects[projId] = { status: 'Not started', deliverables: {}, publishChecklist: {}, report: {} };\n    d.projects[projId].deliverables[dKey] = checked;\n  });\n  refreshProjectMetrics(projId);\n}\n\nfunction saveReportField(projId, fieldKey, value) {\n  updateData(d => {\n    if (!d.projects[projId]) d.projects[projId] = { status: 'Not started', deliverables: {}, publishChecklist: {}, report: {} };\n    if (!d.projects[projId].report) d.projects[projId].report = {};\n    d.projects[projId].report[fieldKey] = value;\n  });\n  refreshProjectMetrics(projId, true);\n}\n\nfunction updateProjectStatus(projId, status) {\n  updateData(d => {\n    if (!d.projects[projId]) d.projects[projId] = { status: 'Not started', deliverables: {}, publishChecklist: {}, report: {} };\n    d.projects[projId].status = status;\n  });\n  // Show/hide LinkedIn button\n  const btn = document.getElementById(`linkedin-btn-${projId}`);\n  if (btn) btn.style.display = (status === 'Ready to publish' || status === 'Published') ? '' : 'none';\n  refreshProjectMetrics(projId);\n  showToast('Status updated', 'success');\n}\n\nfunction togglePublishChecklist(projId, key, checked) {\n  updateData(d => {\n    if (!d.projects[projId]) d.projects[projId] = { status: 'Not started', deliverables: {}, publishChecklist: {}, report: {} };\n    if (!d.projects[projId].publishChecklist) d.projects[projId].publishChecklist = {};\n    d.projects[projId].publishChecklist[key] = checked;\n  });\n  refreshProjectMetrics(projId);\n}\n\n// ── Project Hub: AI Features ──\n\nasync function draftReportSection(projId, fieldKey, fieldLabel, btn) {\n  const proj = HUB_DATA.projects.find(p => p.id === projId);\n  if (!proj) return;\n  const pd = getProjectData(projId);\n  const existing = pd.report[fieldKey] || '';\n  const context = `Project: ${proj.title}\\nTech Stack: ${proj.techStack.join(', ')}\\nProblem: ${proj.brief.problem}\\nObjectives: ${proj.brief.objectives.join('; ')}`;\n\n  const prompt = `${context}\\n\\nDraft the \"${fieldLabel}\" section of my project report.${existing ? ' Here are my existing notes for this section: ' + existing : ''} Write 2-4 paragraphs in first person, technical and specific. Do not use placeholder text.`;\n\n  btn.disabled = true;\n  btn.textContent = 'Drafting...';\n  const result = await callAI(prompt);\n  btn.disabled = false;\n  btn.textContent = 'Draft with AI';\n\n  if (result) {\n    const textarea = btn.closest('div').nextElementSibling;\n    if (textarea && textarea.tagName === 'TEXTAREA') {\n      textarea.value = result;\n      saveReportField(projId, fieldKey, result);\n      showToast(`${fieldLabel} drafted`, 'success');\n    }\n  }\n}\n\nfunction openAICoach(projId) {\n  const panel = document.getElementById(`ai-coach-${projId}`);\n  if (panel) panel.style.display = 'block';\n}\n\nfunction closeAICoach(projId) {\n  const panel = document.getElementById(`ai-coach-${projId}`);\n  if (panel) panel.style.display = 'none';\n  const messages = document.getElementById(`ai-coach-messages-${projId}`);\n  if (messages) messages.innerHTML = '';\n}\n\nasync function sendCoachMessage(projId) {\n  const input = document.getElementById(`ai-coach-input-${projId}`);\n  const messagesDiv = document.getElementById(`ai-coach-messages-${projId}`);\n  if (!input || !messagesDiv) return;\n  const userMsg = input.value.trim();\n  if (!userMsg) return;\n  input.value = '';\n\n  const proj = HUB_DATA.projects.find(p => p.id === projId);\n  const pd = getProjectData(projId);\n  const reportSummary = REPORT_FIELDS.map(f => pd.report[f.key] ? `${f.label}: ${pd.report[f.key].substring(0, 100)}...` : '').filter(Boolean).join('\\n');\n\n  // Add user message to UI\n  messagesDiv.innerHTML += `<div style=\"margin-bottom:var(--space-sm); padding:var(--space-sm); border-radius:var(--radius-sm); background:var(--bg-card);\"><span style=\"font-family:var(--font-mono); font-size:10px; color:var(--text-muted);\">YOU<\u002Fspan><div style=\"font-size:13px; margin-top:2px;\">${userMsg.replace(/<\u002Fg,'&lt;').replace(/>/g,'&gt;')}<\u002Fdiv><\u002Fdiv>`;\n\n  // Limit to last 8 messages shown\n  const allMsgs = messagesDiv.querySelectorAll(':scope > div');\n  if (allMsgs.length > 8) allMsgs[0].remove();\n\n  messagesDiv.innerHTML += `<div id=\"coach-loading-${projId}\" style=\"padding:var(--space-sm);\"><div class=\"spinner\"><\u002Fdiv><\u002Fdiv>`;\n  messagesDiv.scrollTop = messagesDiv.scrollHeight;\n\n  const context = `Project: ${proj.title}\\nTech Stack: ${proj.techStack.join(', ')}\\nObjectives: ${proj.brief.objectives.join('; ')}\\n${reportSummary ? 'Current report notes:\\n' + reportSummary : ''}`;\n  const prompt = `Context about the project I'm working on:\\n${context}\\n\\nMy question: ${userMsg}`;\n\n  const result = await callAI(prompt);\n  const loader = document.getElementById(`coach-loading-${projId}`);\n  if (loader) loader.remove();\n\n  if (result) {\n    messagesDiv.innerHTML += `<div style=\"margin-bottom:var(--space-sm); padding:var(--space-sm); border-radius:var(--radius-sm); background:var(--bg-ai);\"><span style=\"font-family:var(--font-mono); font-size:10px; color:var(--accent);\">AI COACH<\u002Fspan><div style=\"font-size:13px; margin-top:2px; white-space:pre-wrap;\">${result.replace(/<\u002Fg,'&lt;').replace(/>/g,'&gt;')}<\u002Fdiv><\u002Fdiv>`;\n    // Limit again\n    const msgs2 = messagesDiv.querySelectorAll(':scope > div');\n    while (msgs2.length > 8) msgs2[0].remove();\n  }\n  messagesDiv.scrollTop = messagesDiv.scrollHeight;\n}\n\nfunction generateStudyPrompt(projId) {\n  const proj = HUB_DATA.projects.find(p => p.id === projId);\n  if (!proj) return;\n  const data = getData();\n  const week = data.currentWeek || 1;\n  const phase = getCurrentPhase();\n  const done = getDoneTasks();\n  const total = getTotalTasks();\n\n  const prompt = `${learnerLine()}, currently in week ${week} of a self-directed program (Phase ${phase}, ${Math.round(done/total*100)}% complete).\n\nI am working on the project: \"${proj.title}\"\nType: ${proj.type} | Difficulty: ${proj.difficulty} | Estimated hours: ${proj.estimatedHours}\nTech stack: ${proj.techStack.join(', ')}\n\nProblem statement: ${proj.brief.problem}\n\nObjectives:\n${proj.brief.objectives.map((o,i) => `${i+1}. ${o}`).join('\\n')}\n\nDeliverables:\n${proj.brief.deliverables.map((d,i) => `${i+1}. ${d}`).join('\\n')}\n\n${learnerLine()}.\n\nHelp me work through this project. Start by explaining the high-level approach, then guide me step by step. Build on what I already know where possible, and hold the code to production standards, clear class boundaries, no duplicated state, a test for each failure mode. Ask me questions to check understanding before moving to the next step.`;\n\n  copyToClipboard(prompt);\n}\n\nfunction exportReport(projId) {\n  const proj = HUB_DATA.projects.find(p => p.id === projId);\n  if (!proj) return;\n  const pd = getProjectData(projId);\n  const phaseColor = HUB_DATA.phases[proj.phase - 1].color;\n  const exportDate = new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });\n\n  let reportHTML = `<!DOCTYPE html><html lang=\"en\"><head><meta charset=\"UTF-8\"><title>${proj.title}: Project Report<\u002Ftitle>\n<link href=\"https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600;700&display=swap\" rel=\"stylesheet\">\n<style>\n*{box-sizing:border-box;margin:0;padding:0}\n:root{--ink:#1c1611;--muted:#7a6e62;--line:#e6e0d8;--accent:#a56b12;}\nbody{font-family:'Geist','Helvetica Neue',sans-serif;font-size:15px;line-height:1.7;color:var(--ink);background:#fff;}\n.container{max-width:820px;margin:0 auto;padding:0 28px 56px;}\n.report-head{border-bottom:2px solid var(--ink);padding:34px 0 20px;margin-bottom:28px;display:flex;align-items:flex-start;gap:16px;}\n.report-head .mark{width:40px;height:40px;flex-shrink:0;}\n.brand-eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;}\nh1{font-family:'Instrument Serif',Georgia,serif;font-weight:400;letter-spacing:-.015em;font-size:38px;line-height:1.15;color:var(--ink);}\n.meta{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px;font-family:'IBM Plex Mono',monospace;font-size:11px;font-variant-numeric:tabular-nums;}\n.meta .badge{padding:3px 11px;border-radius:999px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;border:1px solid var(--line);}\n.tech-tags{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 8px;}\n.tech-tags span{padding:3px 10px;border:1px solid var(--line);border-radius:4px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:#555;}\nh2{font-family:'IBM Plex Mono',monospace;font-weight:500;text-transform:uppercase;letter-spacing:.16em;font-size:11px;margin-top:30px;margin-bottom:10px;padding-bottom:7px;border-bottom:1px solid var(--line);color:var(--ink);}\n.section-content{margin-bottom:22px;white-space:pre-wrap;}\n.empty{color:#9aa0a6;font-style:italic;}\n.ai-callout{background:#f4f8f5;border:1px solid #dbe9e0;border-radius:8px;padding:16px 18px;margin-top:30px;}\n.ai-callout h2{border:none;margin-top:0;color:var(--accent);}\n.print-btn{position:fixed;top:18px;right:18px;padding:9px 16px;background:var(--ink);color:#fff;border:none;border-radius:6px;cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.04em;}\n.print-btn:hover{background:#000;}\nfooter{margin-top:48px;padding-top:16px;border-top:1px solid var(--line);font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);display:flex;align-items:center;gap:8px;justify-content:center;}\nfooter svg{width:16px;height:16px;}\n@media print{body{font-size:12pt;}.container{max-width:none;padding:0 12mm 12mm;}.print-btn{display:none;}h2,.ai-callout{page-break-inside:avoid;break-inside:avoid;}.report-head{page-break-after:avoid;}}\n<\u002Fstyle><\u002Fhead><body>\n<button class=\"print-btn\" onclick=\"window.print()\">Print / Save PDF<\u002Fbutton>\n<div class=\"container\">\n<div class=\"report-head\">\n<svg class=\"mark\" viewBox=\"0 0 32 32\"><circle cx=\"16\" cy=\"16\" r=\"11\" fill=\"none\" stroke=\"#2d6a4f\" stroke-width=\"1.6\"/><circle cx=\"16\" cy=\"16\" r=\"6\" fill=\"none\" stroke=\"#2d6a4f\" stroke-width=\"1\" opacity=\"0.5\"/><line x1=\"16\" y1=\"4\" x2=\"16\" y2=\"28\" stroke=\"#2d6a4f\" stroke-width=\"0.9\" opacity=\"0.4\"/><line x1=\"4\" y1=\"16\" x2=\"28\" y2=\"16\" stroke=\"#2d6a4f\" stroke-width=\"0.9\" opacity=\"0.4\"/><path d=\"M12.5 26.4 h7\" stroke=\"#fff\" stroke-width=\"3\"/><\u002Fsvg>\n<div style=\"flex:1;\">\n<div class=\"brand-eyebrow\">Engineering Learning Hub · Project Report<\u002Fdiv>\n<h1>${proj.title}<\u002Fh1>\n<div class=\"meta\">\n<span class=\"badge\" style=\"background:${phaseColor}20;color:${phaseColor};border-color:${phaseColor}55;\">Phase ${proj.phase}<\u002Fspan>\n<span class=\"badge\" style=\"color:#555;\">${proj.type === 'capstone' ? 'Capstone' : 'Mini-Project'}<\u002Fspan>\n<span class=\"badge\" style=\"background:#fef3c7;color:#92400e;border-color:#f3d58a;\">${proj.difficulty}<\u002Fspan>\n<span style=\"color:#888;\">${exportDate}<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"tech-tags\">`;\n  proj.techStack.forEach(t => { reportHTML += `<span>${t}<\u002Fspan>`; });\n  reportHTML += `<\u002Fdiv>`;\n\n  REPORT_FIELDS.forEach(f => {\n    const content = pd.report[f.key];\n    if (f.key === 'aiToolsUsed') {\n      reportHTML += `<div class=\"ai-callout\"><h2>${f.label}<\u002Fh2><div class=\"section-content\">${content ? content.replace(/<\u002Fg,'&lt;').replace(/>/g,'&gt;') : '<span class=\"empty\">Not yet completed<\u002Fspan>'}<\u002Fdiv><\u002Fdiv>`;\n    } else {\n      reportHTML += `<h2>${f.label}<\u002Fh2><div class=\"section-content\">${content ? content.replace(/<\u002Fg,'&lt;').replace(/>/g,'&gt;') : '<span class=\"empty\">Not yet completed<\u002Fspan>'}<\u002Fdiv>`;\n    }\n  });\n\n  reportHTML += `<footer><svg viewBox=\"0 0 32 32\"><circle cx=\"16\" cy=\"16\" r=\"11\" fill=\"none\" stroke=\"#6b7280\" stroke-width=\"1.6\"/><line x1=\"16\" y1=\"5\" x2=\"16\" y2=\"27\" stroke=\"#6b7280\" stroke-width=\"0.8\" opacity=\"0.5\"/><line x1=\"5\" y1=\"16\" x2=\"27\" y2=\"16\" stroke=\"#6b7280\" stroke-width=\"0.8\" opacity=\"0.5\"/><path d=\"M12.5 26.4 h7\" stroke=\"#fff\" stroke-width=\"3\"/><\u002Fsvg>Generated by the Engineering Learning Hub · ${exportDate}<\u002Ffooter><\u002Fdiv><\u002Fbody><\u002Fhtml>`;\n\n  const win = window.open('', '_blank');\n  if (win) {\n    win.document.write(reportHTML);\n    win.document.close();\n  } else {\n    showToast('Pop-up blocked: allow pop-ups for this page', 'error');\n  }\n}\n\n// Show a read-only prompt in the modal with a Copy-to-Clipboard action.\nfunction showPromptModal(title, prompt) {\n  const safe = prompt.replace(/<\u002Fg, '&lt;').replace(/>/g, '&gt;');\n  openModal(\n    title,\n    `<div class=\"ai-panel\"><div class=\"ai-label\">Copy this into your AI assistant<\u002Fdiv><div id=\"promptModalText\" style=\"white-space:pre-wrap; font-size:13px; max-height:50vh; overflow-y:auto;\">${safe}<\u002Fdiv><\u002Fdiv>`,\n    `<button class=\"btn\" onclick=\"closeModal()\">Close<\u002Fbutton><button class=\"btn btn-primary\" onclick=\"copyToClipboard(document.getElementById('promptModalText').textContent);closeModal();\">Copy to Clipboard<\u002Fbutton>`\n  );\n}\n\n// Build a grading prompt from this project's report content + the weighted rubric.\nfunction copyGradingPrompt(projId) {\n  const proj = HUB_DATA.projects.find(p => p.id === projId);\n  if (!proj) return;\n  const pd = getProjectData(projId);\n\n  let report = '';\n  REPORT_FIELDS.forEach(f => {\n    const c = (pd.report[f.key] || '').trim();\n    report += `\\n## ${f.label}\\n${c || '[not written yet]'}\\n`;\n  });\n  const rubric = REPORT_RUBRIC.map(r => `- ${r.label} (${r.weight}%): ${r.desc}`).join('\\n');\n\n  const prompt = `You are a senior engineering manager grading a project report written by a self-study engineer moving into a manufacturing, process, or applications engineering role, grounded in Lean Six Sigma with AI used as leverage.\n\nGrade the report below against this weighted rubric (weights sum to 100):\n${rubric}\n\nFor each criterion: give a score 0 to 100, a one-line justification, and the weighted contribution (score × weight ÷ 100). Then provide:\n- An overall weighted total out of 100.\n- The 3 biggest strengths.\n- The 3 most important, specific gaps to fix (reference the actual content, not generic advice).\n\n=== PROJECT: ${proj.title} ===\nTech stack: ${proj.techStack.join(', ')}\n${report}`;\n\n  showPromptModal('Grading Prompt: ' + proj.title, prompt);\n}\n\n// Build a prompt that turns grading feedback into a prioritized revision plan.\nfunction copyRevisionPrompt(projId) {\n  const proj = HUB_DATA.projects.find(p => p.id === projId);\n  if (!proj) return;\n\n  const prompt = `I had my engineering project report \"${proj.title}\" graded against a weighted rubric. The grader's feedback is pasted below.\n\nTurn this feedback into a prioritized, actionable revision plan:\n- Order tasks by impact on the grade (highest first).\n- For each task: which report section it affects, the concrete edit to make, and a rough time estimate.\n- Flag anything that needs new data or experiments vs. just rewriting.\n- End with a short checklist I can work through.\n\n=== GRADER FEEDBACK (paste below) ===\n[Paste the grading feedback here]`;\n\n  showPromptModal('Revision-Plan Prompt: ' + proj.title, prompt);\n}\n\nasync function draftLinkedInPost(projId) {\n  const proj = HUB_DATA.projects.find(p => p.id === projId);\n  if (!proj) return;\n  const pd = getProjectData(projId);\n  const results = pd.report.results || '';\n\n  const prompt = `Write a professional LinkedIn post (150-250 words) about completing this automation engineering project:\nTitle: ${proj.title}\nTech Stack: ${proj.techStack.join(', ')}\nResults: ${results || 'Project completed successfully.'}\n\nThe post should:\n- Open with a hook that grabs attention\n- Briefly explain the technical challenge\n- Highlight what was learned\n- End with a forward-looking statement\n- Include 3-5 relevant hashtags\n- Be written in first person, professional but approachable tone\n- NOT use emojis`;\n\n  openModal('Drafting LinkedIn Post...', '<div style=\"text-align:center; padding:var(--space-xl);\"><div class=\"spinner\"><\u002Fdiv><\u002Fdiv>');\n  const result = await callAI(prompt);\n  if (result) {\n    openModal('LinkedIn Post Draft', `<div class=\"ai-panel\"><div class=\"ai-label\">AI-Generated Draft<\u002Fdiv><div style=\"white-space:pre-wrap;\">${result.replace(/<\u002Fg,'&lt;').replace(/>/g,'&gt;')}<\u002Fdiv><\u002Fdiv>`, `<button class=\"btn\" onclick=\"closeModal()\">Close<\u002Fbutton><button class=\"btn btn-primary\" onclick=\"copyToClipboard(document.querySelector('#modalBody .ai-panel div:last-child').textContent);closeModal();\">Copy to Clipboard<\u002Fbutton>`);\n  } else {\n    closeModal();\n  }\n}\n\n// ═══════════════════════════════════════════════════════\n//  TAB 4: PORTFOLIO TRACKER\n// ═══════════════════════════════════════════════════════\n\nlet _portfolioFilters = { phase: 'all', status: 'all', published: 'all', tech: 'all', careerTier: 'all' };\n\nfunction getAllTechTags() {\n  const tags = new Set();\n  HUB_DATA.projects.forEach(p => p.techStack.forEach(t => tags.add(t)));\n  return [...tags].sort();\n}\n\nfunction getFilteredPortfolioProjects() {\n  const data = getData();\n  const f = _portfolioFilters;\n  return HUB_DATA.projects.filter(p => {\n    const pd = data.projects[p.id] || { status: 'Not started' };\n    if (f.phase !== 'all' && p.phase !== parseInt(f.phase)) return false;\n    if (f.status !== 'all' && pd.status !== f.status) return false;\n    if (f.published === 'published' && pd.status !== 'Published') return false;\n    if (f.published === 'unpublished' && pd.status === 'Published') return false;\n    if (f.tech !== 'all' && !p.techStack.includes(f.tech)) return false;\n    if (f.careerTier === '1' && p.careerTier !== 1) return false;\n    if (f.careerTier === '2' && p.careerTier !== 2) return false;\n    if (f.careerTier === 'pullforward' && !p.pullForward) return false;\n    return true;\n  });\n}\n\nfunction renderPortfolioTracker() {\n  const data = getData();\n  const allTechs = getAllTechTags();\n\n  let total = HUB_DATA.projects.length;\n  let inProgress = 0, readyToPublish = 0, published = 0;\n  HUB_DATA.projects.forEach(p => {\n    const pd = data.projects[p.id];\n    if (!pd) return;\n    if (pd.status === 'In progress' || pd.status === 'Report drafted') inProgress++;\n    else if (pd.status === 'Ready to publish') readyToPublish++;\n    else if (pd.status === 'Published') published++;\n  });\n\n  let html = '';\n\n  // Summary Stats\n  html += '<div class=\"grid-4\" style=\"margin-bottom:var(--space-lg);\">';\n  html += '<div class=\"stat-card\"><div class=\"stat-value\">' + total + '<\u002Fdiv><div class=\"stat-label\">Total projects<\u002Fdiv><\u002Fdiv>';\n  html += '<div class=\"stat-card\"><div class=\"stat-value\" style=\"color:var(--status-in-progress);\">' + inProgress + '<\u002Fdiv><div class=\"stat-label\">In progress<\u002Fdiv><\u002Fdiv>';\n  html += '<div class=\"stat-card\"><div class=\"stat-value\" style=\"color:var(--phase-2);\">' + readyToPublish + '<\u002Fdiv><div class=\"stat-label\">Ready to publish<\u002Fdiv><\u002Fdiv>';\n  html += '<div class=\"stat-card\"><div class=\"stat-value\" style=\"color:var(--state-run);\">' + published + '<\u002Fdiv><div class=\"stat-label\">Published<\u002Fdiv><\u002Fdiv>';\n  html += '<\u002Fdiv>';\n\n  // Filter Row\n  html += '<div class=\"control-bar\">';\n\n  html += '<div><label>Phase<\u002Flabel><select onchange=\"_portfolioFilters.phase=this.value;renderPortfolioTracker();\" style=\"width:auto;\">';\n  html += '<option value=\"all\"' + (_portfolioFilters.phase === 'all' ? ' selected' : '') + '>All phases<\u002Foption>';\n  for (let i = 1; i <= HUB_DATA.phases.length; i++) {\n    html += '<option value=\"' + i + '\"' + (_portfolioFilters.phase == i ? ' selected' : '') + '>Phase ' + i + '<\u002Foption>';\n  }\n  html += '<\u002Fselect><\u002Fdiv>';\n\n  html += '<div><label>Status<\u002Flabel><select onchange=\"_portfolioFilters.status=this.value;renderPortfolioTracker();\" style=\"width:auto;\">';\n  html += '<option value=\"all\"' + (_portfolioFilters.status === 'all' ? ' selected' : '') + '>All Statuses<\u002Foption>';\n  PROJECT_STATUSES.forEach(function(s) {\n    html += '<option value=\"' + s + '\"' + (_portfolioFilters.status === s ? ' selected' : '') + '>' + s + '<\u002Foption>';\n  });\n  html += '<\u002Fselect><\u002Fdiv>';\n\n  html += '<div><label>Published<\u002Flabel><select onchange=\"_portfolioFilters.published=this.value;renderPortfolioTracker();\" style=\"width:auto;\">';\n  html += '<option value=\"all\"' + (_portfolioFilters.published === 'all' ? ' selected' : '') + '>All<\u002Foption>';\n  html += '<option value=\"published\"' + (_portfolioFilters.published === 'published' ? ' selected' : '') + '>Published<\u002Foption>';\n  html += '<option value=\"unpublished\"' + (_portfolioFilters.published === 'unpublished' ? ' selected' : '') + '>Unpublished<\u002Foption>';\n  html += '<\u002Fselect><\u002Fdiv>';\n\n  html += '<div><label>Tech<\u002Flabel><select onchange=\"_portfolioFilters.tech=this.value;renderPortfolioTracker();\" style=\"width:auto;\">';\n  html += '<option value=\"all\"' + (_portfolioFilters.tech === 'all' ? ' selected' : '') + '>All Tech<\u002Foption>';\n  allTechs.forEach(function(t) {\n    html += '<option value=\"' + t + '\"' + (_portfolioFilters.tech === t ? ' selected' : '') + '>' + t + '<\u002Foption>';\n  });\n  html += '<\u002Fselect><\u002Fdiv>';\n\n  html += '<div><label>Career tier<\u002Flabel><select onchange=\"_portfolioFilters.careerTier=this.value;renderPortfolioTracker();\" style=\"width:auto;\">';\n  html += '<option value=\"all\"' + (_portfolioFilters.careerTier === 'all' ? ' selected' : '') + '>All Tiers<\u002Foption>';\n  html += '<option value=\"1\"' + (_portfolioFilters.careerTier === '1' ? ' selected' : '') + '>Tier 1: Flagship<\u002Foption>';\n  html += '<option value=\"2\"' + (_portfolioFilters.careerTier === '2' ? ' selected' : '') + '>Tier 2: Light writeup<\u002Foption>';\n  html += '<option value=\"pullforward\"' + (_portfolioFilters.careerTier === 'pullforward' ? ' selected' : '') + '>Pull-forward<\u002Foption>';\n  html += '<\u002Fselect><\u002Fdiv>';\n\n  html += '<div style=\"display:flex; gap:var(--space-sm); margin-left:auto;\">';\n  html += '<button class=\"btn btn-primary\" onclick=\"copyPortfolioSummary()\">Copy portfolio summary<\u002Fbutton>';\n  html += '<button class=\"btn\" onclick=\"openCareerGapAnalysis()\">Career gap analysis<\u002Fbutton>';\n  html += '<\u002Fdiv>';\n  html += '<\u002Fdiv>';\n\n  // Card Grid\n  var filtered = getFilteredPortfolioProjects();\n\n  if (filtered.length === 0) {\n    html += '<div class=\"tab-placeholder\" style=\"min-height:150px;\"><div>No projects match the current filters.<\u002Fdiv><\u002Fdiv>';\n  } else {\n    html += '<div class=\"portfolio-grid\">';\n    filtered.forEach(function(proj) {\n      var pd = data.projects[proj.id] || { status: 'Not started', publishChecklist: {} };\n      var phaseColor = HUB_DATA.phases[proj.phase - 1].color;\n      var statusClass = pd.status === 'Published' || pd.status === 'complete' ? 'pill-complete' :\n                        pd.status === 'Not started' ? 'pill-not-started' : 'pill-in-progress';\n\n      html += '<div class=\"card pf-card\" style=\"border-left:2px solid ' + phaseColor + ';\">';\n\n      html += '<div style=\"display:flex; justify-content:space-between; align-items:flex-start; gap:10px;\">';\n      html += '<span class=\"pf-title\">' + proj.title + '<\u002Fspan>';\n      html += '<span class=\"badge badge-phase-' + proj.phase + '\" style=\"flex-shrink:0;\">P' + proj.phase + '<\u002Fspan>';\n      html += '<\u002Fdiv>';\n\n      html += '<div><span class=\"pill ' + statusClass + '\">' + pd.status + '<\u002Fspan><\u002Fdiv>';\n\n      // Career tier badges\n      var tierBadges = careerTierBadges(proj);\n      if (tierBadges) {\n        html += '<div style=\"display:flex; gap:5px; flex-wrap:wrap;\">' + tierBadges + '<\u002Fdiv>';\n      }\n\n      // Tech stack pills\n      html += '<div style=\"display:flex; gap:5px; flex-wrap:wrap;\">';\n      proj.techStack.forEach(function(t) { html += '<span class=\"tag\">' + t + '<\u002Fspan>'; });\n      html += '<\u002Fdiv>';\n\n      // Publish status icons\n      var pc = pd.publishChecklist || {};\n      var pubIcons = [\n        { key: 'github_readme', label: 'README' },\n        { key: 'code_pushed', label: 'GIT' },\n        { key: 'linkedin', label: 'LI' },\n        { key: 'portfolio', label: 'WEB' },\n        { key: 'video', label: 'VID' }\n      ];\n      html += '<div style=\"display:flex; gap:5px; flex-wrap:wrap; margin-top:auto; padding-top:4px;\">';\n      pubIcons.forEach(function(ic) {\n        html += '<span class=\"pub-chip' + (pc[ic.key] ? ' on' : '') + '\" title=\"' + ic.label + '\">' + ic.label + '<\u002Fspan>';\n      });\n      html += '<\u002Fdiv>';\n\n      html += '<\u002Fdiv>';\n    });\n    html += '<\u002Fdiv>';\n  }\n\n  document.getElementById('portfolioContent').innerHTML = html;\n}\n\nfunction copyPortfolioSummary() {\n  var data = getData();\n  var publishedProjects = HUB_DATA.projects.filter(function(p) {\n    var pd = data.projects[p.id];\n    return pd && pd.status === 'Published';\n  });\n\n  if (publishedProjects.length === 0) {\n    showToast('No published projects yet', 'info');\n    return;\n  }\n\n  var text = 'AUTOMATION ENGINEERING PORTFOLIO\\n';\n  text += '================================\\n\\n';\n\n  publishedProjects.forEach(function(p) {\n    var phaseName = HUB_DATA.phases[p.phase - 1].name;\n    text += p.title + ' (' + (p.type === 'capstone' ? 'Capstone' : 'Mini-Project') + ')\\n';\n    text += 'Phase ' + p.phase + ': ' + phaseName + ' | ' + p.techStack.join(', ') + '\\n';\n    var pd = data.projects[p.id];\n    if (pd && pd.report && pd.report.results) {\n      var r = pd.report.results;\n      text += 'Results: ' + r.substring(0, 200) + (r.length > 200 ? '...' : '') + '\\n';\n    }\n    text += '\\n';\n  });\n\n  text += 'Total: ' + publishedProjects.length + ' published project' + (publishedProjects.length !== 1 ? 's' : '');\n  copyToClipboard(text);\n}\n\nfunction openCareerGapAnalysis() {\n  var data = getData();\n  var skills = [];\n  var seen = {};\n  HUB_DATA.projects.forEach(function(p) {\n    var pd = data.projects[p.id];\n    if (pd && pd.status !== 'Not started') {\n      p.techStack.forEach(function(t) { if (!seen[t]) { seen[t] = true; skills.push(t); } });\n    }\n  });\n\n  var prompt = 'I am targeting a manufacturing, process, or applications engineering role.\\n\\n' +\n    'Here are my current skills demonstrated through portfolio projects: ' + (skills.length > 0 ? skills.join(', ') : 'None yet, just starting the program') + '.\\n\\n' +\n    'Here is the job description: [PASTE JOB DESCRIPTION HERE]\\n\\n' +\n    'Do a gap analysis:\\n' +\n    '(1) What skills am I missing entirely?\\n' +\n    '(2) What skills do I have but need to deepen?\\n' +\n    '(3) What should I prioritize in the next 90 days?\\n' +\n    '(4) What projects would best demonstrate the missing skills?\\n\\n' +\n    'My background: I am in a 16-week self-study program built on Lean Six Sigma (DMAIC, process mapping, SPC, process capability, root cause, FMEA), with AI used as leverage, building dashboards, automating repetitive reporting, and creating templates that guarantee completeness and quality, never replacing engineering judgment. Tools I work in: JMP, Python, SQL, Power BI and Excel.';\n\n  window._careerGapPrompt = prompt;\n\n  openModal('Career Gap Analysis',\n    '<p style=\"color:var(--text-secondary); margin-bottom:var(--space-md);\">Copy this prompt and paste a target job description where indicated. Use with Claude or ChatGPT for a detailed gap analysis.<\u002Fp>' +\n    '<div class=\"mono-block\">' + prompt.replace(/<\u002Fg, '&lt;').replace(/>/g, '&gt;') + '<\u002Fdiv>',\n    '<button class=\"btn\" onclick=\"closeModal()\">Close<\u002Fbutton><button class=\"btn btn-primary\" onclick=\"copyToClipboard(window._careerGapPrompt);closeModal();\">Copy Prompt<\u002Fbutton>'\n  );\n}\n\n// ═══════════════════════════════════════════════════════\n//  TAB 5: RESOURCES LIBRARY\n// ═══════════════════════════════════════════════════════\n\nlet _resourceFilters = { topic: 'all', format: 'all', free: false, phase: 'all', priority: false };\n\nfunction getFilteredResources() {\n  var f = _resourceFilters;\n  return HUB_DATA.resources.filter(function(r) {\n    if (f.topic !== 'all' && r.topic !== f.topic) return false;\n    if (f.format !== 'all' && r.type !== f.format) return false;\n    if (f.free && !r.free) return false;\n    if (f.phase !== 'all' && r.phase !== parseInt(f.phase)) return false;\n    if (f.priority && !r.priority) return false;\n    return true;\n  });\n}\n\nfunction renderResourcesLibrary() {\n  var data = getData();\n  var html = '';\n\n  // Filter Row\n  html += '<div class=\"control-bar\">';\n\n  // Topic\n  html += '<div><label>Topic<\u002Flabel><select onchange=\"_resourceFilters.topic=this.value;renderResourcesLibrary();\" style=\"width:auto;\">';\n  html += '<option value=\"all\"' + (_resourceFilters.topic === 'all' ? ' selected' : '') + '>All topics<\u002Foption>';\n  var _topics = [];\n  HUB_DATA.resources.forEach(function(r) { if (_topics.indexOf(r.topic) === -1) _topics.push(r.topic); });\n  _topics.forEach(function(t) {\n    html += '<option value=\"' + t + '\"' + (_resourceFilters.topic === t ? ' selected' : '') + '>' + t + '<\u002Foption>';\n  });\n  html += '<\u002Fselect><\u002Fdiv>';\n\n  // Format\n  html += '<div><label>Format<\u002Flabel><select onchange=\"_resourceFilters.format=this.value;renderResourcesLibrary();\" style=\"width:auto;\">';\n  html += '<option value=\"all\"' + (_resourceFilters.format === 'all' ? ' selected' : '') + '>All formats<\u002Foption>';\n  ['book', 'video', 'course', 'doc', 'site'].forEach(function(f) {\n    html += '<option value=\"' + f + '\"' + (_resourceFilters.format === f ? ' selected' : '') + '>' + f.charAt(0).toUpperCase() + f.slice(1) + '<\u002Foption>';\n  });\n  html += '<\u002Fselect><\u002Fdiv>';\n\n  // Phase\n  html += '<div><label>Phase<\u002Flabel><select onchange=\"_resourceFilters.phase=this.value;renderResourcesLibrary();\" style=\"width:auto;\">';\n  html += '<option value=\"all\"' + (_resourceFilters.phase === 'all' ? ' selected' : '') + '>All phases<\u002Foption>';\n  for (var i = 1; i <= HUB_DATA.phases.length; i++) {\n    html += '<option value=\"' + i + '\"' + (_resourceFilters.phase == i ? ' selected' : '') + '>Phase ' + i + '<\u002Foption>';\n  }\n  html += '<\u002Fselect><\u002Fdiv>';\n\n  // Free only\n  html += '<div class=\"checkbox-row\" style=\"padding:0;\">';\n  html += '<input type=\"checkbox\" ' + (_resourceFilters.free ? 'checked' : '') + ' onchange=\"_resourceFilters.free=this.checked;renderResourcesLibrary();\">';\n  html += '<span style=\"font-family:var(--font-mono); font-size:11px; color:var(--text-secondary);\">Free only<\u002Fspan>';\n  html += '<\u002Fdiv>';\n\n  // Priority only\n  html += '<div class=\"checkbox-row\" style=\"padding:0;\">';\n  html += '<input type=\"checkbox\" ' + (_resourceFilters.priority ? 'checked' : '') + ' onchange=\"_resourceFilters.priority=this.checked;renderResourcesLibrary();\">';\n  html += '<span style=\"font-family:var(--font-mono); font-size:11px; color:var(--text-secondary);\">Priority only<\u002Fspan>';\n  html += '<\u002Fdiv>';\n\n  html += '<div style=\"display:flex; gap:var(--space-sm); margin-left:auto;\">';\n  html += '<button class=\"btn btn-primary\" onclick=\"copyReadingList()\">Copy reading list<\u002Fbutton>';\n  html += '<\u002Fdiv>';\n  html += '<\u002Fdiv>';\n\n  // Resource Cards\n  var filtered = getFilteredResources();\n  html += '<div style=\"font-family:var(--font-mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--text-muted); margin-bottom:var(--space-md);\">' + filtered.length + ' resources<\u002Fdiv>';\n\n  if (filtered.length === 0) {\n    html += '<div class=\"tab-placeholder\" style=\"min-height:150px;\"><div>No resources match the current filters.<\u002Fdiv><\u002Fdiv>';\n  } else {\n    var typeBadgeColors = { book: '#e8a33d', video: '#e0705a', course: '#74b1d6', doc: '#b394e0', site: '#6cc79f' };\n\n    html += '<div class=\"portfolio-grid\">';\n    filtered.forEach(function(res) {\n      var phaseColor = HUB_DATA.phases[res.phase - 1].color;\n      var resData = data.resources[res.id] || { started: false, completed: false };\n      var typeColor = typeBadgeColors[res.type] || 'var(--text-muted)';\n\n      html += '<div class=\"card res-card\" style=\"border-left:2px solid ' + phaseColor + ';\">';\n\n      html += '<div style=\"display:flex; justify-content:space-between; align-items:flex-start; gap:10px;\">';\n      html += '<a class=\"res-title\" href=\"https://' + res.url + '\" target=\"_blank\" rel=\"noopener\">' + res.name + '<\u002Fa>';\n      if (res.priority) html += '<span class=\"priority-star\" style=\"flex-shrink:0; display:inline-flex;\" title=\"Priority\"><svg viewBox=\"0 0 24 24\" fill=\"currentColor\" style=\"width:14px;height:14px;\"><path d=\"M12 2l2.9 6.3 6.9.7-5.1 4.6 1.4 6.8L12 17.6 5.9 21l1.4-6.8L2.2 9.6l6.9-.7z\"/><\u002Fsvg><\u002Fspan>';\n      html += '<\u002Fdiv>';\n\n      html += '<div style=\"display:flex; gap:5px; flex-wrap:wrap;\">';\n      html += '<span class=\"badge\" style=\"background:' + typeColor + '22; color:' + typeColor + ';\">' + res.type + '<\u002Fspan>';\n      html += '<span class=\"badge\" style=\"background:' + (res.free ? 'rgba(108,199,159,0.12)' : 'rgba(255,255,255,0.05)') + '; color:' + (res.free ? 'var(--state-run)' : 'var(--text-muted)') + ';\">' + (res.free ? 'Free' : 'Paid') + '<\u002Fspan>';\n      html += '<span class=\"badge badge-phase-' + res.phase + '\">Phase ' + res.phase + '<\u002Fspan>';\n      html += '<\u002Fdiv>';\n\n      html += '<a class=\"res-url\" href=\"https://' + res.url + '\" target=\"_blank\" rel=\"noopener\">' + res.url + '<\u002Fa>';\n\n      html += '<div class=\"res-progress\">';\n      html += '<div class=\"checkbox-row\" style=\"padding:0;\"><input type=\"checkbox\" ' + (resData.started ? 'checked' : '') + ' onchange=\"toggleResourceProgress(\\'' + res.id + '\\',\\'started\\',this.checked)\"><span>Started<\u002Fspan><\u002Fdiv>';\n      html += '<div class=\"checkbox-row\" style=\"padding:0;\"><input type=\"checkbox\" ' + (resData.completed ? 'checked' : '') + ' onchange=\"toggleResourceProgress(\\'' + res.id + '\\',\\'completed\\',this.checked)\"><span>Completed<\u002Fspan><\u002Fdiv>';\n      html += '<\u002Fdiv>';\n\n      html += '<\u002Fdiv>';\n    });\n    html += '<\u002Fdiv>';\n  }\n\n  document.getElementById('resourcesContent').innerHTML = html;\n}\n\nfunction toggleResourceProgress(resId, field, checked) {\n  updateData(function(d) {\n    if (!d.resources[resId]) d.resources[resId] = { started: false, completed: false };\n    d.resources[resId][field] = checked;\n  });\n}\n\nfunction copyReadingList() {\n  var text = 'LEARNING RESOURCES READING LIST\\n';\n  text += '===============================\\n\\n';\n\n  var _topics = [];\n  HUB_DATA.resources.forEach(function(r) { if (_topics.indexOf(r.topic) === -1) _topics.push(r.topic); });\n  _topics.forEach(function(topic) {\n    var topicResources = HUB_DATA.resources.filter(function(r) { return r.topic === topic; });\n    if (topicResources.length === 0) return;\n\n    text += topic.toUpperCase() + '\\n';\n    var line = '';\n    for (var j = 0; j < topic.length; j++) line += '-';\n    text += line + '\\n';\n    topicResources.forEach(function(r) {\n      text += (r.priority ? '* ' : '  ') + r.name + ' [' + r.type + '] ' + (r.free ? '(free)' : '(paid)') + ', ' + r.url + '\\n';\n    });\n    text += '\\n';\n  });\n\n  copyToClipboard(text);\n}\n\n// ═══════════════════════════════════════════════════════\n//  TAB 6: STUDY SESSION LAUNCHER\n// ═══════════════════════════════════════════════════════\n\nvar SESSION_TYPES = [\n  'Teach me the next concept',\n  'Help with my project',\n  'Debug an issue',\n  'Quiz me (active recall)',\n  \"Feynman technique: I'll explain, you grade\",\n  'Review my code (educational, not just fix)',\n  \"Today's study plan\",\n  'Help write my project report',\n  'Concept scaffolding from what I know',\n  'Rubber duck debugging'\n];\n\nfunction getPhaseForWeek(week) {\n  return phaseIdForWeek(week);\n}\n\nfunction getTrackForWeek(week) {\n  var wd = HUB_DATA.weeklyPlan[week - 1];\n  return wd ? wd.tracks.join(', ') : 'General review';\n}\n\n// Persist the week from the Study tab so the whole app stays in sync.\nfunction setStudyWeek() {\n  var weekInput = document.getElementById('studyWeek');\n  if (!weekInput) return;\n  var week = Math.min(TOTAL_WEEKS, Math.max(1, parseInt(weekInput.value) || 1));\n  updateData(function(d) { d.currentWeek = week; });\n  updateSidebarProgress();\n  updateStudyPromptPreview();\n}\n\n// Get the next N unchecked tasks (for a more detailed prompt).\nfunction getNextTasks(n) {\n  var data = getData();\n  var out = [];\n  for (var pi = 0; pi < HUB_DATA.phases.length && out.length < n; pi++) {\n    var phase = HUB_DATA.phases[pi];\n    for (var ti = 0; ti < phase.tracks.length && out.length < n; ti++) {\n      var track = phase.tracks[ti];\n      for (var ii = 0; ii < track.tasks.length && out.length < n; ii++) {\n        var key = 'p' + phase.id + '_t' + ti + '_i' + ii;\n        if (!data.tasks[key]) out.push({ task: track.tasks[ii], track: track.name });\n      }\n    }\n  }\n  return out;\n}\n\n// ─── Session Log (\"what I did today\") ───\nfunction saveSessionLogEntry() {\n  var input = document.getElementById('sessionLogInput');\n  if (!input) return;\n  var text = input.value.trim();\n  if (!text) { showToast('Write a quick note first', 'error'); return; }\n  var weekInput = document.getElementById('studyWeek');\n  var week = weekInput ? (parseInt(weekInput.value) || 1) : (getData().currentWeek || 1);\n  updateData(function(d) {\n    if (!d.sessionLog) d.sessionLog = [];\n    d.sessionLog.push({ date: new Date().toISOString().slice(0, 10), week: week, text: text });\n    // Keep the log from growing unbounded\n    if (d.sessionLog.length > 100) d.sessionLog = d.sessionLog.slice(-100);\n  });\n  input.value = '';\n  showToast('Session logged', 'success');\n  renderSessionLogList();\n  renderConsistency();\n  renderStatusBar();\n  updateStudyPromptPreview();\n}\n\nfunction deleteSessionLogEntry(idx) {\n  updateData(function(d) {\n    if (d.sessionLog) d.sessionLog.splice(idx, 1);\n  });\n  renderSessionLogList();\n  updateStudyPromptPreview();\n}\n\nfunction renderSessionLogList() {\n  var host = document.getElementById('sessionLogList');\n  if (!host) return;\n  var log = getData().sessionLog || [];\n  if (!log.length) {\n    host.innerHTML = '<div style=\"font-size:12px; color:var(--text-muted); padding:var(--space-sm) 0;\">No entries yet. Log what you worked on after each session, the last few entries get added to your prompt automatically.<\u002Fdiv>';\n    return;\n  }\n  var html = '';\n  // Show most recent 5, newest first\n  var recent = log.slice(-5).reverse();\n  recent.forEach(function(entry, i) {\n    var realIdx = log.length - 1 - i;\n    html += '<div style=\"display:flex; gap:var(--space-sm); align-items:flex-start; padding:var(--space-sm); border-bottom:1px solid var(--border); font-size:12px;\">';\n    html += '<span style=\"font-family:var(--font-mono); color:var(--text-muted); white-space:nowrap; flex-shrink:0;\">' + entry.date + ' &middot; W' + entry.week + '<\u002Fspan>';\n    html += '<span style=\"flex:1; color:var(--text-secondary); line-height:1.5;\">' + String(entry.text).replace(/&/g, '&amp;').replace(/<\u002Fg, '&lt;') + '<\u002Fspan>';\n    html += '<button class=\"btn\" style=\"padding:2px 8px; font-size:10px; flex-shrink:0;\" onclick=\"deleteSessionLogEntry(' + realIdx + ')\">✕<\u002Fbutton>';\n    html += '<\u002Fdiv>';\n  });\n  host.innerHTML = html;\n}\n\nfunction generateStudySessionPrompt() {\n  var weekInput = document.getElementById('studyWeek');\n  var sessionTypeInput = document.getElementById('studySessionType');\n  var topicInput = document.getElementById('studyTopic');\n\n  if (!weekInput || !sessionTypeInput) return '';\n\n  var week = parseInt(weekInput.value) || 1;\n  var phase = getPhaseForWeek(week);\n  var track = getTrackForWeek(week);\n  var sessionType = sessionTypeInput.value;\n  var topic = topicInput ? topicInput.value.trim() : '';\n\n  var done = getDoneTasks();\n  var total = getTotalTasks();\n  var pct = total > 0 ? Math.round((done / total) * 100) : 0;\n\n  var upcoming = getNextTasks(3);\n  var nextTaskText;\n  if (upcoming.length) {\n    nextTaskText = 'Next unchecked tasks:\\n' + upcoming.map(function(t, i) {\n      return '  ' + (i + 1) + '. \"' + t.task + '\" (' + t.track + ')';\n    }).join('\\n');\n  } else {\n    nextTaskText = 'All tasks complete.';\n  }\n\n  var weekData = HUB_DATA.weeklyPlan[week - 1];\n  var weekFocus = weekData ? weekData.focus : 'general review';\n  var weekSessionType = weekData && weekData.sessionType ? weekData.sessionType : '';\n\n  var prompt = learnerLine() + ', currently in week ' + week + ' of a process and manufacturing engineering program.\\n\\n' +\n    'Current status:\\n' +\n    '- Phase ' + phase + ': ' + HUB_DATA.phases[phase - 1].name + '\\n' +\n    '- Track: ' + track + '\\n' +\n    '- Week ' + week + ' focus: ' + weekFocus + (weekSessionType ? ' (planned session style: ' + weekSessionType + ')' : '') + '\\n' +\n    '- Overall progress: ' + pct + '% (' + done + '/' + total + ' tasks)\\n' +\n    '- ' + nextTaskText;\n\n  // Include recent session log so the AI knows what I've actually been doing\n  var log = getData().sessionLog || [];\n  if (log.length) {\n    var recent = log.slice(-3);\n    prompt += '\\n\\nWhat I worked on recently (my session log, newest last):\\n' +\n      recent.map(function(e) {\n        return '- [' + e.date + ', week ' + e.week + '] ' + e.text;\n      }).join('\\n') +\n      '\\nUse this to pick up where I left off: don\\'t re-teach what I\\'ve clearly already done unless my log suggests I\\'m shaky on it.';\n  }\n\n  prompt += '\\n\\nSession type: ' + sessionType;\n\n  if (topic) {\n    prompt += '\\nSpecific topic/question: ' + topic;\n  }\n\n  // Session-type-specific instructions\n  if (sessionType === 'Teach me the next concept') {\n    prompt += '\\n\\nExplain the next concept I need to learn for this week\\'s focus. Build from what I already know. Use analogies from manufacturing and process engineering. Tell me what I must understand deeply before moving on.';\n  } else if (sessionType === 'Help with my project') {\n    prompt += '\\n\\nHelp me work through my current project. Guide me step by step, holding the code to production standards (clear class boundaries, tested failure modes). Ask questions to check my understanding before moving forward.';\n  } else if (sessionType === 'Debug an issue') {\n    prompt += '\\n\\nDo NOT give me the answer directly. Ask me 3-5 diagnostic questions to help me figure out what I\\'m missing. After I answer, give me targeted hints only.';\n  } else if (sessionType === 'Quiz me (active recall)') {\n    prompt += '\\n\\nGenerate a 6-question quiz: 2 recall, 2 application (new scenario), 2 synthesis (connecting topics). Ask one at a time and wait for my answer.';\n  } else if (sessionType === \"Feynman technique: I'll explain, you grade\") {\n    prompt += '\\n\\nI will explain a concept as if teaching a freshman engineer. Grade my explanation on: accuracy, completeness, and clarity. Identify misconceptions or gaps. Score 1-10 and tell me what to study next.';\n  } else if (sessionType === 'Review my code (educational, not just fix)') {\n    prompt += '\\n\\nReview my code. Do NOT rewrite it. For each issue: (1) explain why it\\'s wrong, (2) explain the underlying principle I\\'m missing, (3) give a hint toward the fix but not the fix itself.';\n  } else if (sessionType === \"Today's study plan\") {\n    prompt += '\\n\\nGenerate a specific time-blocked study plan for a 2-hour session today. Include what to study, in what order, with what approach. Be concrete and actionable.';\n  } else if (sessionType === 'Help write my project report') {\n    prompt += '\\n\\nHelp me write my project report. Ask me about my methodology, results, and challenges. Structure my responses into professional engineering documentation sections.';\n  } else if (sessionType === 'Concept scaffolding from what I know') {\n    prompt += '\\n\\nExplain this week\\'s topic by building from the background in my profile. Use analogies from manufacturing and process engineering. Then tell me what I must understand at a deep level before I can use this professionally.';\n  } else if (sessionType === 'Rubber duck debugging') {\n    prompt += '\\n\\nI\\'m stuck. Do NOT give me the answer. Instead ask me 3-5 diagnostic questions that will help me figure out what I\\'m missing. After I answer, give me targeted hints only.';\n  }\n\n  return prompt;\n}\n\nfunction updateStudyPromptPreview() {\n  var weekInput = document.getElementById('studyWeek');\n  var phaseInput = document.getElementById('studyPhase');\n  var trackInput = document.getElementById('studyTrack');\n  var preview = document.getElementById('studyPromptPreview');\n\n  if (weekInput && phaseInput && trackInput) {\n    var week = parseInt(weekInput.value) || 1;\n    var phase = getPhaseForWeek(week);\n    phaseInput.value = 'Phase ' + phase + ': ' + HUB_DATA.phases[phase - 1].name;\n    trackInput.value = getTrackForWeek(week);\n  }\n\n  if (preview) {\n    preview.textContent = generateStudySessionPrompt();\n  }\n}\n\nfunction copyStudyPrompt() {\n  var prompt = generateStudySessionPrompt();\n  if (prompt) copyToClipboard(prompt);\n}\n\nfunction loadStudyPreset(topic) {\n  var topicInput = document.getElementById('studyTopic');\n  if (topicInput) {\n    topicInput.value = topic;\n    updateStudyPromptPreview();\n  }\n}\n\nfunction renderStudySessionLauncher() {\n  var data = getData();\n  var currentWeek = data.currentWeek || 1;\n  var phase = getPhaseForWeek(currentWeek);\n  var track = getTrackForWeek(currentWeek);\n\n  var html = '';\n\n  // ── Setup + live prompt, side by side ──\n  html += '<div class=\"study-grid\" style=\"margin-bottom:var(--space-lg);\">';\n\n  html += '<div class=\"card reveal\">';\n  html += '<span class=\"eyebrow\">Session setup<\u002Fspan>';\n  html += '<div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:var(--space-sm);\">';\n  html += '<div><label>Current week<\u002Flabel><input type=\"number\" id=\"studyWeek\" min=\"1\" max=\"' + TOTAL_WEEKS + '\" value=\"' + currentWeek + '\" oninput=\"setStudyWeek()\"><\u002Fdiv>';\n  html += '<div><label>Session type<\u002Flabel><select id=\"studySessionType\" onchange=\"updateStudyPromptPreview()\">';\n  SESSION_TYPES.forEach(function(s) {\n    html += '<option value=\"' + s.replace(/\"/g, '&quot;') + '\">' + s + '<\u002Foption>';\n  });\n  html += '<\u002Fselect><\u002Fdiv>';\n  html += '<\u002Fdiv>';\n  html += '<div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:var(--space-sm); margin-top:var(--space-sm);\">';\n  html += '<div><label>Phase<\u002Flabel><input type=\"text\" id=\"studyPhase\" value=\"Phase ' + phase + ': ' + HUB_DATA.phases[phase - 1].name + '\" readonly style=\"opacity:0.65;\"><\u002Fdiv>';\n  html += '<div><label>Track<\u002Flabel><input type=\"text\" id=\"studyTrack\" value=\"' + track + '\" readonly style=\"opacity:0.65;\"><\u002Fdiv>';\n  html += '<\u002Fdiv>';\n  html += '<div style=\"margin-top:var(--space-sm);\"><label>Specific topic or question (optional)<\u002Flabel><input type=\"text\" id=\"studyTopic\" placeholder=\"e.g., How do I read a control chart for out-of-control signals?\" oninput=\"updateStudyPromptPreview()\"><\u002Fdiv>';\n  html += '<\u002Fdiv>';\n\n  html += '<div class=\"card reveal\">';\n  html += '<span class=\"eyebrow\">Generated prompt<\u002Fspan>';\n  html += '<div class=\"mono-block\" id=\"studyPromptPreview\" style=\"max-height:300px; overflow-y:auto;\"><\u002Fdiv>';\n  html += '<button class=\"btn btn-primary\" style=\"margin-top:var(--space-md);\" onclick=\"copyStudyPrompt()\">Copy prompt<\u002Fbutton>';\n  html += '<\u002Fdiv>';\n\n  html += '<\u002Fdiv>';\n\n  // Session Log: what I did today\n  html += '<div class=\"card reveal\" style=\"margin-bottom:var(--space-lg);\">';\n  html += '<span class=\"eyebrow\">Session log, what did you work on today?<\u002Fspan>';\n  html += '<div style=\"display:flex; gap:var(--space-sm); margin-bottom:var(--space-sm);\">';\n  html += '<input type=\"text\" id=\"sessionLogInput\" placeholder=\"e.g., Built the SPC dashboard, stuck on the capability calc\" style=\"flex:1;\" onkeydown=\"if(event.key===\\'Enter\\')saveSessionLogEntry()\">';\n  html += '<button class=\"btn btn-primary\" onclick=\"saveSessionLogEntry()\" style=\"flex-shrink:0;\">Log it<\u002Fbutton>';\n  html += '<\u002Fdiv>';\n  html += '<div id=\"sessionLogList\"><\u002Fdiv>';\n  html += '<div style=\"font-size:11px; color:var(--text-muted); margin-top:var(--space-xs); font-family:var(--font-mono);\">Your last 3 entries are automatically included in the generated prompt so the AI remembers where you left off.<\u002Fdiv>';\n  html += '<\u002Fdiv>';\n\n  // ── Presets ──\n  html += '<div class=\"section-rule\"><h3>Quick session presets<\u002Fh3><\u002Fdiv>';\n  html += '<div class=\"grid-3\">';\n\n  HUB_DATA.sessionPresets.forEach(function(preset) {\n    html += '<div class=\"card preset-card reveal\" onclick=\"loadStudyPreset(\\'' + preset.topic.replace(/'/g, \"\\\\'\") + '\\')\">';\n    html += '<span class=\"preset-title\">' + preset.title + '<\u002Fspan>';\n    html += '<span class=\"preset-topic\">' + preset.topic + '<\u002Fspan>';\n    html += '<\u002Fdiv>';\n  });\n\n  html += '<\u002Fdiv>';\n\n  document.getElementById('studyContent').innerHTML = html;\n\n  // Initial prompt preview + session log\n  setTimeout(function() {\n    updateStudyPromptPreview();\n    renderSessionLogList();\n  }, 0);\n}\n\n// ═══════════════════════════════════════════════════════\n//  TAB 7: AI STRATEGY\n// ═══════════════════════════════════════════════════════\n\nvar aiStrategySubView = 'playbook';\n\nfunction switchAiStrategyView(view) {\n  aiStrategySubView = view;\n  renderAiStrategy();\n}\n\nfunction filterUseCasesByHelper(situation) {\n  var mapping = {\n    'learning': ['uc_1_1', 'uc_1_3', 'uc_1_4'],\n    'stuck': ['uc_1_2', 'uc_1_5', 'uc_2_3'],\n    'finished': ['uc_1_3', 'uc_3_2', 'uc_3_5'],\n    'interview': ['uc_3_3', 'uc_3_4', 'uc_3_2'],\n    'on-the-job': ['uc_2_1', 'uc_2_2', 'uc_2_5'],\n    'publishing': ['uc_3_5', 'uc_3_2', 'uc_2_1'],\n    'considering-ai': ['uc_4_1', 'uc_4_2', 'uc_4_4']\n  };\n  return mapping[situation] || [];\n}\n\nfunction renderAiStrategyPlaybook() {\n  var html = '';\n\n  // Rules panel: styled as a posted procedure (numbered, hairline dividers).\n  html += '<div class=\"reveal\" style=\"margin-bottom:var(--space-lg);\">';\n  html += '<span class=\"eyebrow\">Standard Operating Procedure: The ' + HUB_DATA.aiRules.length + ' Rules<\u002Fspan>';\n  html += '<div class=\"procedure\">';\n  HUB_DATA.aiRules.forEach(function(rule, i) {\n    var n = ('0' + (i + 1)).slice(-2);\n    html += '<div class=\"procedure-item\"><span class=\"procedure-num\">' + n + '<\u002Fspan><span class=\"procedure-text\">' + rule + '<\u002Fspan><\u002Fdiv>';\n  });\n  html += '<\u002Fdiv><\u002Fdiv>';\n\n  // Helper dropdown\n  html += '<div class=\"card\" style=\"margin-bottom:var(--space-lg);\">';\n  html += '<label>Which AI use case should I use right now?<\u002Flabel>';\n  html += '<select id=\"aiHelperDropdown\" onchange=\"applyUseCaseHelper(this.value)\" style=\"max-width:400px;\">';\n  html += '<option value=\"\">,  Select your situation , <\u002Foption>';\n  html += '<option value=\"learning\">Learning a new concept<\u002Foption>';\n  html += '<option value=\"stuck\">Stuck on a problem<\u002Foption>';\n  html += '<option value=\"finished\">Just finished a project<\u002Foption>';\n  html += '<option value=\"interview\">Preparing for an interview<\u002Foption>';\n  html += '<option value=\"on-the-job\">On the job<\u002Foption>';\n  html += '<option value=\"publishing\">Publishing content<\u002Foption>';\n  html += '<option value=\"considering-ai\">Considering AI/ML for a problem<\u002Foption>';\n  html += '<\u002Fselect>';\n  html += '<\u002Fdiv>';\n\n  // All 3 stages with use cases\n  var stages = [\n    { num: 1, name: 'AI as a Learning Accelerator', desc: 'While studying, Phases 1 to 4' },\n    { num: 2, name: 'AI as a Productivity Multiplier', desc: 'On the job, post-hire' },\n    { num: 3, name: 'AI as a Career Edge', desc: 'Ongoing, competitive advantage' },\n    { num: 4, name: 'Engineering Judgment & AI Limits', desc: 'Knowing when not to trust AI' }\n  ];\n\n  stages.forEach(function(stage) {\n    html += '<div style=\"margin-bottom:var(--space-xl);\">';\n    html += '<h3 style=\"margin-bottom:var(--space-md); display:flex; align-items:center; gap:var(--space-sm);\">';\n    html += '<span class=\"badge badge-phase-' + stage.num + '\">Stage ' + stage.num + '<\u002Fspan>';\n    html += '<span>' + stage.name + '<\u002Fspan>';\n    html += '<span style=\"font-size:11px; color:var(--text-muted); font-weight:400; margin-left:var(--space-sm);\">(' + stage.desc + ')<\u002Fspan>';\n    html += '<\u002Fh3>';\n\n    var useCases = HUB_DATA.aiUseCases.filter(function(uc) { return uc.stage === stage.num; });\n    useCases.forEach(function(uc) {\n      html += '<div class=\"card ai-usecase-card\" id=\"usecase_' + uc.id + '\" style=\"margin-bottom:var(--space-md); padding:var(--space-md);\">';\n      html += '<div style=\"display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:var(--space-sm);\">';\n      html += '<div><strong style=\"font-family:var(--font-mono); font-size:13px; color:var(--text-bright);\">' + uc.title + '<\u002Fstrong><\u002Fdiv>';\n      html += '<span class=\"badge badge-phase-' + stage.num + '\">Stage ' + stage.num + '<\u002Fspan>';\n      html += '<\u002Fdiv>';\n      html += '<p style=\"font-size:13px; color:var(--text-secondary); margin-bottom:var(--space-md); line-height:1.5;\">' + uc.description + '<\u002Fp>';\n      html += '<div style=\"position:relative;\">';\n      html += '<div class=\"mono-block\" style=\"padding-right:80px;\">' + uc.prompt.replace(/<\u002Fg,'&lt;').replace(/>/g,'&gt;') + '<\u002Fdiv>';\n      html += '<button class=\"btn btn-sm\" style=\"position:absolute; top:var(--space-sm); right:var(--space-sm);\" onclick=\"copyToClipboard(HUB_DATA.aiUseCases.find(function(u){return u.id===\\'' + uc.id + '\\'}).prompt)\">Copy<\u002Fbutton>';\n      html += '<\u002Fdiv>';\n      html += '<\u002Fdiv>';\n    });\n\n    html += '<\u002Fdiv>';\n  });\n\n  return html;\n}\n\nfunction applyUseCaseHelper(situation) {\n  // Remove all highlights\n  document.querySelectorAll('.ai-usecase-card').forEach(function(el) {\n    el.style.borderColor = '';\n    el.style.boxShadow = '';\n  });\n  if (!situation) return;\n  var highlighted = filterUseCasesByHelper(situation);\n  highlighted.forEach(function(ucId) {\n    var el = document.getElementById('usecase_' + ucId);\n    if (el) {\n      el.style.borderColor = 'var(--accent)';\n      el.style.boxShadow = '0 0 12px rgba(74,222,128,0.15)';\n      if (highlighted.indexOf(ucId) === 0) el.scrollIntoView({ behavior: 'smooth', block: 'center' });\n    }\n  });\n}\n\nfunction renderAiPromptBuilder() {\n  var data = getData();\n  var week = data.currentWeek || 1;\n  var phase = getPhaseForWeek(week);\n  var html = '';\n\n  html += '<div class=\"card\" style=\"margin-bottom:var(--space-lg);\">';\n  html += '<h3 style=\"margin-bottom:var(--space-md);\">Build a Custom AI Prompt<\u002Fh3>';\n\n  html += '<div class=\"grid-3\" style=\"margin-bottom:var(--space-md);\">';\n  html += '<div><label>Situation<\u002Flabel><select id=\"aiBuilderSituation\" onchange=\"updateAiBuilderPreview()\">';\n  html += '<option value=\"learning\">Learning a new concept<\u002Foption>';\n  html += '<option value=\"debugging\">Debugging / stuck<\u002Foption>';\n  html += '<option value=\"project\">Working on a project<\u002Foption>';\n  html += '<option value=\"review\">Code / design review<\u002Foption>';\n  html += '<option value=\"documentation\">Writing documentation<\u002Foption>';\n  html += '<option value=\"interview\">Interview prep<\u002Foption>';\n  html += '<option value=\"career\">Career planning<\u002Foption>';\n  html += '<\u002Fselect><\u002Fdiv>';\n\n  html += '<div><label>My background (from profile)<\u002Flabel><input type=\"text\" id=\"aiBuilderBackground\" value=\"' + escapeHtml((getData().profile || {}).background || 'Working toward a process / manufacturing engineering role') + '\" oninput=\"updateAiBuilderPreview()\"><\u002Fdiv>';\n\n  html += '<div><label>Current phase / week<\u002Flabel><input type=\"text\" id=\"aiBuilderPhaseWeek\" value=\"Phase ' + phase + ', Week ' + week + '\" oninput=\"updateAiBuilderPreview()\"><\u002Fdiv>';\n  html += '<\u002Fdiv>';\n\n  html += '<div style=\"margin-bottom:var(--space-md);\"><label>Specific Context<\u002Flabel><textarea id=\"aiBuilderContext\" rows=\"3\" placeholder=\"Describe what you are working on, what you need help with, any relevant details...\" oninput=\"updateAiBuilderPreview()\"><\u002Ftextarea><\u002Fdiv>';\n\n  html += '<div style=\"margin-bottom:var(--space-md);\"><label>Desired Output Type<\u002Flabel><select id=\"aiBuilderOutput\" onchange=\"updateAiBuilderPreview()\">';\n  html += '<option value=\"explanation\">Explanation<\u002Foption>';\n  html += '<option value=\"quiz\">Quiz<\u002Foption>';\n  html += '<option value=\"review\">Review<\u002Foption>';\n  html += '<option value=\"draft\">Draft<\u002Foption>';\n  html += '<option value=\"plan\">Plan<\u002Foption>';\n  html += '<option value=\"analysis\">Analysis<\u002Foption>';\n  html += '<\u002Fselect><\u002Fdiv>';\n\n  html += '<label>Live Prompt Preview<\u002Flabel>';\n  html += '<div class=\"mono-block\" id=\"aiBuilderPreview\" style=\"margin-bottom:var(--space-md); max-height:250px; overflow-y:auto;\"><\u002Fdiv>';\n\n  html += '<div style=\"display:flex; gap:var(--space-md); flex-wrap:wrap;\">';\n  html += '<button class=\"btn btn-primary\" onclick=\"copyAiBuilderPrompt()\">Copy Prompt<\u002Fbutton>';\n  html += '<button class=\"btn\" onclick=\"saveAiBuilderPrompt()\">Save This Prompt<\u002Fbutton>';\n  html += '<\u002Fdiv>';\n  html += '<\u002Fdiv>';\n\n  // Saved Prompts Library\n  html += '<h3 style=\"margin-bottom:var(--space-md);\">Saved Prompts Library<\u002Fh3>';\n  var savedPrompts = data.savedPrompts || [];\n  if (savedPrompts.length === 0) {\n    html += '<div style=\"color:var(--text-muted); font-family:var(--font-mono); font-size:12px;\">No saved prompts yet. Build and save prompts above.<\u002Fdiv>';\n  } else {\n    savedPrompts.forEach(function(sp, idx) {\n      html += '<div class=\"card\" style=\"margin-bottom:var(--space-sm); padding:var(--space-md);\">';\n      html += '<div style=\"display:flex; justify-content:space-between; align-items:center; margin-bottom:var(--space-sm);\">';\n      html += '<strong style=\"font-family:var(--font-mono); font-size:12px; color:var(--accent);\">' + (sp.name || 'Untitled').replace(/<\u002Fg,'&lt;') + '<\u002Fstrong>';\n      html += '<span style=\"font-family:var(--font-mono); font-size:10px; color:var(--text-muted);\">' + (sp.savedAt || '') + '<\u002Fspan>';\n      html += '<\u002Fdiv>';\n      html += '<div class=\"mono-block\" style=\"font-size:11px; max-height:80px; overflow-y:auto; margin-bottom:var(--space-sm);\">' + (sp.prompt || '').replace(/<\u002Fg,'&lt;').replace(/>/g,'&gt;') + '<\u002Fdiv>';\n      html += '<div style=\"display:flex; gap:var(--space-sm);\">';\n      html += '<button class=\"btn btn-sm\" onclick=\"copyToClipboard(getData().savedPrompts[' + idx + '].prompt)\">Copy<\u002Fbutton>';\n      html += '<button class=\"btn btn-sm btn-danger\" onclick=\"deleteSavedPrompt(' + idx + ')\">Delete<\u002Fbutton>';\n      html += '<\u002Fdiv>';\n      html += '<\u002Fdiv>';\n    });\n  }\n\n  return html;\n}\n\nfunction buildAiBuilderPromptText() {\n  var situation = document.getElementById('aiBuilderSituation');\n  var background = document.getElementById('aiBuilderBackground');\n  var phaseWeek = document.getElementById('aiBuilderPhaseWeek');\n  var context = document.getElementById('aiBuilderContext');\n  var output = document.getElementById('aiBuilderOutput');\n\n  if (!situation) return '';\n\n  var sitLabel = situation.opt ar(--text-secondary); line-height:1.5;\">' + tool.useCase + '<\u002Fp>';\n    html += '<\u002Fdiv>';\n  });\n  html += '<\u002Fdiv>';\n  return html;\n}\n\nfunction renderAiStrategy() {\n  var container = document.getElementById('aiStrategyContent');\n  var html = '';\n\n  // Sub-section selector buttons\n  html += '<div class=\"segmented\">';\n  html += '<button class=\"seg-btn' + (aiStrategySubView === 'playbook' ? ' active' : '') + '\" onclick=\"switchAiStrategyView(\\'playbook\\')\">The playbook<\u002Fbutton>';\n  html += '<button class=\"seg-btn' + (aiStrategySubView === 'builder' ? ' active' : '') + '\" onclick=\"switchAiStrategyView(\\'builder\\')\">Prompt builder<\u002Fbutton>';\n  html += '<button class=\"seg-btn' + (aiStrategySubView === 'tools' ? ' active' : '') + '\" onclick=\"switchAiStrategyView(\\'tools\\')\">Tools reference<\u002Fbutton>';\n  html += '<\u002Fdiv>';\n\n  if (aiStrategySubView === 'playbook') {\n    html += renderAiStrategyPlaybook();\n  } else if (aiStrategySubView === 'builder') {\n    html += renderAiPromptBuilder();\n  } else if (aiStrategySubView === 'tools') {\n    html += renderAiToolsReference();\n  }\n\n  container.innerHTML = html;\n\n  // Init builder preview if on builder view\n  if (aiStrategySubView === 'builder') {\n    setTimeout(updateAiBuilderPreview, 0);\n  }\n}\n\n// ═══════════════════════════════════════════════════════\n//  TAB 8: SCHEDULE & PLANNER\n// ═══════════════════════════════════════════════════════\n\nvar scheduleSubView = 'weekly';\n\nfunction switchScheduleView(view) {\n  scheduleSubView = view;\n  renderSchedule();\n}\n\nfunction getScheduleSettings() {\n  var data = getData();\n  var startDateEl = document.getElementById('schedStartDate');\n  var hrsWeekEl = document.getElementById('schedHrsPerWeek');\n  var daysEl = document.getElementById('schedDaysPerWeek');\n  var weekEl = document.getElementById('schedCurrentWeek');\n\n  var startDate = startDateEl ? startDateEl.value : '';\n  var hrsPerWeek = ekData.tracks.join(', ') : 'current track';\n  html += '<button class=\"btn btn-primary\" onclick=\"copyDailyPlanPrompt()\">Copy plan prompt<\u002Fbutton>';\n\n  return html;\n}\n\nfunction updateDailyPlanner() {\n  var slider = document.getElementById('dailyPlannerHours');\n  var label = document.getElementById('dailyHoursLabel');\n  if (label && slider) label.textContent = slider.value;\n  // Re-render the blocks section\n  var s = getScheduleSettings();\n  var hours = parseInt(slider.value) || 2;\n  var template = HUB_DATA.dailyPlannerTemplates[hours];\n  var weekData = HUB_DATA.weeklyPlan[s.currentWeek - 1];\n  var focusTopic = weekData ? weekData.focus : 'General review';\n\n  var blocksContainer = document.getElementById('dailyPlannerBlocks');\n  if (!blocksContainer) return;\n\n  var html = '<h3 style=\"margin-bottom:var(--space-md);\">' + hours + '-Hour Session: ' + focusTopic + '<\u002Fh3>';\n  html += '<div style=\"display:grid; gap:var(--space-sm); margin-bottom:var(--space-lg);\">';\n  template.blocks.forEach(function(block) {\n    var isBreak = block.label.toLowerCase() === 'break';\n    html += '<div style=\"display:flex; align-items:center; gap:var(--space-md); padding:var(--space-sm) var(--space-md); background:' + (isBreak ? 'var(--bg-base)' : 'var(--bg-surface)') + '; border:1px solid var(--border); border-radius:var(--radius-sm); border-left:3px solid ' + (isBreak ? 'var(--text-muted)' : 'var(--accent)') + ';\">';\n    html += '<span style=\"font-family:var(--font-mono); font-size:11px; color:var(--text-muted); min-width:80px;\">' + block.range + '<\u002Fspan>';\n    html += '<span style=\"font-size:13px; color:' + (isBreak ? 'var(--text-muted)' : 'var(--text-primary)') + '; font-weight:' + (isBreak ? '400' : '500') + ';\">' + block.label + (isBreak ? '' : ': ' + focusTopic) + '<\u002Fspan>';\n    html += '<\u002Fdiv>';\n  });\n  html += '<\u002Fdiv>';\n\n  html += '<div class=\"card\" style=\"background:var(--bg-ai); border-left:3px solid var(--p     html += '<div style=\"position:absolute; left:-34px; top:4px; width:14px; height:14px; border-radius:50%; background:' + dotColor + '; border:2px solid var(--bg-card);' + dotShadow + '\"><\u002Fdiv>';\n\n    // Milestone content\n    html += '<div class=\"card\" style=\"padding:var(--space-md);' + (isCurrent ? 'border-color:' + phaseColor + '; box-shadow:0 0 15px ' + phaseColor + '22;' : '') + '\">';\n    html += '<div style=\"display:flex; align-items:center; gap:var(--space-sm); margin-bottom:var(--space-xs);\">';\n    if (isPast) html += '<span style=\"color:var(--accent); display:inline-flex;\"><svg class=\"icon\" viewBox=\"0 0 24 24\" style=\"width:15px;height:15px;\" aria-hidden=\"true\"><path d=\"M20 6L9 17l-5-5\"/><\u002Fsvg><\u002Fspan>';\n    if (isCurrent) html += '<span style=\"color:' + phaseColor + ';\"><svg class=\"icon icon-caret\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M9 6l6 6-6 6\"/><\u002Fsvg><\u002Fspan>';\n    if (ms.career) {\n      html += '<span class=\"badge\" style=\"background:var(--brand-soft); color:var(--brand);\">Career &middot; Wk ' + ms.week + '<\u002Fspan>';\n    } else {\n      html += '<span class=\"badge badge-phase-' + ms.phase + '\">Week ' + ms.week + '<\u002Fspan>';\n    }\n    html += '<strong style=\"font-family:var(--font-mono); font-size:13px; color:' + (isCurrent ? phaseColor : isPast ? 'var(--text-muted)' : 'var(--text-primary)') + ';\">' + ms.title + '<\u002Fstrong>';\n    html += '<\u002Fdiv>';\n    html += '<div style=\"font-size:12px; color:var(--text-secondary); line-height:1.5; padding-left:' + (isPast || isCurrent ? '22px' : '0') + ';\">' + ms.description + '<\u002Fdiv>';\n    html += '<\u002Fdiv>';\n    html += '<\u002Fdiv>';\n  });\n\n  html += '<\u002Fdiv>';\n  return html;\n}\n\n// ═══════════════════════════════════════════════════════\n//  TAB 9: MATERIALS\n// ═══════════════════════════════════════════════════════\nvar MATERIALS_PHASES = [\n  { key: 'phase1', name: 'Phase 1: Lean Six Sigm gn-items:center; gap:10px;\">';\n    phasesHtml += '<span style=\"font-family:var(--font-mono); font-size:11.5px; color:var(--text-bright);\">' + pChecked + '/' + items.length + '<\u002Fspan>';\n    phasesHtml += '<span class=\"badge\" style=\"background:' + p.color + '22; color:' + p.color + ';\">' + p.buyBy + '<\u002Fspan>';\n    phasesHtml += '<\u002Fdiv><\u002Fdiv>';\n\n    phasesHtml += '<span class=\"eyebrow\" style=\"color:var(--text-muted);\">Paid tools &amp; subscriptions<\u002Fspan>';\n    phasesHtml += rows(groups['Paid tools & subscriptions']) || '<div style=\"font-size:13px; color:var(--text-muted); padding:6px 9px;\">None<\u002Fdiv>';\n    phasesHtml += '<span class=\"eyebrow\" style=\"color:var(--text-muted); margin-top:var(--space-md);\">Free tools &amp; learning<\u002Fspan>';\n    phasesHtml += rows(groups['Free tools & learning']);\n\n    phasesHtml += '<div class=\"mat-total\"><span>Phase cost (required)<\u002Fspan><span style=\"color:var(--text-bright);\">$' + pReq + '<\u002Fspan><\u002Fdiv>';\n    phasesHtml += '<\u002Fdiv>';\n  });\n\n  var pct = totalItems ? Math.round(checkedItems / totalItems * 100) : 0;\n\n  var html = '';\n  html += '<div class=\"card\" style=\"margin-bottom:var(--space-lg);\">';\n  html += '<div class=\"grid-4\">';\n  html += '<div class=\"stat-card\"><div class=\"stat-value\" style=\"color:var(--state-run);\">$' + acquired + '<\u002Fdiv><div class=\"stat-label\">Acquired<\u002Fdiv><\u002Fdiv>';\n  html += '<div class=\"stat-card\"><div class=\"stat-value\">$' + requiredTotal + '<\u002Fdiv><div class=\"stat-label\">Required total<\u002Fdiv><\u002Fdiv>';\n  html += '<div class=\"stat-card\"><div class=\"stat-value\" style=\"color:var(--phase-2);\">$' + withOptionals + '<\u002Fdiv><div class=\"stat-label\">With optionals<\u002Fdiv><\u002Fdiv>';\n  html += '<div class=\"stat-card\"><div class=\"stat-value\" style=\"color:var(--brand);\">' + checkedItems + '/' + totalItems + '<\u002Fdiv><div class=\"stat-label\">Items checked leSubViewContent');\n  if (!subContent) return;\n  if (scheduleSubView === 'weekly') subContent.innerHTML = renderScheduleWeeklyPlan();\n  else if (scheduleSubView === 'daily') subContent.innerHTML = renderScheduleDailyPlanner();\n  else if (scheduleSubView === 'milestones') subContent.innerHTML = renderScheduleMilestones();\n}\n\n// ═══════════════════════════════════════════════════════\n//  TAB: APPLICATIONS  +  STAR BANK  (sub-views)\n// ═══════════════════════════════════════════════════════\n\nlet applicationsSubView = 'applications';\nlet applicationsFilter = 'all';\n\nfunction renderApplications() {\n  var container = document.getElementById('applicationsContent');\n  if (!container) return;\n  var html = '';\n\n  // Sub-view toggle (Applications / STAR Bank), mirrors the Schedule tab pattern.\n  html += '<div class=\"segmented\">';\n  html += '<button class=\"seg-btn' + (applicationsSubView === 'applications' ? ' active' : '') + '\" onclick=\"switchApplicationsView(\\'applications\\')\">Applications<\u002Fbutton>';\n  html += '<button class=\"seg-btn' + (applicationsSubView === 'star' ? ' active' : '') + '\" onclick=\"switchApplicationsView(\\'star\\')\">STAR bank<\u002Fbutton>';\n  html += '<\u002Fdiv>';\n\n  html += '<div id=\"applicationsSubView\"><\u002Fdiv>';\n  container.innerHTML = html;\n  renderApplicationsSubView();\n}\n\nfunction switchApplicationsView(view) {\n  applicationsSubView = view;\n  renderApplications();\n}\n\nfunction renderApplicationsSubView() {\n  var el = document.getElementById('applicationsSubView');\n  if (!el) return;\n  el.innerHTML = applicationsSubView === 'star' ? renderStarBank() : renderApplicationsList();\n}\n\n// ─── Applications ───\n// Grouped by pipeline stage with the funnel on top: a flat list of identical\n// cards hid where things actually stood.\nfunction renderApplicationsList() {\n  var data = getData();\n  var apps = data.applications || [];\n  var today = new Date().toISOString().slice(0, 10);\n\n  var stag 10);\n  var logged = (d.sessionLog || []).filter(function (e) { return e && e.date === todayIso; }).length;\n  var dateLabel = new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });\n\n  // Streak, computed the same way the consistency grid does it.\n  var dayMap = {};\n  (d.sessionLog || []).forEach(function (e) { if (e && e.date) dayMap[e.date] = 1; });\n  var isoOf = function (dt) { return dt.toISOString().slice(0, 10); };\n  var cur = new Date(); cur.setHours(12, 0, 0, 0);\n  if (!dayMap[isoOf(cur)]) cur.setDate(cur.getDate() - 1);\n  var streak = 0;\n  while (dayMap[isoOf(cur)]) { streak++; cur.setDate(cur.getDate() - 1); }\n\n  var html = '<div>';\n  html += '<span class=\"eyebrow\" style=\"display:flex; align-items:center; flex-wrap:wrap;\">Today · ' + dateLabel +\n    (streak > 1 ? '<span class=\"today-chip\">' + streak + '-day streak<\u002Fspan>' : '') + '<\u002Fspan>';\n  if (next) {\n    html += '<div class=\"today-next\">' +\n      '<div class=\"checkbox-row\" style=\"padding:0;\">' +\n        '<input type=\"checkbox\" onchange=\"toggleTask(\\'' + next.key + '\\', this.checked); renderToday();\" aria-label=\"Mark this task done\">' +\n      '<\u002Fdiv>' +\n      '<div style=\"min-width:0;\">' +\n        '<div class=\"today-task\">' + next.task + '<\u002Fdiv>' +\n        '<div class=\"today-meta\"><span>' + next.track + '<\u002Fspan><span>Weeks ' + next.weeks + '<\u002Fspan>' +\n        (wd ? '<span>' + wd.focus + '<\u002Fspan>' : '') + '<\u002Fdiv>' +\n      '<\u002Fdiv>' +\n    '<\u002Fdiv>';\n  } else {\n    html += '<div class=\"today-task\" style=\"margin-top:8px;\">Curriculum complete. Write up what you built.<\u002Fdiv>';\n  }\n  html += '<div class=\"today-actions\">' +\n    '<button class=\"btn btn-primary\" onclick=\"openLogSheet()\">' + (logged ? 'Log another session' : 'Log today\\'s session') + '<\u002Fbutton>' +\n    '<button class=\"btn\" onclick=\"switchTab(\\'schedule\\')\">Full planner<\u002Fbutton>  date: new Date().toISOString().slice(0, 10), week: week, text: text });\n    if (d.sessionLog.length > 100) d.sessionLog = d.sessionLog.slice(-100);\n  });\n  ta.value = '';\n  if (window.closeSheets) window.closeSheets();\n  showToast('Session logged', 'success');\n  renderConsistency();\n  renderStatusBar();\n  renderToday();\n  renderSessionLogList();\n  if (typeof updateStudyPromptPreview === 'function') updateStudyPromptPreview();\n}\n\n(function todayWiring() {\n  var _rd = window.renderDashboard;\n  window.renderDashboard = function () { _rd.apply(this, arguments); renderToday(); };\n  if (document.querySelector('#tab-dashboard.active')) renderToday();\n})();\n\n// ═══ Swipe between modules (P3) ═══\n(function swipeNav() {\n  var main = document.querySelector('.main-content');\n  if (!main) return;\n  var order = [].map.call(document.querySelectorAll('.nav-btn[data-tab]'), function (b) { return b.dataset.tab; });\n  var sx = 0, sy = 0, live = false;\n\n  main.addEventListener('touchstart', function (e) {\n    if (window.innerWidth > 900 || e.touches.length !== 1) { live = false; return; }\n    var t = e.target;\n    // Leave horizontally scrollable readouts alone.\n    while (t && t !== main) {\n      var ov = getComputedStyle(t).overflowX;\n      if ((ov === 'auto' || ov === 'scroll') && t.scrollWidth > t.clientWidth + 4) { live = false; return; }\n      t = t.parentElement;\n    }\n    sx = e.touches[0].clientX; sy = e.touches[0].clientY; live = true;\n  }, { passive: true });\n\n  main.addEventListener('touchend', function (e) {\n    if (!live) return;\n    live = false;\n    var b = document.body.classList;\n    if (b.contains('sheet-open') || b.contains('filters-open') || b.contains('log-open')) return;\n    var t = e.changedTouches[0];\n    var dx = t.clientX - sx, dy = t.clientY - sy;\n    if (Math.abs(dx) < 72 || Math.abs(dx) < Math.abs(dy) * 1.7) return;\n    var active = document.querySelector('.nav-btn.active');\n    var i = order.indexOf(active ?
