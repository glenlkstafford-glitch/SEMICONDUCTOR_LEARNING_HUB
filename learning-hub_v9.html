document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

.13);\n  --brand-deep: #c9862a;\n\n  /* ── State semantics ── */\n  --state-run: #6cc79f;\n  --state-warn: #e8a33d;\n  --state-fault: #e0705a;\n  --state-idle: #6d6157;\n\n  /* ── Phase identity ── */\n  --phase-1: #e8a33d;\n  --phase-2: #74b1d6;\n  --phase-3: #b394e0;\n  --phase-4: #e5806f;\n  --phase-5: #5fc2ae;\n  --phase-6: #cbb35c;\n  --phase-7: #d67ba6;\n  --phase-1-bg: rgba(232,163,61,.12);\n  --phase-2-bg: rgba(116,177,214,.12);\n  --phase-3-bg: rgba(179,148,224,.12);\n  --phase-4-bg: rgba(229,128,111,.12);\n  --phase-5-bg: rgba(95,194,174,.12);\n  --phase-6-bg: rgba(203,179,92,.12);\n  --phase-7-bg: rgba(214,123,166,.12);\n\n  /* Legacy aliases */\n  --accent: var(--brand);\n  --accent-hover: #f3b45c;\n  --danger: var(--state-fault);\n  --danger-hover: #c95a45;\n  --warning: var(--state-warn);\n  --status-not-started: var(--state-idle);\n  --status-in-progress: var(--state-warn);\n  --status-complete: var(--state-run);\n  --bg-ai: #1a1512;\n\n  /* ── Depth ── */\n  --hair: inset 0 1px 0 rgba(255,255,255,.045);\n  --shadow-card: 0 1px 2px rgba(0,0,0,.45), 0 6px 18px -12px rgba(0,0,0,.7);\n  --shadow-raised: 0 2px 4px rgba(0,0,0,.4), 0 18px 40px -18px rgba(0,0,0,.85);\n  --shadow-inset: inset 0 1px 3px rgba(0,0,0,.6);\n\n  --sidebar-width: 248px;\n\n  --font-mono: 'IBM Plex Mono', ui-monospace, monospace;\n  --font-sans: 'Geist', 'Helvetica Neue', Helvetica, sans-serif;\n  --font-display: 'Instrument Serif', Georgia, serif;\n  --font-cond: 'Geist', 'Helvetica Neue', sans-serif;\n\n  --transition-fast: 140ms cubic-bezier(.4,0,.2,1);\n  --transition-normal: 260ms cubic-bezier(.4,0,.2,1);\n  --transition-slow: 420ms cubic-bezier(.4,0,.2,1);\n\n  --radius-sm: 5px;\n  --radius-md: 8px;\n  --radius-lg: 14px;\n\n  --space-xs: 4px; --space-sm: 8px; --space-md: 16px;\n  --space-lg: 24px; --space-xl: 36px; --space-2xl: 56px;\n}\n\nhtml, body {\n  height: 100%;\n  overflow: hidden;\n  background: var(--bg-base);\n  color: var(--text-primary);\n  font-family: var(--font-sans);\n  font-size: 14px;\n  line-height: 1.55;\n  font-variant-numeric: tabular-nums;\n  -webkit-font-smoothing: antialiased;\n  text-wrap: pretty;\n}\n\n/* Warm ambient light from the top-left, plus a whisper of die grid. */\nbody {\n  background-color: var(--bg-base);\n  background-image:\n    radial-gradient(1000px 600px at 14% -8%, rgba(232,163,61,.07), rgba(232,163,61,0) 66%),\n    linear-gradient(rgba(255,255,255,.013) 1px, transparent 1px),\n    linear-gradient(90deg, rgba(255,255,255,.013) 1px, transparent 1px);\n  background-size: auto, 40px 40px, 40px 40px;\n  background-attachment: fixed, fixed, fixed;\n}\n\n* { scrollbar-width: thin; scrollbar-color: var(--border-light) transparent; }\n::-webkit-scrollbar { width: 10px; height: 10px; }\n::-webkit-scrollbar-track { background: transparent; }\n::-webkit-scrollbar-thumb { background: var(--border); border-radius: 6px; border: 3px solid transparent; background-clip: content-box; }\n::-webkit-scrollbar-thumb:hover { background: var(--border-light); background-clip: content-box; }\n\n:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 3px; }\n\na { color: var(--brand); text-decoration-color: rgba(232,163,61,.4); text-underline-offset: 3px; }\na:hover { color: var(--accent-hover); text-decoration-color: currentColor; }\n\n::selection { background: rgba(232,163,61,.26); color: var(--text-bright); }\n\n.eyebrow {\n  display: block;\n  font-family: var(--font-mono);\n  font-size: 10px;\n  font-weight: 500;\n  color: var(--brand);\n  text-transform: uppercase;\n  letter-spacing: 0.16em;\n  margin-bottom: 10px;\n}\n\n@media (prefers-reduced-motion: reduce) {\n  *, *::before, *::after {\n    animation-duration: .001ms !important; animation-iteration-count: 1 !important;\n    transition-duration: .001ms !important; scroll-behavior: auto !important;\n  }\n}\n\n/* ── Shell ── */\n.app-shell { display: flex; height: 100vh; width: 100vw; }\n\n/* ── Sidebar: a warm instrument rail ── */\n.sidebar {\n  width: var(--sidebar-width);\n  min-width: var(--sidebar-width);\n  background:\n    linear-gradient(180deg, rgba(232,163,61,.05), transparent 220px),\n    linear-gradient(180deg, #1a1512 0%, #131010 100%);\n  border-right: 1px solid var(--border);\n  display: flex; flex-direction: column;\n  user-select: none;\n  position: relative;\n  z-index: 60;\n}\n.sidebar::after {\n  content: ''; position: absolute; top: 0; right: 0; bottom: 0; width: 1px;\n  background: linear-gradient(180deg, rgba(232,163,61,.35), transparent 30%);\n}\n\n.sidebar-header { padding: var(--space-lg) var(--space-md) var(--space-md); }\n\n.sidebar-brand { display: flex; align-items: center; gap: 11px; }\n.sidebar-brand .brand-mark { width: 34px; height: 34px; flex-shrink: 0; }\n.sidebar-brand h1 {\n  font-family: var(--font-display);\n  font-size: 21px;\n  font-weight: 400;\n  color: var(--text-bright);\n  letter-spacing: 0;\n  text-transform: none;\n  line-height: 1.05;\n}\n.sidebar-header .subtitle {\n  font-family: var(--font-mono);\n  font-size: 10px;\n  color: var(--text-muted);\n  margin-top: 10px;\n  letter-spacing: 0.06em;\n  line-height: 1.5;\n}\n\n.sidebar-section-label {\n  font-family: var(--font-mono);\n  font-size: 9px;\n  font-weight: 500;\n  color: var(--text-muted);\n  text-transform: uppercase;\n  letter-spacing: 0.2em;\n  padding: var(--space-lg) var(--space-md) 10px;\n}\n\n.sidebar-nav { flex: 1; padding: 0 10px var(--space-sm); overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }\n\n.nav-btn {\n  display: flex; align-items: center; gap: 11px;\n  width: 100%;\n  padding: 9px 11px;\n  border: none;\n  border-radius: var(--radius-md);\n  background: transparent;\n  color: var(--text-secondary);\n  font-family: var(--font-sans);\n  font-size: 13px;\n  font-weight: 450;\n  letter-spacing: -0.005em;\n  cursor: pointer;\n  transition: background var(--transition-fast), color var(--transition-fast);\n  text-align: left;\n  position: relative;\n}\n.nav-btn:hover { background: rgba(255,255,255,.045); color: var(--text-primary); }\n.nav-btn.active {\n  background: var(--brand-soft);\n  color: var(--text-bright);\n  font-weight: 500;\n  box-shadow: var(--hair);\n}\n.nav-btn.active::before {\n  content: ''; position: absolute; left: -10px; top: 50%; transform: translateY(-50%);\n  width: 3px; height: 20px; border-radius: 0 3px 3px 0; background: var(--brand);\n  box-shadow: 0 0 10px rgba(232,163,61,.7);\n}\n.nav-btn.active .nav-icon { color: var(--brand); }\n.nav-btn .nav-icon { font-size: 16px; width: 18px; text-align: center; flex-shrink: 0; color: var(--text-muted); transition: color var(--transition-fast); }\n.nav-btn:hover .nav-icon { color: var(--text-secondary); }\n.nav-btn .nav-label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }\n\n.sidebar-footer { padding: var(--space-md); border-top: 1px solid var(--border); background: rgba(0,0,0,.2); }\n.sidebar-progress-label {\n  font-family: var(--font-mono); font-size: 10px; color: var(--text-muted);\n  margin-bottom: 9px; display: flex; justify-content: space-between;\n  text-transform: uppercase; letter-spacing: 0.1em;\n}\n.progress-bar-track { width: 100%; height: 6px; background: var(--bg-inset); border-radius: 99px; overflow: hidden; box-shadow: var(--shadow-inset); }\n.progress-bar-fill {\n  height: 100%; border-radius: 99px; width: 0%;\n  background: linear-gradient(90deg, var(--brand-deep), var(--brand));\n  box-shadow: 0 0 12px rgba(232,163,61,.55);\n  transition: width var(--transition-slow);\n}\n\n.phase-segments { display: flex; gap: 4px; }\n.phase-seg { flex: 1; height: 5px; background: var(--bg-inset); border-radius: 99px; overflow: hidden; box-shadow: var(--shadow-inset); }\n.phase-seg-fill { height: 100%; border-radius: 99px; transition: width var(--transition-slow); box-shadow: 0 0 8px currentColor; }\n\n/* ── Main ── */\n.main-content {\n  flex: 1; overflow-y: auto; overflow-x: hidden;\n  padding: 0 var(--space-xl) var(--space-2xl);\n  scroll-behavior: smooth;\n}\n\n.tab-panel { display: none; animation: fadeIn var(--transition-normal); max-width: 1180px; margin: 0 auto; }\n.tab-panel.active { display: block; }\n@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }\n\n/* ── Sticky readout strip ── */\n.status-bar {\n  position: sticky; top: 0; z-index: 50;\n  display: flex; align-items: center; justify-content: space-between; gap: var(--space-md);\n  margin: 0 calc(-1 * var(--space-xl)) var(--space-lg);\n  padding: 13px var(--space-xl);\n  border: none; border-bottom: 1px solid var(--border); border-radius: 0;\n  background: #100d0b;\n  box-shadow: 0 1px 0 rgba(255,255,255,.03), 0 10px 24px -20px #000;\n  font-family: var(--font-mono);\n  font-size: 10.5px;\n  text-transform: uppercase;\n  letter-spacing: 0.13em;\n  color: var(--text-muted);\n}\n.status-bar .sb-group { display: flex; align-items: center; gap: 9px; }\n.status-bar .sb-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }\n.status-bar .sb-week, .status-bar .sb-yield { color: var(--text-bright); font-weight: 600; letter-spacing: 0.06em; }\n.status-bar .sb-lamp { width: 8px; height: 8px; border-radius: 50%; box-shadow: 0 0 8px currentColor; flex-shrink: 0; }\n\n/* ── Typography ── */\nh2.tab-heading {\n  font-family: var(--font-display);\n  font-size: 46px;\n  font-weight: 400;\n  color: var(--text-bright);\n  margin-bottom: var(--space-lg);\n  text-transform: none;\n  letter-spacing: -0.015em;\n  line-height: 1.02;\n}\nh3 {\n  font-family: var(--font-sans);\n  font-size: 15px;\n  font-weight: 600;\n  color: var(--text-bright);\n  letter-spacing: -0.01em;\n}\n\n/* ── Cards ── */\n.card {\n  background: linear-gradient(180deg, #221b17 0%, var(--bg-card) 42%);\n  border: 1px solid var(--border);\n  border-radius: var(--radius-lg);\n  padding: var(--space-lg);\n  box-shadow: var(--hair), var(--shadow-card);\n  transition: border-color var(--transition-fast), box-shadow var(--transition-normal), transform var(--transition-fast);\n}\n.card:hover {\n  border-color: var(--border-light);\n  box-shadow: var(--hair), var(--shadow-raised);\n  transform: translateY(-2px);\n}\n\n.stat-card {\n  background: linear-gradient(180deg, #221b17, var(--bg-card));\n  border: 1px solid var(--border);\n  border-radius: var(--radius-lg);\n  padding: var(--space-md) var(--space-md) 14px;\n  box-shadow: var(--hair), var(--shadow-card);\n  display: flex; flex-direction: column; align-items: flex-start; gap: 2px;\n  position: relative; overflow: hidden;\n  transition: border-color var(--transition-fast), transform var(--transition-fast);\n}\n.stat-card::before {\n  content: ''; position: absolute; left: var(--space-md); right: var(--space-md); top: 0; height: 2px;\n  background: linear-gradient(90deg, var(--brand), transparent);\n  opacity: .65;\n}\n.stat-card:hover { border-color: var(--border-light); transform: translateY(-2px); }\n.stat-card .stat-value {\n  order: 2;\n  font-family: var(--font-mono);\n  font-size: 32px;\n  font-weight: 500;\n  color: var(--text-bright);\n  line-height: 1.05;\n  letter-spacing: -0.03em;\n}\n.stat-card .stat-label {\n  order: 1;\n  font-family: var(--font-mono);\n  font-size: 9.5px;\n  font-weight: 500;\n  color: var(--text-muted);\n  text-transform: uppercase;\n  letter-spacing: 0.16em;\n  margin-bottom: 6px;\n}\n\n/* ── Buttons ── */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 7px;\n  height: 34px; padding: 0 15px;\n  border: 1px solid var(--border-light);\n  border-radius: 99px;\n  background: rgba(255,255,255,.035);\n  color: var(--text-primary);\n  font-family: var(--font-sans);\n  font-size: 12.5px;\n  font-weight: 500;\n  letter-spacing: -0.005em;\n  cursor: pointer;\n  white-space: nowrap;\n  transition: all var(--transition-fast);\n  box-shadow: var(--hair);\n}\n.btn:hover { background: rgba(255,255,255,.075); border-color: #4d3e33; color: var(--text-bright); transform: translateY(-1px); }\n.btn:active { transform: none; }\n.btn-primary {\n  background: linear-gradient(180deg, #f0ad4d, var(--brand-deep));\n  color: #1c1206; border-color: transparent; font-weight: 600;\n  box-shadow: inset 0 1px 0 rgba(255,255,255,.3), 0 4px 14px -6px rgba(232,163,61,.65);\n}\n.btn-primary:hover { background: linear-gradient(180deg, #f7ba62, #d3902f); color: #1c1206; border-color: transparent; }\n.btn-danger { background: transparent; border-color: rgba(224,112,90,.5); color: var(--state-fault); }\n.btn-danger:hover { background: var(--state-fault); color: #1c0d0a; border-color: var(--state-fault); }\n.btn-sm { height: 27px; padding: 0 11px; font-size: 11.5px; }\n\n/* ── Badges, pills, tags ── */\n.badge {\n  display: inline-block; padding: 3px 9px;\n  border-radius: 99px;\n  font-family: var(--font-mono); font-size: 9.5px; font-weight: 500;\n  text-transform: uppercase; letter-spacing: 0.13em;\n}\n.badge-phase-1 { background: var(--phase-1-bg); color: var(--phase-1); }\n.badge-phase-2 { background: var(--phase-2-bg); color: var(--phase-2); }\n.badge-phase-3 { background: var(--phase-3-bg); color: var(--phase-3); }\n.badge-phase-4 { background: var(--phase-4-bg); color: var(--phase-4); }\n.badge-phase-5 { background: var(--phase-5-bg); color: var(--phase-5); }\n.badge-phase-6 { background: var(--phase-6-bg); color: var(--phase-6); }\n.badge-phase-7 { background: var(--phase-7-bg); color: var(--phase-7); }\n\n.pill {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 3px 10px 3px 8px;\n  border: 1px solid currentColor;\n  border-radius: 99px;\n  background: rgba(255,255,255,.02);\n  font-family: var(--font-mono); font-size: 9.5px; font-weight: 500;\n  text-transform: uppercase; letter-spacing: 0.11em;\n}\n.pill::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: currentColor; box-shadow: 0 0 6px currentColor; flex-shrink: 0; }\n.pill-not-started { color: var(--state-idle); }\n.pill-in-progress { color: var(--state-warn); }\n.pill-complete    { color: var(--state-run); }\n\n.tag {\n  display: inline-block; padding: 3px 9px;\n  background: rgba(255,255,255,.05);\n  border: 1px solid var(--border);\n  border-radius: 99px;\n  font-family: var(--font-mono); font-size: 10px; color: var(--text-secondary);\n  letter-spacing: 0.04em;\n}\n\n/* ── Tables ── */\n.data-table { width: 100%; border-collapse: collapse; font-size: 13px; }\n.data-table th {\n  font-family: var(--font-mono); font-size: 9.5px; font-weight: 500;\n  color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.16em;\n  text-align: left; padding: 10px 12px;\n  border-bottom: 1px solid var(--border-light);\n  white-space: nowrap;\n}\n.data-table td { padding: 11px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }\n.data-table tr:hover td { background: rgba(232,163,61,.045); }\n.data-table tr.row-overdue td:first-child { box-shadow: inset 3px 0 0 var(--state-fault); }\n\n/* ── Form controls ── */\ninput[type=\"text\"], input[type=\"password\"], input[type=\"date\"], input[type=\"number\"],\ninput[type=\"url\"], select, textarea {\n  width: 100%;\n  background: var(--bg-inset);\n  border: 1px solid var(--border);\n  border-radius: var(--radius-md);\n  padding: 9px 12px;\n  color: var(--text-primary);\n  font-family: var(--font-sans);\n  font-size: 13px;\n  box-shadow: var(--shadow-inset);\n  transition: border-color var(--transition-fast), box-shadow var(--transition-fast);\n}\ninput::placeholder, textarea::placeholder { color: var(--text-muted); }\ninput:focus, select:focus, textarea:focus {\n  outline: none;\n  border-color: var(--brand);\n  box-shadow: var(--shadow-inset), 0 0 0 3px rgba(232,163,61,.16);\n}\ntextarea { resize: vertical; min-height: 76px; line-height: 1.6; }\nselect { cursor: pointer; appearance: none; padding-right: 30px;\n  background-image: linear-gradient(45deg, transparent 50%, var(--text-muted) 50%), linear-gradient(135deg, var(--text-muted) 50%, transparent 50%);\n  background-position: calc(100% - 15px) 50%, calc(100% - 10px) 50%;\n  background-size: 5px 5px, 5px 5px; background-repeat: no-repeat;\n}\nlabel { font-family: var(--font-mono); font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.14em; color: var(--text-muted); display: block; margin-bottom: 6px; }\n\n.checkbox-row { display: flex; align-items: center; gap: 10px; padding: 5px 0; cursor: pointer; }\n.checkbox-row input[type=\"checkbox\"] {\n  appearance: none; width: 17px; height: 17px; flex-shrink: 0;\n  border: 1.5px solid var(--border-light);\n  border-radius: 5px;\n  background: var(--bg-inset);\n  cursor: pointer; position: relative;\n  transition: all var(--transition-fast);\n  box-shadow: var(--shadow-inset);\n}\n.checkbox-row input[type=\"checkbox\"]:hover { border-color: var(--brand); }\n.checkbox-row input[type=\"checkbox\"]:checked {\n  background: linear-gradient(180deg, #f0ad4d, var(--brand-deep));\n  border-color: var(--brand-deep);\n  box-shadow: 0 0 12px rgba(232,163,61,.45);\n}\n.checkbox-row input[type=\"checkbox\"]:checked::after {\n  content: ''; position: absolute; left: 5px; top: 1.5px;\n  width: 5px; height: 9px;\n  border: solid #1c1206; border-width: 0 2px 2px 0;\n  transform: rotate(42deg);\n}\n.checkbox-row input[type=\"checkbox\"]:checked + span,\n.checkbox-row input[type=\"checkbox\"]:checked ~ span { color: var(--text-muted); }\n\n/* ── AI panel ── */\n.ai-panel {\n  background: linear-gradient(180deg, rgba(232,163,61,.07), transparent 60%), var(--bg-ai);\n  border: 1px solid var(--border-light);\n  border-radius: var(--radius-lg);\n  padding: var(--space-md);\n  margin-top: var(--space-md);\n  box-shadow: var(--hair);\n}\n.ai-panel .ai-label {\n  font-family: var(--font-mono); font-size: 9.5px; font-weight: 500;\n  color: var(--brand); text-transform: uppercase; letter-spacing: 0.18em;\n  margin-bottom: 10px; display: block;\n}\n\n.mono-block {\n  background: var(--bg-inset);\n  border: 1px solid var(--border);\n  border-left: 2px solid var(--brand);\n  border-radius: var(--radius-md);\n  padding: 13px 15px;\n  font-family: var(--font-mono);\n  font-size: 11.5px;\n  line-height: 1.7;\n  color: var(--text-secondary);\n  white-space: pre-wrap;\n  overflow-x: auto;\n  box-shadow: var(--shadow-inset);\n}\n\n/* ── Collapsibles ── */\n.collapsible-header {\n  display: flex; align-items: center; gap: 10px;\n  cursor: pointer;\n  padding: 12px 0;\n  color: var(--text-primary);\n  transition: color var(--transition-fast);\n}\n.collapsible-header:hover { color: var(--text-bright); }\n.collapsible-header .arrow {\n  display: inline-flex; align-items: center;\n  font-size: 10px; color: var(--text-muted);\n  transition: transform var(--transition-normal), color var(--transition-fast);\n}\n.collapsible-header:hover .arrow { color: var(--brand); }\n.collapsible-header .arrow.open { transform: rotate(90deg); color: var(--brand); }\n.collapsible-body { max-height: 0; overflow: hidden; transition: max-height var(--transition-slow); }\n.collapsible-body.open { max-height: 5000px; }\n\n.priority-star { color: var(--brand); font-size: 14px; }\n\n/* ── Layout helpers ── */\n.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: var(--space-md); }\n.grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: var(--space-md); }\n.grid-4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: var(--space-md); }\n.flex-row { display: flex; gap: var(--space-md); align-items: center; }\n.flex-wrap { flex-wrap: wrap; }\n\n/* ── Spinner ── */\n.spinner { display: inline-block; width: 18px; height: 18px; border: 2px solid var(--border); border-top-color: var(--brand); border-radius: 50%; animation: spin .65s linear infinite; }\n@keyframes spin { to { transform: rotate(360deg); } }\n\n/* ── Toasts ── */\n.toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 10000; display: flex; flex-direction: column; gap: 10px; }\n.toast {\n  background: rgba(30,24,20,.95);\n  border: 1px solid var(--border-light);\n  border-radius: var(--radius-md);\n  padding: 12px 18px;\n  font-family: var(--font-sans); font-size: 12.5px; color: var(--text-primary);\n  box-shadow: var(--shadow-raised);\n  animation: toastIn var(--transition-normal) forwards;\n  min-width: 220px;\n}\n.toast.toast-out { animation: toastOut var(--transition-normal) forwards; }\n.toast-success { border-left: 3px solid var(--state-run); }\n.toast-error   { border-left: 3px solid var(--state-fault); }\n.toast-info    { border-left: 3px solid var(--brand); }\n.toast-warning { border-left: 3px solid var(--state-warn); }\n@keyframes toastIn { from { opacity: 0; transform: translateX(40px) scale(.96); } to { opacity: 1; transform: none; } }\n@keyframes toastOut { from { opacity: 1; transform: none; } to { opacity: 0; transform: translateX(40px) scale(.96); } }\n\n/* ── Modal ── */\n.modal-overlay {\n  display: none; position: fixed; inset: 0;\n  background: rgba(8,6,5,.72);\n  z-index: 9000; align-items: center; justify-content: center;\n  animation: fadeIn var(--transition-fast);\n}\n.modal-overlay.open { display: flex; }\n.modal {\n  background: linear-gradient(180deg, #221b17, var(--bg-surface));\n  border: 1px solid var(--border-light);\n  border-radius: var(--radius-lg);\n  width: 90%; max-width: 660px; max-height: 82vh;\n  display: flex; flex-direction: column;\n  box-shadow: var(--hair), var(--shadow-raised);\n  animation: modalIn 180ms cubic-bezier(.4,0,.2,1);\n}\n@keyframes modalIn { from { opacity: 0; transform: scale(.97) translateY(10px); } to { opacity: 1; transform: none; } }\n.modal-header { display: flex; align-items: center; justify-content: space-between; padding: var(--space-lg); border-bottom: 1px solid var(--border); }\n.modal-header h3 { font-family: var(--font-display); font-size: 24px; font-weight: 400; color: var(--text-bright); letter-spacing: -0.01em; }\n.modal-close { background: none; border: none; color: var(--text-muted); font-size: 20px; cursor: pointer; padding: 4px 9px; border-radius: var(--radius-sm); transition: all var(--transition-fast); }\n.modal-close:hover { color: var(--text-bright); background: rgba(255,255,255,.07); }\n.modal-body { padding: var(--space-lg); overflow-y: auto; flex: 1; }\n.modal-footer { padding: var(--space-md) var(--space-lg); border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: var(--space-sm); }\n\n/* ── Onboarding ── */\n.api-setup-screen { display: none; position: fixed; inset: 0; background: var(--bg-base); z-index: 9999; align-items: center; justify-content: center; }\n.api-setup-screen.open { display: flex; }\n.api-setup-box {\n  background: linear-gradient(180deg, #221b17, var(--bg-surface));\n  border: 1px solid var(--border-light);\n  border-radius: 20px;\n  padding: var(--space-2xl) var(--space-xl);\n  max-width: 500px; width: 90%; text-align: center;\n  box-shadow: var(--hair), var(--shadow-raised);\n}\n.api-setup-box .onboard-mark { width: 52px; height: 52px; margin: 0 auto var(--space-md); display: block; }\n.api-setup-box h2 {\n  font-family: var(--font-display); font-size: 34px; font-weight: 400;\n  text-transform: none; letter-spacing: -0.015em; color: var(--text-bright);\n  margin: 8px 0 var(--space-md); line-height: 1.05;\n}\n.api-setup-box p { color: var(--text-secondary); font-size: 13.5px; margin-bottom: var(--space-lg); line-height: 1.65; }\n.api-setup-box .onboard-note { font-size: 11px; color: var(--text-muted); margin-top: var(--space-md); line-height: 1.55; }\n.api-setup-box .skip-link {\n  display: inline-block; margin-top: var(--space-md);\n  color: var(--text-muted); font-family: var(--font-mono); font-size: 10.5px;\n  cursor: pointer; text-decoration: underline; text-underline-offset: 4px;\n}\n.api-setup-box .skip-link:hover { color: var(--brand); }\n\n/* ── Empty states ── */\n.tab-placeholder {\n  display: flex; flex-direction: column; align-items: center; justify-content: center;\n  min-height: 320px; color: var(--text-muted);\n  font-family: var(--font-mono); font-size: 12px; text-align: center; gap: var(--space-md);\n  border: 1px dashed var(--border-light); border-radius: var(--radius-lg);\n  background: rgba(255,255,255,.012);\n}\n.tab-placeholder .placeholder-icon { font-size: 34px; opacity: .35; }\n\n/* ── Icons ── */\n.icon { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }\n.icon-lg { width: 20px; height: 20px; }\n.icon-caret { width: 13px; height: 13px; }\n.nav-icon { display: inline-flex; align-items: center; justify-content: center; width: 18px; }\n.btn .icon { margin-right: -2px; }\n\n/* ══ Tab hero: graphic + typographic, no photography ══ */\n.tab-hero {\n  position: relative;\n  margin: 0 0 var(--space-xl);\n  padding: var(--space-2xl) var(--space-xl) var(--space-xl);\n  min-height: 0;\n  display: flex; flex-direction: column; justify-content: flex-end;\n  border: none; border-bottom: 1px solid var(--border);\n  border-radius: 0;\n  overflow: hidden;\n  background: none;\n  box-shadow: none;\n  isolation: isolate;\n}\n/* Decorative backdrop: concentric arcs + fine grid, drawn in CSS. */\n.tab-hero .hero-media {\n  position: absolute; inset: 0; z-index: 0;\n  background-image: radial-gradient(620px 300px at 86% 28%, rgba(232,163,61,.13), rgba(232,163,61,0) 70%);\n}\n.tab-hero .hero-overlay {\n  position: absolute; inset: 0; z-index: 1;\n  background: linear-gradient(90deg, rgba(14,11,9,.94) 0%, rgba(14,11,9,.55) 52%, rgba(14,11,9,0) 100%);\n}\n/* Ghost module numeral, set in the display serif. */\n.tab-hero::after {\n  content: attr(data-num);\n  position: absolute; right: 6px; top: 50%; transform: translateY(-52%);\n  z-index: 1;\n  font-family: var(--font-display);\n  font-size: 190px; line-height: 1;\n  color: rgba(236,228,217,.045);\n  letter-spacing: -0.05em;\n  pointer-events: none;\n}\n.tab-hero > .eyebrow, .tab-hero > .tab-heading, .tab-hero > .hero-sub { position: relative; z-index: 2; }\n.tab-hero .hero-accent { position: absolute; left: 0; top: 0; bottom: 0; width: 0; z-index: 2; }\n.tab-hero .tab-heading { margin-bottom: 12px; max-width: 22ch; }\n.tab-hero .hero-sub {\n  font-family: var(--font-sans);\n  font-size: 15px;\n  color: var(--text-secondary);\n  max-width: 62ch;\n  line-height: 1.6;\n}\n\n/* ══ Dashboard wafer map ══ */\n.wafer-hero { display: flex; align-items: center; gap: var(--space-2xl); flex-wrap: wrap; justify-content: center; }\n.wafer-figure { display: flex; flex-direction: column; align-items: center; gap: 12px; }\n.wafer-svg { width: 272px; height: 272px; }\n.wafer-figure { position: relative; }\n.wafer-figure::before {\n  content: ''; position: absolute; left: 50%; top: 42%; width: 300px; height: 300px;\n  transform: translate(-50%,-50%); border-radius: 50%; pointer-events: none;\n  background: radial-gradient(circle, rgba(232,163,61,.13), rgba(232,163,61,0) 68%);\n}\n.wafer-caption { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.18em; color: var(--text-muted); }\n.wafer-die { transform-box: fill-box; transform-origin: center; }\n.yield-readout { display: flex; flex-direction: column; min-width: 220px; }\n.yield-number {\n  font-family: var(--font-display); font-size: 78px; font-weight: 400; line-height: .92;\n  color: var(--brand); font-variant-numeric: tabular-nums;\n  border-bottom: none; padding-bottom: 0; width: max-content;\n  letter-spacing: -0.03em;\n\n}\n.yield-sub { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.18em; color: var(--text-muted); margin-top: 10px; }\n.yield-stats { margin-top: var(--space-lg); display: flex; flex-direction: column; gap: 0; border-top: 1px solid var(--border); }\n.yield-stat {\n  display: flex; justify-content: space-between; gap: var(--space-lg);\n  font-family: var(--font-mono); font-size: 11.5px;\n  padding: 9px 0; border-bottom: 1px solid var(--border);\n}\n.yield-stat .k { color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.11em; font-size: 10px; }\n.yield-stat .v { color: var(--text-bright); font-weight: 600; }\n\n@keyframes diePop { from { opacity: 0; transform: scale(.25); } to { opacity: 1; transform: scale(1); } }\n.wafer-anim .wafer-die { opacity: 0; animation: diePop 300ms cubic-bezier(.4,0,.2,1) forwards; }\n\n/* ── Scroll reveal ── */\n.reveal { opacity: 0; transform: translateY(18px); transition: opacity 560ms cubic-bezier(.4,0,.2,1), transform 560ms cubic-bezier(.4,0,.2,1); will-change: opacity, transform; }\n.reveal.in { opacity: 1; transform: none; }\n\n/* ── Accents on cards ── */\n.card-phase-top { border-top-width: 2px; border-top-style: solid; }\n.card-flagship {\n  border-left: 2px solid var(--brand);\n  background: linear-gradient(100deg, rgba(232,163,61,.07), transparent 34%), linear-gradient(180deg, #221b17, var(--bg-card));\n}\n.pill-flagship { color: var(--brand); }\n.pill-light { color: var(--text-muted); }\n\n.track-bar { height: 5px; background: var(--bg-inset); border-radius: 99px; overflow: hidden; box-shadow: var(--shadow-inset); }\n.track-bar-fill { height: 100%; border-radius: 99px; transition: width var(--transition-slow); box-shadow: 0 0 10px currentColor; }\n\n/* ── Procedure list ── */\n.procedure {\n  border: 1px solid var(--border); border-radius: var(--radius-lg);\n  background: linear-gradient(180deg, #221b17, var(--bg-card));\n  overflow: hidden; box-shadow: var(--hair), var(--shadow-card);\n}\n.procedure-item { display: flex; gap: var(--space-md); padding: 16px var(--space-lg); border-bottom: 1px solid var(--border); transition: background var(--transition-fast); }\n.procedure-item:hover { background: rgba(232,163,61,.035); }\n.procedure-item:last-child { border-bottom: none; }\n.procedure-num { font-family: var(--font-mono); font-weight: 500; font-size: 11px; color: var(--brand); min-widt  font-size: 9.5px; color: var(--text-muted); text-decoration: none; letter-spacing: 0.04em; word-break: break-all; }\n.res-url:hover { color: var(--text-secondary); }\n.res-progress { display: flex; gap: var(--space-md); margin-top: auto; padding-top: 4px; border-top: 1px solid var(--border); }\n.res-progress .checkbox-row span { font-family: var(--font-mono); font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--text-muted); }\n\n/* ══ STAR bank ══ */\n.star-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; flex: 1; min-width: 0; }\n.star-title { font-family: var(--font-display); font-size: 20px; line-height: 1.15; color: var(--text-bright); letter-spacing: -0.01em; }\n.star-fill { font-family: var(--font-mono); font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.13em; color: var(--text-muted); white-space: nowrap; }\n.star-fill.done { color: var(--state-run); }\n/* ══ Materials ══ */\n.mat-row {\n  display: flex; align-items: center; gap: var(--space-sm);\n  padding: 7px 9px; border-radius: var(--radius-sm); cursor: pointer;\n  font-size: 13px; color: var(--text-primary);\n  transition: background var(--transition-fast);\n}\n.mat-row:hover { background: rgba(255,255,255,.04); }\n.mat-row.on { color: var(--text-muted); }\n.mat-row.on .mat-name { text-decoration: line-through; }\n.mat-cost { font-family: var(--font-mono); font-size: 12px; min-width: 52px; text-align: right; }\n.mat-opt { font-family: var(--font-mono); font-size: 8.5px; letter-spacing: 0.12em; text-transform: uppercase; background: rgba(255,255,255,.05); color: var(--text-muted); padding: 3px 7px; border-radius: 4px; }\n.mat-total { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 11.5px; color: var(--text-muted); border-top: 1px solid var(--border); margin-top: var(--space-md); padding-top: var(--space-md); text-transform: uppercase; letter-spacing: 0.11em; }\n/* ══ Study launcher ══ */\n.study-grid { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: var(--space-lg); align-items: start; }\n.preset-card { padding: var(--space-md); cursor: pointer; }\n.preset-title { font-family: var(--font-display); font-size: 19px; line-height: 1.15; color: var(--text-bright); letter-spacing: -0.01em; display: block; margin-bottom: 8px; }\n.preset-card:hover .preset-title { color: var(--brand); }\n.preset-topic { font-size: 12.5px; color: var(--text-secondary); line-height: 1.5; }\n@media (max-width: 940px) { .study-grid { grid-template-columns: 1fr; } }\n.profile-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px,1fr)); gap: var(--space-md); }\n\n/* ═══════════════════════════════════════════════════════\n   MOBILE LAYER v8 — bottom tab bar, sheets, touch density\n   ═══════════════════════════════════════════════════════ */\n.bottom-nav, .more-sheet, .sheet-scrim, .filter-fab, .sheet-done, .mobile-bar .mb-module { display: none; }\n\n@media (max-width: 900px) {\n  /* ── Chrome: top bar is orientation only, nav moves to the thumb ── */\n  .mobile-bar .mb-menu { display: none; }\n  .mobile-bar .mb-module {\n    display: block; margin-left: auto; max-width: 46%;\n    font-family: var(--font-mono); font-size: 9.5px; text-transform: uppercase;\n    letter-spacing: 0.16em; color: var(--text-muted);\n    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: right;\n  }\n  .sidebar, .sidebar-scrim { display: none !important; }\n  /* The panel fade leaves a transform on .tab-panel, which would make it the\n     containing block for the fixed filter sheet. Drop it on phones. */\n  .tab-panel { animation: none; }\n  .main-content {\n    height: 100dvh;\n    padding: 54px var(--space-md) calc(84px + env(safe-area-inset-bottom));\n    overscroll-behavior-y: contain;\n  }\n\n  .bottom-nav {\n    display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 95;\n    background: #16110e; border-top: 1px solid var(--border);\n    padding: 0 2px env(safe-area-inset-bottom);\n    box-shadow: 0 -10px 26px -20px #000;\n  }\n  .bn-item {\n    flex: 1; min-width: 0; height: 58px;\n    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;\n    background: none; border: none; cursor: pointer; position: relative;\n    color: var(--text-muted);\n    font-family: var(--font-mono); font-size: 8.5px; font-weight: 500;\n    text-transform: uppercase; letter-spacing: 0.1em;\n    -webkit-tap-highlight-color: transparent;\n    transition: color var(--transition-fast);\n  }\n  .bn-item .icon { width: 21px; height: 21px; }\n  .bn-item.active { color: var(--brand); }\n  .bn-item.active::before {\n    content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%);\n    width: 26px; height: 2px; background: var(--brand); box-shadow: 0 0 9px var(--brand);\n  }\n  .bn-item:active { background: rgba(255,255,255,.05); }\n\n  /* ── Sheets ── */\n  .sheet-scrim {\n    display: block; position: fixed; inset: 0; z-index: 96;\n    background: rgba(8,6,5,.64); opacity: 0; pointer-events: none;\n    transition: opacity var(--transition-fast);\n  }\n  body.sheet-open .sheet-scrim, body.filters-open .sheet-scrim { opacity: 1; pointer-events: auto; }\n\n  .more-sheet {\n    display: flex; flex-direction: column;\n    position: fixed; left: 0; right: 0; bottom: 0; z-index: 98;\n    max-height: 86dvh;\n    transform: translateY(102%);\n    transition: transform var(--transition-normal);\n    background: linear-gradient(180deg, #221b17, var(--bg-surface));\n    border-top: 1px solid var(--border-light);\n    border-radius: 18px 18px 0 0;\n    box-shadow: var(--shadow-raised);\n    padding-bottom: env(safe-area-inset-bottom);\n  }\n  body.sheet-open .more-sheet { transform: none; }\n  .sheet-grip { width: 38px; height: 4px; border-radius: 99px; background: var(--border-light); margin: 10px auto 2px; flex-shrink: 0; }\n  .sheet-title {\n    font-family: var(--font-mono); font-size: 9px; text-transform: uppercase;\n    letter-spacing: 0.2em; color: var(--text-muted); padding: 8px 22px 6px;\n  }\n  .sheet-body { overflow-y: auto; padding: 2px 10px 14px; -webkit-overflow-scrolling: touch; }\n  .ms-row {\n    display: flex; align-items: center; gap: 14px;\n    width: 100%; min-height: 52px; padding: 0 12px;\n    border: none; background: none; border-radius: var(--radius-md);\n    color: var(--text-primary); font-family: var(--font-sans); font-size: 15px;\n    text-align: left; cursor: pointer; -webkit-tap-highlight-color: transparent;\n  }\n  .ms-row .icon { width: 18px; height: 18px; color: var(--text-muted); }\n  .ms-row:active { background: rgba(255,255,255,.05); }\n  .ms-row.active { background: var(--brand-soft); color: var(--text-bright); box-shadow: var(--hair); }\n  .ms-row.active .icon { color: var(--brand); }\n  .ms-util {\n    display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px;\n    margin: 10px 12px 0; padding-top: 14px; border-top: 1px solid var(--border);\n  }\n  .ms-util .btn { width: 100%; }\n\n  /* ── Filters become a sheet; the fab is the way in ── */\n  .control-bar {\n    position: fixed; left: 0; right: 0; bottom: 0; z-index: 97;\n    margin: 0; display: grid; grid-template-columns: 1fr; gap: 14px;\n    max-height: 82dvh; overflow-y: auto;\n    padding: 6px 18px calc(20px + env(safe-area-inset-bottom));\n    border: 1px solid var(--border-light); border-bottom: none;\n    border-radius: 18px 18px 0 0;\n    background: linear-gradient(180deg, #221b17, var(--bg-surface));\n    box-shadow: var(--shadow-raised);\n    transform: translateY(102%);\n    transition: transform var(--transition-normal);\n  }\n  body.filters-open .control-bar { transform: none; }\n  .control-bar::before {\n    content: 'Filters'; display: block;\n    font-family: var(--font-mono); font-size: 9px; text-transform: uppercase;\n    letter-spacing: 0.2em; color: var(--text-muted);\n    padding: 12px 0 10px; border-bottom: 1px solid var(--border);\n  }\n  .control-bar > div { min-width: 0; margin-left: 0 !important; }\n  .control-bar select, .control-bar input, .control-bar .btn { width: 100% !important; min-width: 0 !important; }\n  .control-bar > div[style*=\"margin-left\"] { display: grid !important; grid-template-columns: 1fr; gap: 8px; }\n\n  .filter-fab {\n    display: inline-flex; align-items: center; gap: 8px;\n    position: fixed; right: 14px; bottom: calc(72px + env(safe-area-inset-bottom)); z-index: 94;\n    height: 44px; padding: 0 18px; border-radius: 99px;\n    border: 1px solid var(--border-light);\n    background: rgba(30,24,20,.94);\n    color: var(--text-bright);\n    font-family: var(--font-mono); font-size: 10px; font-weight: 500;\n    text-transform: uppercase; letter-spacing: 0.14em;\n    box-shadow: var(--shadow-raised); cursor: pointer;\n  }\n  body:not(.has-filters) .filter-fab, body.filters-open .filter-fab, body.sheet-open .filter-fab { display: none; }\n\n  /* ── Touch density: 42px+ targets, 16px fields (no iOS zoom) ── */\n  .btn { height: 42px; padding: 0 17px; font-size: 13.5px; }\n  .btn-sm { height: 34px; padding: 0 13px; font-size: 12px; }\n  input[type=\"text\"], input[type=\"password\"], input[type=\"date\"], input[type=\"number\"],\n  input[type=\"url\"], select, textarea { font-size: 16px; padding: 11px 13px; }\n  .app-row select, .app-row input { font-size: 16px; padding: 11px 13px; }\n  .checkbox-row { padding: 9px 0; gap: 13px; }\n  .checkbox-row input[type=\"checkbox\"] { width: 22px; height: 22px; border-radius: 6px; }\n  .checkbox-row input[type=\"checkbox\"]:checked::after { left: 7px; top: 3px; width: 6px; height: 11px; }\n  .collapsible-header { min-height: 52px; }\n  .modal-close { min-width: 44px; min-height: 44px; }\n\n  /* ── Density: one column by default, two only for numbers ── */\n  .card { padding: var(--space-md); border-radius: var(--radius-md); }\n  .card:hover, .stat-card:hover, .pf-card:hover { transform: none; }\n  .grid-2 { grid-template-columns: 1fr; gap: 10px; }\n  .grid-3, .grid-4 { grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }\n  .portfolio-grid, .profile-grid, .study-grid { grid-template-columns: 1fr; }\n  .stat-card { padding: 12px 13px; }\n  .stat-card .stat-value { font-size: 25px; }\n  .stat-card .stat-label { font-size: 9px; letter-spacing: 0.12em; }\n  .section-rule { margin: var(--space-xl) 0 var(--space-md); }\n  .wafer-svg, .dash-hero .wafer-svg { width: min(232px, 66vw); height: min(232px, 66vw); }\n  .wafer-figure::before { display: none; }\n  .upnext-actions { width: 100%; }\n  .upnext-actions .btn { flex: 1 1 140px; }\n  .tab-hero { padding: var(--space-lg) 0 var(--space-md); }\n  .tab-hero::after { font-size: 96px; right: -2px; top: 44%; }\n  .tab-hero .hero-sub { font-size: 14px; }\n  .ph-index { max-height: 46dvh; }\n  .mono-block { font-size: 11px; padding: 12px 13px; }\n\n  /* Applications: rows become cards, nothing hidden */\n  .app-row {\n    grid-template-columns: 1fr; gap: 10px;\n    padding: 14px 13px; margin-bottom: 8px;\n    border: 1px solid var(--border); border-radius: var(--radius-md);\n    background: rgba(255,255,255,.02);\n  }\n  .app-row .app-note-cell, .app-row .app-follow-cell { display: block; }\n  .app-row .del { justify-self: end; opacity: 1; }\n\n  /* Wide readouts scroll sideways instead of squashing */\n  .funnel { overflow-x: auto; scroll-snap-type: x proximity; margin: 0 calc(-1 * var(--space-md)) var(--space-md); padding: 0 var(--space-md) 6px; }\n  .funnel-seg { min-width: 96px; scroll-snap-align: start; }\n  .card:has(.data-table), .card:has(.heat-cell) { overflow-x: auto; }\n  .data-table { font-size: 12.5px; }\n\n  /* Modals become bottom sheets */\n  .modal-overlay { align-items: flex-end; }\n  .modal { width: 100%; max-width: none; max-height: 92dvh; border-radius: 18px 18px 0 0; }\n  .modal-header { padding: var(--space-md); }\n  .modal-header h3 { font-size: 21px; }\n  .modal-body { padding: var(--space-md); }\n  .modal-footer { padding: var(--space-md) var(--space-md) calc(var(--space-md) + env(safe-area-inset-bottom)); }\n  .modal-footer .btn { flex: 1; }\n\n  .toast-container { left: 12px; right: 12px; bottom: calc(72px + env(safe-area-inset-bottom)); }\n  .toast { min-width: 0; }\n\n  .api-setup-box { padding: var(--space-xl) var(--space-md); border-radius: var(--radius-lg); }\n  .api-setup-box h2 { font-size: 28px; }\n}\n\n@media (max-width: 420px) {\n  .grid-3, .grid-4 { grid-template-columns: 1fr; }\n  .bn-item { font-size: 8px; letter-spacing: 0.06em; }\n}\n\n/* ══ Today strip (P1 + P6) ══ */\n.today-card { display: grid; grid-template-columns: minmax(0,1.25fr) minmax(0,1fr); gap: var(--space-xl); align-items: start; margin-bottom: var(--space-lg); }\n.today-task { font-family: var(--font-display); font-size: 26px; line-height: 1.14; color: var(--text-bright); letter-spacing: -0.012em; }\n.today-next { display: flex; gap: 13px; align-items: flex-start; margin-top: 4px; }\n.today-meta { display: flex; flex-wrap: wrap; gap: 13px; margin-top: 12px; font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.15em; color: var(--text-muted); }\n.today-blk { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--border); font-family: var(--font-mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--text-muted); }\n.today-blk b { color: var(--text-primary); font-weight: 500; }\n.today-actions { display: flex; gap: var(--space-sm); flex-wrap: wrap; margin-top: var(--space-md); }\n.today-note { display: flex; align-items: center; gap: 11px; flex-wrap: wrap; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border); font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.13em; color: var(--state-warn); }\n.today-logged { color: var(--state-run); }\n@media (max-width: 900px) {\n  .today-card { grid-template-columns: 1fr; gap: var(--space-lg); }\n  .today-task { font-size: 22px; }\n}\n\n/* ══ Log sheet + action button (P2) ══ */\n.log-sheet, .log-fab { display: none; }\n@media (max-width: 900px) {\n  .log-sheet {\n    display: flex; flex-direction: column;\n    position: fixed; left: 0; right: 0; bottom: 0; z-index: 98;\n    transform: translateY(102%);\n    transition: transform var(--transition-normal);\n    background: linear-gradient(180deg, #221b17, var(--bg-surface));\n    border-top: 1px solid var(--border-light);\n    border-radius: 18px 18px 0 0;\n    box-shadow: var(--shadow-raised);\n  }\n  body.log-open .log-sheet { transform: none; }\n  body.log-open .sheet-scrim { opacity: 1; pointer-events: auto; }\n  .log-fab {\n    display: inline-flex; align-items: center; gap: 8px;\n    position: fixed; right: 14px; bottom: calc(72px + env(safe-area-inset-bottom)); z-index: 94;\n    height: 46px; padding: 0 20px; border-radius: 99px; border: none;\n    background: linear-gradient(180deg, #f0ad4d, var(--brand-deep));\n    color: #1c1206;\n    font-family: var(--font-mono); font-size: 10.5px; font-weight: 600;\n    text-transform: uppercase; letter-spacing: 0.14em;\n    box-shadow: inset 0 1px 0 rgba(255,255,255,.3), 0 6px 18px -8px rgba(232,163,61,.75);\n    cursor: pointer;\n  }\n  body:not(.can-log) .log-fab, body.has-filters .log-fab,\n  body.sheet-open .log-fab, body.filters-open .log-fab, body.log-open .log-fab { display: none; }\n\n  /* Phase headers stay put while you scroll a long module (P4) */\n  .card > .collapsible-header {\n    position: sticky; top: 54px; z-index: 20;\n    margin: calc(-1 * var(--space-md)) calc(-1 * var(--space-md)) 0;\n    padding: 12px var(--space-md);\n    background: linear-gradient(180deg, #241d18, #1e1814);\n    border-bottom: 1px solid var(--border);\n  }\n}\n\n/* ══════════════════════════════════════════════\n   MOBILE FIRST-SCREEN PASS\n   The chrome was eating the whole first screen:\n   a 54px dead band, a three-row status strip, a\n   142px sample banner and a 650px intro essay\n   before any content.\n   ══════════════════════════════════════════════ */\n@media (max-width: 900px) {\n  /* Sticky offsets resolve against the scrollport padding box, and\n     .main-content already pads 54px for the fixed bar — so top:0 is\n     what actually parks the strip under it. 54px was double-counting. */\n  .status-bar { top: 0; flex-wrap: nowrap; padding: 9px var(--space-md); gap: var(--space-sm); font-size: 9.5px; }\n  .status-bar .sb-group { min-width: 0; }\n  .status-bar .sb-group:first-child { flex: 1; overflow: hidden; }\n  .status-bar .sb-group:first-child span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }\n  .status-bar .sb-group + .sb-group { flex-shrink: 0; }\n\n  /* Sample-data notice: one line, real button, no paragraph */\n  .demo-banner { padding: 8px var(--space-md); gap: var(--space-sm); flex-wrap: nowrap; }\n  .demo-banner .db-text { display: none; }\n  .demo-banner .db-actions { margin-left: auto; }\n\n  /* Module hero: title and number only — the standfirst is desktop reading */\n  .tab-hero { padding: var(--space-md) 0 var(--space-sm); margin-bottom: var(--space-md); }\n  .tab-hero .hero-sub { display: none; }\n  .tab-hero::after { font-size: 58px; top: 50%; right: 6px; }\n  h2.tab-heading { font-size: clamp(26px, 7.5vw, 34px); margin-bottom: 0; }\n\n  /* Today leads, the explainer goes to the bottom */\n  #tab-dashboard.active { display: flex; flex-direction: column; }\n  #tab-dashboard.active > * { order: 3; }\n  #tab-dashboard.active > .tab-hero { order: 1; }\n  #tab-dashboard.active > #dashToday { order: 2; margin-bottom: var(--space-md); }\n  #tab-dashboard.active > .intro-card { order: 90; }\n  .intro-card .intro-body {\n    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;\n    overflow: hidden;\n  }\n  .today-card .today-blk:nth-child(n+5) { display: none; }\n  /* Track / weeks / focus read as one line of small caps, not a receipt */\n  .today-meta { gap: 6px 10px; font-size: 9.5px; letter-spacing: 0.11em; }\n  .today-meta span::after { content: '·'; margin-left: 10px; opacity: .5; }\n  .today-meta span:last-child::after { content: none; }\n\n  /* Sheets that cover most of the screen need a real way out */\n  body.filters-open .sheet-done, body.sheet-open .sheet-done {\n    display: inline-flex; align-items: center;\n    position: fixed; top: 64px; right: 14px; z-index: 99;\n    height: 40px; padding: 0 18px; border-radius: 99px;\n    border: 1px solid var(--border-light);\n    background: rgba(20,16,13,.96);\n    color: var(--text-bright);\n    font-family: var(--font-mono); font-size: 10px; font-weight: 500;\n    text-transform: uppercase; letter-spacing: 0.14em;\n    box-shadow: var(--shadow-raised); cursor: pointer;\n  }\n}\n\n/* ══════════════════════════════════════════════\n   MOBILE HOME: a screen you want to open\n   The wafer becomes the hero with the yield read\n   across it; the module title and the intro step\n   aside; everything below Today collapses.\n   ══════════════════════════════════════════════ */\n@media (max-width: 900px) {\n  /* The top bar already names the module — reclaim the 100px */\n  #tab-dashboard.active > .tab-hero { display: none; }\n\n  #tab-dashboard.active > .card:has(.dash-hero) { order: 1; position: relative; padding: var(--space-lg) var(--space-md) var(--space-sm); }\n  #tab-dashboard.active > #dashToday { order: 2; }\n\n  .card:has(.dash-hero) > .eyebrow { text-align: center; margin-bottom: var(--space-sm); }\n  .dash-hero { position: relative; grid-template-columns: 1fr; justify-items: center; gap: var(--space-md); }\n  .dash-hero .wafer-figure { align-items: center !important; }\n  .dash-hero .wafer-svg, .wafer-svg { width: min(244px, 70vw); height: min(244px, 70vw); }\n  /* A soft well behind the number so it reads over lit dies */\n  .dash-hero::before {\n    content: ''; position: absolute; z-index: 2; pointer-events: none;\n    left: 50%; top: calc(min(244px, 70vw) * 0.5);\n    width: 210px; height: 120px; transform: translate(-50%, -54%);\n    background: radial-gradient(ellipse at center, rgba(14,11,9,.94) 0%, rgba(14,11,9,.72) 45%, rgba(14,11,9,0) 72%);\n  }\n  .dash-hero .wafer-caption { display: none; }\n\n  /* Yield reads across the middle of the map */\n  .dash-hero .yield-readout { width: 100%; align-items: center; min-width: 0; }\n  .dash-hero .yield-number {\n    position: absolute; left: 50%; top: calc(min(244px, 70vw) * 0.5);\n    transform: translate(-50%, -54%);\n    z-index: 3; pointer-events: none;\n    font-size: clamp(58px, 17vw, 74px);\n    color: var(--text-bright);\n    text-shadow: 0 0 26px rgba(14,11,9,.96), 0 0 60px rgba(14,11,9,.92), 0 2px 4px rgba(14,11,9,.9);\n  }\n  /* \"of curriculum complete\" duplicates the PROGRAM YIELD eyebrow */\n  .dash-hero .yield-sub { display: none; }\n\n  /* Three readouts as a rail under the map */\n  .dash-hero .yield-stats {\n    display: grid; grid-template-columns: repeat(3, minmax(0,1fr));\n    width: 100%; margin-top: var(--space-sm);\n    border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);\n  }\n  .dash-hero .yield-stat {\n    flex-direction: column; align-items: center; text-align: center;\n    gap: 5px; padding: 12px 4px; border-bottom: none;\n  }\n  .dash-hero .yield-stat + .yield-stat { border-left: 1px solid var(--border); }\n  .dash-hero .yield-stat .k { font-size: 8.5px; letter-spacing: 0.14em; }\n  .dash-hero .yield-stat .v { font-size: 16px; }\n\n  /* This week keeps its focus and dial; the task list belongs to Progress */\n  .week-tasks .checkbox-row:nth-child(n+5) { display: none; }\n\n  /* Collapsed sections (built by mobileSections()) */\n  .m-sec { order: 4; border-bottom: 1px solid var(--border); }\n  .m-sec > summary {\n    display: flex; align-items: center; justify-content: space-between; gap: var(--space-md);\n    list-style: none; cursor: pointer; padding: 17px 2px;\n    font-family: var(--font-sans); font-size: 15px; font-weight: 500; color: var(--text-primary);\n    -webkit-tap-highlight-color: transparent;\n  }\n  .m-sec > summary::-webkit-details-marker { display: none; }\n  .m-sec > summary::after {\n    content: ''; width: 8px; height: 8px; flex-shrink: 0;\n    border-right: 1.5px solid var(--text-muted); border-bottom: 1.5px solid var(--text-muted);\n    transform: rotate(45deg); transition: transform var(--transition-fast);\n  }\n  .m-sec[open] > summary { color: var(--text-bright); }\n  .m-sec[open] > summary::after { transform: rotate(225deg); border-color: var(--brand); }\n  .m-sec > summary .m-sec-val { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-muted); margin-left: auto; }\n  .m-sec > .card, .m-sec > .grid-2 { margin-bottom: var(--space-md); }\n  .m-sec .section-rule { display: none; }\n\n  /* Streak chip in the Today header */\n  .today-chip {\n    display: inline-flex; align-items: center; gap: 7px; margin-left: 10px;\n    padding: 2px 9px; border-radius: 99px;\n    background: var(--brand-soft); color: var(--brand);\n    font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase;\n  }\n}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n\n<!-- ═══ API KEY SETUP SCREEN ═══ -->\n\n\n<div id=\"apiSetupScreen\" class=\"api-setup-screen\">\n  <div class=\"api-setup-box\">\n    <svg class=\"onboard-mark\" viewBox=\"0 0 32 32\" aria-hidden=\"true\">\n      <circle cx=\"16\" cy=\"16\" r=\"11\" fill=\"none\" stroke=\"var(--brand)\" stroke-width=\"1.6\"><\u002Fcircle>\n      <circle cx=\"16\" cy=\"16\" r=\"6\" fill=\"none\" stroke=\"var(--brand)\" stroke-width=\"1\" opacity=\"0.55\"><\u002Fcircle>\n      <line x1=\"16\" y1=\"4\" x2=\"16\" y2=\"28\" stroke=\"var(--brand)\" stroke-width=\"0.9\" opacity=\"0.4\"><\u002Fline>\n      <line x1=\"4\" y1=\"16\" x2=\"28\" y2=\"16\" stroke=\"var(--brand)\" stroke-width=\"0.9\" opacity=\"0.4\"><\u002Fline>\n      <path d=\"M12.5 26.4 h7\" stroke=\"var(--bg-surface)\" stroke-width=\"3\"><\u002Fpath>\n    <\u002Fsvg>\n    <span class=\"eyebrow\" style=\"text-align:center; display:block;\">Engineering Skills Hub<\u002Fspan>\n    <h2>Connect your AI coach<\u002Fh2>\n    <p>Everything in this hub works without a key. Add an Anthropic API key to also get the AI coach, study plans, and report grading. Create one at <strong>console.anthropic.com<\u002Fstrong>.<\u002Fp>\n    <input type=\"password\" id=\"apiKeyInput\" placeholder=\"sk-ant-…\" style=\"margin-bottom: var(--space-md); text-align: center;\">\n    <button class=\"btn btn-primary\" onclick=\"saveApiKey()\" style=\"width:100%;\">Connect<\u002Fbutton>\n    <p class=\"onboard-note\">Stored only in this browser's local storage, in plain text. Don't share this file while a key is saved.<\u002Fp>\n    <span class=\"skip-link\" onclick=\"skipApiSetup()\">Not now<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ═══ APP SHELL ═══ -->\n<div class=\"mobile-bar\">\n  <svg class=\"mb-mark\" viewBox=\"0 0 32 32\" aria-hidden=\"true\">\n    <circle cx=\"16\" cy=\"16\" r=\"11\" fill=\"none\" stroke=\"var(--brand)\" stroke-width=\"1.6\"><\u002Fcircle>\n    <circle cx=\"16\" cy=\"16\" r=\"6\" fill=\"none\" stroke=\"var(--brand)\" stroke-width=\"1\" opacity=\"0.55\"><\u002Fcircle>\n    <path d=\"M12.5 26.4 h7\" stroke=\"var(--bg-surface)\" stroke-width=\"3\"><\u002Fpath>\n  <\u002Fsvg>\n  <span class=\"mb-title\">Engineering Hub<\u002Fspan>\n  <span class=\"mb-module\" id=\"mbModule\">Dashboard<\u002Fspan>\n<\u002Fdiv>\n<nav class=\"bottom-nav\" id=\"bottomNav\" aria-label=\"Primary\"><\u002Fnav>\n<button class=\"filter-fab\" id=\"filterFab\" onclick=\"openFilterSheet()\" aria-label=\"Open filters\">\n  <svg class=\"icon\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M4 6h16M7 12h10M10 18h4\"><\u002Fpath><\u002Fsvg> Filters\n<\u002Fbutton>\n<div class=\"sheet-scrim\" id=\"sheetScrim\" onclick=\"closeSheets()\"><\u002Fdiv>\n<button class=\"sheet-done\" id=\"sheetDone\" onclick=\"closeSheets()\">Done<\u002Fbutton>\n<button class=\"log-fab\" id=\"logFab\" onclick=\"openLogSheet()\" aria-label=\"Log a session\">\n  <svg class=\"icon\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M12 5v14M5 12h14\"><\u002Fpath><\u002Fsvg> Log\n<\u002Fbutton>\n<div class=\"log-sheet\" id=\"logSheet\" role=\"dialog\" aria-label=\"Log a session\">\n  <div class=\"sheet-grip\"><\u002Fdiv>\n  <div class=\"sheet-title\">Log today's session<\u002Fdiv>\n  <div style=\"padding: 2px 18px calc(20px + env(safe-area-inset-bottom));\">\n    <label for=\"quickLogText\">What did you work on?<\u002Flabel>\n    <textarea id=\"quickLogText\" rows=\"3\" placeholder=\"e.g. Closed out the FMEA on the fixture, 90 min\"><\u002Ftextarea>\n    <div style=\"display:flex; gap:8px; margin-top:12px;\">\n      <button class=\"btn\" onclick=\"closeSheets()\" style=\"flex:1;\">Cancel<\u002Fbutton>\n      <button class=\"btn btn-primary\" onclick=\"quickLogSession()\" style=\"flex:2;\">Log session<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<div class=\"more-sheet\" id=\"moreSheet\" role=\"dialog\" aria-label=\"All modules\">\n  <div class=\"sheet-grip\"><\u002Fdiv>\n  <div class=\"sheet-title\">All modules<\u002Fdiv>\n  <div class=\"sheet-body\" id=\"moreSheetBody\"><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"sidebar-scrim\" id=\"sidebarScrim\" onclick=\"toggleSidebar(false)\"><\u002Fdiv>\n<div class=\"app-shell\">\n\n  <!-- ─── Sidebar ─── -->\n  <aside class=\"sidebar\">\n    <div class=\"sidebar-header\">\n      <div class=\"sidebar-brand\">\n        <svg class=\"brand-mark\" viewBox=\"0 0 32 32\" aria-hidden=\"true\">\n          <circle cx=\"16\" cy=\"16\" r=\"11\" fill=\"none\" stroke=\"var(--brand)\" stroke-width=\"1.6\"><\u002Fcircle>\n          <circle cx=\"16\" cy=\"16\" r=\"6\" fill=\"none\" stroke=\"var(--brand)\" stroke-width=\"1\" opacity=\"0.55\"><\u002Fcircle>\n          <line x1=\"16\" y1=\"4\" x2=\"16\" y2=\"28\" stroke=\"var(--brand)\" stroke-width=\"0.9\" opacity=\"0.4\"><\u002Fline>\n          <line x1=\"4\" y1=\"16\" x2=\"28\" y2=\"16\" stroke=\"var(--brand)\" stroke-width=\"0.9\" opacity=\"0.4\"><\u002Fline>\n          <path d=\"M12.5 26.4 h7\" stroke=\"var(--bg-surface)\" stroke-width=\"3\"><\u002Fpath>\n        <\u002Fsvg>\n        <h1>Engineering<br>Skills Hub<\u002Fh1>\n      <\u002Fdiv>\n      <div class=\"subtitle\">Manufacturing, process &amp; applications engineering · Lean Six Sigma + AI-augmented work<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"sidebar-section-label\">Modules<\u002Fdiv>\n    <nav class=\"sidebar-nav\">\n      <button class=\"nav-btn active\" data-tab=\"dashboard\">\n        <span class=\"nav-icon\"><svg class=\"icon\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"3\" y=\"3\" width=\"7\" height=\"7\" rx=\"1\"><\u002Frect><rect x=\"14\" y=\"3\" width=\"7\" height=\"7\" rx=\"1\"><\u002Frect><rect x=\"14\" y=\"14\" width=\"7\" height=\"7\" rx=\"1\"><\u002Frect><rect x=\"3\" y=\"14\" width=\"7\" height=\"7\" rx=\"1\"><\u002Frect><\u002Fsvg><\u002Fspan>\n        <span class=\"nav-label\">Dashboard<\u002Fspan>\n      <\u002Fbutton>\n      <button class=\"nav-btn\" data-tab=\"progress\">\n        <span class=\"nav-icon\"><svg class=\"icon\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M3 3v18h18\"><\u002Fpath><path d=\"M7 15l4-4 3 3 5-6\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n        <span class=\"nav-label\">Progress Tracker<\u002Fspan>\n      <\u002Fbutton>\n      <button class=\"nav-btn\" data-tab=\"projects\">\n        <span class=\"nav-icon\"><svg class=\"icon\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M21 16V8a2 2 0 0 0-1-1.7l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.7l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z\"><\u002Fpath><path d=\"M3.3 7 12 12l8.7-5M12 22V12\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n        <span class=\"nav-label\">Project Hub<\u002Fspan>\n      <\u002Fbutton>\n      <button class=\"nav-btn\" data-tab=\"portfolio\">\n        <span class=\"nav-icon\"><svg class=\"icon\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"3\" y=\"7\" width=\"18\" height=\"13\" rx=\"2\"><\u002Frect><path d=\"M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 12h18\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n        <span class=\"nav-label\">Portfolio Tracker<\u002Fspan>\n      <\u002Fbutton>\n      <button class=\"nav-btn\" data-tab=\"resources\">\n        <span class=\"nav-icon\"><svg class=\"icon\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M4 5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16H6a2 2 0 0 1-2-2z\"><\u002Fpath><path d=\"M18 3h1a1 1 0 0 1 1 1v17M8 7h6M8 11h6\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n        <span class=\"nav-label\">Resources Library<\u002Fspan>\n      <\u002Fbutton>\n      <button class=\"nav-btn\" data-tab=\"study\">\n        <span class=\"nav-icon\"><svg class=\"icon\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M12 7v5l3 2\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n        <span class=\"nav-label\">Study Sessions<\u002Fspan>\n      <\u002Fbutton>\n      <button class=\"nav-btn\" data-tab=\"ai-strategy\">\n        <span class=\"nav-icon\"><svg class=\"icon\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"7\" y=\"7\" width=\"10\" height=\"10\" rx=\"2\"><\u002Frect><path d=\"M9 3v2M12 3v2M15 3v2M9 19v2M12 19v2M15 19v2M3 9h2M3 12h2M3 15h2M19 9h2M19 12h2M19 15h2\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n        <span class=\"nav-label\">AI Strategy<\u002Fspan>\n      <\u002Fbutton>\n      <button class=\"nav-btn\" data-tab=\"schedule\">\n        <span class=\"nav-icon\"><svg class=\"icon\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"17\" rx=\"2\"><\u002Frect><path d=\"M3 9h18M8 2v4M16 2v4\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n        <span class=\"nav-label\">Schedule &amp; Planner<\u002Fspan>\n      <\u002Fbutton>\n      <button class=\
