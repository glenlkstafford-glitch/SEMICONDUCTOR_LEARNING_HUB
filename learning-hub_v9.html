\n\n// Example job targets used by the sample data only, a real first run starts empty.\nfunction getSeedApplications() {\n  var seed = [\n    { company: 'Regional contract manufacturer', role: 'Manufacturing Engineer', notes: 'LinkedIn posting' },\n    { company: 'Medical device manufacturer', role: 'Process Engineer', notes: 'Referral' },\n    { company: 'Automotive Tier-1 supplier', role: 'Quality / Process Engineer', notes: '' },\n    { company: 'Industrial equipment OEM', role: 'Applications Engineer', notes: '' },\n    { company: 'Consumer electronics assembler', role: 'Manufacturing Engineer', notes: '' },\n    { company: 'Food & beverage plant', role: 'Continuous Improvement Engineer', notes: '' },\n    { company: 'Aerospace components supplier', role: 'Process Engineer', notes: '' },\n    { company: 'Local machining job shop', role: 'Manufacturing Engineer', notes: 'Career-fair contact' }\n  ];\n  return seed.map(function(s, i) {\n    return { id: 'app_seed_' + (i + 1), company: s.company, role: s.role, link: '',\n      dateApplied: '', status: 'Saved', contact: '', nextFollowUp: '', notes: s.notes };\n  });\n}\n\n// Example STAR stubs used by the sample data only, a real first run starts empty.\nfunction getSeedStarStories() {\n  var seed = [\n    { title: 'Auto-detailing ownership story', situation: 'Ran a solo auto-detailing side operation, owned scheduling, pricing, quality, and customer follow-up end to end.' },\n    { title: 'Live DMAIC on a process-drift problem', situation: 'Asked in an interview to solve a hypothetical dimensional-drift problem on a production line, live.' },\n    { title: 'DOE that cut a stability test from months to days', situation: 'A long product-stability test was blocking a release timeline.' },\n    { title: 'Root cause on mislabeled process settings', situation: 'Qualification failures on a line were traced to mislabeled process settings.' }\n  ];\n  return seed.map(function(s, i) {\n    return { id: 'star_seed_' + (i + 1), title: s.title, situation: s.situation,\n      task: '', action: '', result: '', competencies: '', rolesFit: '' };\n  });\n}\n\n// Sample state, so a first-time visitor sees a populated hub rather than zeros.\n// Cleared in one click via startFresh(); never overwrites real saved data.\nfunction getSampleData() {\n  var d = getDefaultData();\n  d.demo = true;\n  d.currentWeek = 7;\n  d.profile = {\n    targetRole: 'Manufacturing / process engineer',\n    background: 'Mechanical engineering degree, two years as a manufacturing technician, comfortable with Excel and basic Python',\n    focus: 'Running DMAIC projects end to end, and building AI tools that automate my reporting'\n  };\n\n  HUB_DATA.phases.forEach(function (p) {\n    p.tracks.forEach(function (t, ti) {\n      t.tasks.forEach(function (_, ii) {\n        var key = 'p' + p.id + '_t' + ti + '_i' + ii;\n        if (p.id === 1) d.tasks[key] = true;\n        else if (p.id === 2 && ti === 0) d.tasks[key] = true;\n        else if (p.id === 2 && ti === 1 && ii < 2) d.tasks[key] = true;\n      });\n    });\n  });\n\n  // Spread the sample completions across the weeks each track actually runs,\n  // so the burn-up has a believable shape rather than a single vertical jump.\n  (function () {\n    var doneKeys = Object.keys(d.tasks);\n    HUB_DATA.phases.forEach(function (p) {\n      p.tracks.forEach(function (t, ti) {\n        var r = parseWeekRange(t.weeks);\n        t.tasks.forEach(function (_, ii) {\n          var key = 'p' + p.id + '_t' + ti + '_i' + ii;\n          if (!d.tasks[key]) return;\n          var span = Math.max(1, r.hi - r.lo);\n          var frac = t.tasks.length > 1 ? ii / (t.tasks.length - 1) : 0.5;\n          d.taskWeeks[key] = Math.min(d.currentWeek, Math.round(r.lo + span * frac));\n        });\n      });\n    });\n    void doneKeys;\n  })();\n\n  d.notes['p1_t0_note'] = 'pandas finally clicked once I rebuilt the control chart from a raw process CSV instead of following the tutorial dataset.';\n  d.notes['p2_t0_note'] = 'The FMEA felt complete until AI flagged two failure modes on the fixture I had not even considered.';\n\n  var byPhase = function (n) { return HUB_DATA.projects.filter(function (p) { return p.phase === n; }); };\n  var seed = function (proj, status, delivFrac, pubKeys, report) {\n    if (!proj || !proj.brief || !proj.brief.deliverables) return;\n    var pd = { status: status, deliverables: {}, publishChecklist: {}, report: report || {} };\n    var n = Math.round(proj.brief.deliverables.length * delivFrac);\n    proj.brief.deliverables.forEach(function (_, di) { if (di < n) pd.deliverables['d' + di] = true; });\n    (pubKeys || []).forEach(function (k) { pd.publishChecklist[k] = true; });\n    d.projects[proj.id] = pd;\n  };\n\n  var p1 = byPhase(1), p2 = byPhase(2);\n  seed(p1[0], 'Published', 1, ['github_readme', 'code_pushed', 'linkedin', 'portfolio', 'fmea_done'], {\n    background: 'A key dimension was being reviewed by eye in a spreadsheet, so drift was only caught after it had already produced scrap.',\n    problemStatement: 'No automated detection of out-of-control conditions; operators judged the charts visually with no Western Electric rule checks.',\n    results: 'Automated ingest of 14 weeks of data (~11,400 measurements). Cpk raised from 1.02 to 1.41 after the drift source was corrected. Rule-1 and rule-2 violations now flag within one measurement cycle instead of a shift.'\n  });\n  seed(p1[1], 'Ready to publish', 1, ['github_readme', 'code_pushed'], {\n    background: 'The current-state process had never been mapped; every operator described it differently.',\n    problemStatement: 'Without a shared process map, the waste and rework loops stayed invisible and improvement ideas kept missing the real bottleneck.'\n  });\n  seed(p1[2], 'Report drafted', 0.7, ['code_pushed'], {\n    background: 'Capability was being quoted in meetings without showing the math, and the numbers did not always agree.'\n  });\n  seed(p2[0], 'In progress', 0.4, []);\n  seed(p2[1], 'In progress', 0.2, []);\n\n  d.careerChecklist = { gb_enrolled: true, gb_coursework: true, resume: true, module_chosen: true };\n\n  d.applications = getSeedApplications();\n  d.starStories = getSeedStarStories();\n\n  var appStates = [\n    { status: 'Interview', dateApplied: '2026-02-09', nextFollowUp: '2026-03-02', contact: 'Recruiter, first screen done' },\n    { status: 'Screen', dateApplied: '2026-02-17', nextFollowUp: '2026-02-28', contact: 'Hiring manager intro scheduled' },\n    { status: 'Applied', dateApplied: '2026-02-21', nextFollowUp: '2026-03-06', contact: '' },\n    { status: 'Applied', dateApplied: '2026-02-24', nextFollowUp: '', contact: '' }\n  ];\n  d.applications.forEach(function (a, i) {\n    if (appStates[i]) { a.status = appStates[i].status; a.dateApplied = appStates[i].dateApplied;\n      a.nextFollowUp = appStates[i].nextFollowUp; a.contact = appStates[i].contact; }\n  });\n\n  if (d.starStories[0]) {\n    d.starStories[0].task = 'Keep a one-person operation profitable while holding quality high enough to run entirely on referrals.';\n    d.starStories[0].action = 'Standardised a five-step process sheet, priced by vehicle condition rather than size, and followed up 48 hours after every job.';\n    d.starStories[0].result = 'Repeat-customer rate above 60% across two seasons with no paid advertising.';\n    d.starStories[0].competencies = 'Ownership, process discipline, customer communication';\n  }\n\n  // Sample session log: a believable 9 weeks of showing up, with gaps.\n  var logTexts = [\n    'Rebuilt the control chart from a raw process CSV, caught my own off-by-one on the subgroup size.',\n    'Mapped the current state end to end; found two rework loops I had missed.',\n    'Wrote the FMEA table for the process, 11 failure modes.',\n    'Cleaned a messy export with the AI template; validation caught 3 bad rows.',\n    'Read up on Western Electric rules, added rule 2 and rule 5 detection.',\n    'Cpk maths le.display = 'none';\n}\n\n// Explicit way back to the sample state.\nfunction loadSampleData() {\n  openModal('Load sample data',\n    '<p style=\"color:var(--text-secondary); line-height:1.7;\">This replaces what is currently in this browser with a filled-in example, week 7, Phase 1 complete and Phase 2 underway, five projects in flight, several weeks of session history. Export a backup first if you want to keep your own progress.<\u002Fp>',\n    '<button class=\"btn\" onclick=\"closeModal()\">Cancel<\u002Fbutton><button class=\"btn btn-primary\" onclick=\"confirmLoadSample()\">Load sample<\u002Fbutton>');\n}\n\nfunction confirmLoadSample() {\n  window._appData = getSampleData();\n  saveData(window._appData);\n  closeModal();\n  var b = document.getElementById('demoBanner');\n  if (b) b.style.display = 'flex';\n  _waferAnimated = false;\n  renderAll();\n  showToast('Sample data loaded', 'success');\n}\n\nfunction startFresh() {\n  openModal('Start fresh',\n    '<p style=\"color:var(--text-secondary); line-height:1.7;\">This clears the sample data and gives you an empty hub: week 1, nothing checked off. Your own progress is saved in this browser from then on.<\u002Fp>',\n    '<button class=\"btn\" onclick=\"closeModal()\">Keep sample<\u002Fbutton><button class=\"btn btn-primary\" onclick=\"confirmStartFresh()\">Start fresh<\u002Fbutton>');\n}\n\nfunction confirmStartFresh() {\n  window._appData = getDefaultData();\n  saveData(window._appData);\n  closeModal();\n  var b = document.getElementById('demoBanner');\n  if (b) b.style.display = 'none';\n  _waferAnimated = false;\n  renderAll();\n  showToast('Clean slate: start with week 1 in Progress Tracker', 'success', 3200);\n}\n\n// Invalidate every tab and rebuild whichever one is on screen.\nfunction renderAll() {\n  _renderedTabs = {};\n  updateSidebarProgress();\n  var active = document.querySelector('.tab-panel.active');\n  ensureTab(active ? active.id.replace('tab-', '') : 'dashboard');\n  observeReveals();\n}\n\n// ─── localStorage Helpers ───\nfunction loadData() {\n  try {\n    const raw = localStorage.getItem(STORAGE_KEY);\n    if (!raw) return getSampleData();\n    // A stored-but-untouched dataset (e.g. saved by a first render before any\n    // work was done) should still show the sample rather than an empty shell.\n    try {\n      var probe = JSON.parse(raw);\n      var untouched = probe && !probe.demo && !probe.introDismissed &&\n        Object.keys(probe.tasks || {}).length === 0 &&\n        (probe.sessionLog || []).length === 0 &&\n        !Object.keys(probe.projects || {}).some(function (k) {\n          var pj = probe.projects[k] || {};\n          return (pj.status && pj.status !== 'Not started') ||\n            Object.keys(pj.deliverables || {}).length ||\n            Object.keys(pj.report || {}).some(function (rk) { return (pj.report[rk] || '').trim(); });\n        });\n      if (untouched) return getSampleData();\n    } catch (e) { /* fall through to the normal merge */ }\n    const parsed = JSON.parse(raw);\n    // Merge with defaults so new fields are always present\n    const defaults = getDefaultData();\n    return { ...defaults, ...parsed };\n  } catch (e) {\n    console.error('Failed to load data:', e);\n    return getSampleData();\n  }\n}\n\nfunction saveData(data) {\n  try {\n    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));\n  } catch (e) {\n    console.error('Failed to save data:', e);\n    showToast('Save failed: storage may be full', 'error');\n  }\n}\n\nfunction getData() {\n  if (!window._appData) window._appData = loadData();\n  return window._appData;\n}\n\nfunction updateData(updater) {\n  const data = getData();\n  updater(data);\n  saveData(data);\n}\n\n// ─── Backup: Export / Import ───\nfunction exportBackup() {\n  // Stamp the backup time so the load-time safeguard can tell how stale we are.\n  updateData(function(d) { d.lastBackup = new Date().toISOString(); });\n  var backup = {\n    app: 'autoeng_hub',\n    version: 3,\n    exportedAt: new Date().toISOString(),\n    // API key is bundled so ONE backup file restores everything on a new\n    // machine (flash-drive portability). Plaintext, keep the file private.\n    apiKey: getApiKey(),\n    data: getData()\n  };\n  var blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });\n  var url = URL.createObjectURL(blob);\n  var a = document.createElement('a');\n  var stamp = new Date().toISOString().slice(0, 10);\n  a.href = url;\n  a.download = 'autoeng_backup_' + stamp + '.json';\n  document.body.appendChild(a);\n  a.click();\n  a.remove();\n  URL.revokeObjectURL(url);\n  showToast('Backup exported (includes your API key), save it to your /saves folder', 'success', 3500);\n}\n\nfunction importBackup(inputEl) {\n  var file = inputEl.files && inputEl.files[0];\n  if (!file) return;\n  var reader = new FileReader();\n  reader.onload = function(e) {\n    try {\n      var parsed = JSON.parse(e.target.result);\n      // Accept either the wrapped backup format or a raw data object\n      var incoming = (parsed && parsed.app === 'autoeng_hub' && parsed.data) ? parsed.data : parsed;\n      // Sanity check: must look like our data schema\n      if (!incoming || typeof incoming !== 'object' || (!incoming.tasks && !incoming.currentWeek && !incoming.sessionLog)) {\n        showToast('That file doesn\\'t look like a valid backup', 'error');\n        return;\n      }\n      if (!confirm('Import this backup? It will REPLACE all progress on this device.\\n\\nTip: Export your current data first if you want to keep it.')) {\n        return;\n      }\n      // Merge onto defaults so any missing fields are filled in\n      var merged = Object.assign(getDefaultData(), incoming);\n      window._appData = merged;\n      saveData(merged);\n      // Restore a bundled API key so importing on a new machine is one step.\n      if (parsed && typeof parsed.apiKey === 'string' && parsed.apiKey) {\n        localStorage.setItem(API_KEY_KEY, parsed.apiKey);\n      }\n      showToast('Backup imported: reloading...', 'success');\n      setTimeout(function() { location.reload(); }, 800);\n    } catch (err) {\n      console.error('Import failed:', err);\n      showToast('Import failed: file is not valid JSON', 'error');\n    }\n  };\n  reader.readAsText(file);\n  // Reset so choosing the same file again still triggers onchange\n  inputEl.value = '';\n}\n\n// ─── API Key ───\nfunction getApiKey() {\n  return localStorage.getItem(API_KEY_KEY) || '';\n}\n\nfunction hasApiKey() {\n  return !!getApiKey();\n}\n\nfunction saveApiKey() {\n  const key = document.getElementById('apiKeyInput').value.trim();\n  if (!key) {\n    showToast('Please enter an API key', 'error');\n    return;\n  }\n  localStorage.setItem(API_KEY_KEY, key);\n  updateData(d => { d.settings.apiKeySet = true; });\n  document.getElementById('apiSetupScreen').classList.remove('open');\n  refreshAiStatus();\n  showToast('AI coach connected', 'success');\n}\n\nfunction skipApiSetup() {\n  document.getElementById('apiSetupScreen').classList.remove('open');\n}\n\n// Open the key panel on demand (sidebar button, or the first time an AI action runs).\nfunction openApiSetup() {\n  var el = document.getElementById('apiSetupScreen');\n  if (!el) return;\n  var input = document.getElementById('apiKeyInput');\n  if (input) input.value = getApiKey();\n  el.classList.add('open');\n}\n\nfunction refreshAiStatus() {\n  var btn = document.getElementById('aiStatusBtn');\n  var label = document.getElementById('aiStatusLabel');\n  if (!btn || !label) return;\n  var on = hasApiKey();\n  btn.classList.toggle('on', on);\n  label.textContent = on ? 'AI coach: connected' : 'AI coach: connect';\n  btn.title = on ? 'Anthropic key saved in this browser' : 'Add an Anthropic API key to enable AI features';\n}\n\n// ─── Anthropic API Call ───\nasync function callAI(userMessage, opts = {}) {\n  const apiKey = getApiKey();\n  if (!apiKey) {\n    closeModal();\n    openApiSetup();\n    return null;\n  }\n\n  const sysPrompt = opts.systemPrompt || systemPrompt();\n  const maxTokens = opts.maxTokens || API_MAX_TOKENS;\n\n  try {\n    const res = await fetch(API_URL, {\n      method: 'POST',\n      headers: {\n        'Content-Type': 'application/json',\n        'x-api-key': apiKey,\n        'anthropic-version': '2023-06-01',\n        'anthropic-dangerous-direct-browser-access': 'true'\n      },\n      body: JSON.stringify({\n        model: API_MODEL,\n        max_tokens: maxTokens,\n        system: sysPrompt,\n        messages: [{ role: 'user', content: userMessage }]\n      })\n    });\n\n    if (!res.ok) {\n      const err = await res.json().catch(() => ({}));\n      const msg = err?.error?.message || `API error ${res.status}`;\n      showToast(msg, 'error');\n      return null;\n    }\n\n    const json = await res.json();\n    return json.content?.[0]?.text || '';\n  } catch (e) {\n    console.error('API call failed:', e);\n    showToast('Network error: check connection', 'error');\n    return null;\n  }\n}\n\n// ─── Toast Notifications ───\nfunction showToast(message, type = 'info', duration = 2000) {\n  const container = document.getElementById('toastContainer');\n  const toast = document.createElement('div');\n  toast.className = `toast toast-${type}`;\n  toast.textContent = message;\n  container.appendChild(toast);\n  setTimeout(() => {\n    toast.classList.add('toast-out');\n    setTimeout(() => toast.remove(), 250);\n  }, duration);\n}\n\n// Warn on load if the last exported backup is missing or more than 7 days old.\nfunction checkBackupFreshness() {\n  var data = getData();\n  // Nothing logged yet: no point nagging a first-time visitor about backups.\n  if (Object.keys(data.tasks || {}).length === 0 && (data.sessionLog || []).length === 0) return;\n  var last = data.lastBackup ? new Date(data.lastBackup) : null;\n  var ageDays = last ? Math.floor((Date.now() - last.getTime()) / 86400000) : null;\n  if (ageDays === null) {\n    showToast('Last backup: never: export a backup', 'warning', 6000);\n  } else if (ageDays >= 7) {\n    showToast('Last backup: ' + ageDays + ' days ago, export a backup', 'warning', 6000);\n  }\n}\n\n// ─── Reusable Modal ───\nfunction openModal(title, bodyHTML, footerHTML = '') {\n  document.getElementById('modalTitle').textContent = title;\n  document.getElementById('modalBody').innerHTML = bodyHTML;\n  document.getElementById('modalFooter').innerHTML = footerHTML;\n  document.getElementById('modalOverlay').classList.add('open');\n}\n\nfunction closeModal() {\n  document.getElementById('modalOverlay').classList.remove('open');\n}\n\n// Close modal on overlay click\ndocument.getElementById('modalOverlay').addEventListener('click', function(e) {\n  if (e.target === this) closeModal();\n});\n\n// Close modal on Escape\ndocument.addEventListener('keydown', function(e) {\n  if (e.key === 'Escape') closeModal();\n});\n\n// ─── Lazy tab rendering ───\n// Only the visible tab is built. Ten tabs' worth of forms in the DOM at once\n// made first paint slow for content nobody had asked to see yet.\nvar _renderedTabs = {};\nfunction tabRenderers() {\n  return {\n    dashboard: renderDashboard,\n    progress: renderProgressTracker,\n    projects: renderProjectHub,\n    portfolio: renderPortfolioTracker,\n    resources: renderResourcesLibrary,\n    study: renderStudySessionLauncher,\n    'ai-strategy': renderAiStrategy,\n    schedule: renderSchedule,\n    applications: renderApplications,\n    materials: renderMaterials\n  };\n}\nfunction ensureTab(tabId) {\n  if (_renderedTabs[tabId]) return;\n  var fn = tabRenderers()[tabId];\n  if (!fn) return;\n  fn();\n  _renderedTabs[tabId] = true;\n  observeReveals();\n}\n\n// ─── Mobile drawer ───\nfunction toggleSidebar(force) {\n  var sb = document.querySelector('.sidebar');\n  var scrim = document.getElementById('sidebarScrim');\n  if (!sb) return;\n  var open = typeof force === 'boolean' ? force : !sb.classList.contains('open');\n  sb.classList.toggle('open', open);\n  if (scrim) scrim.classList.toggle('open', open);\n}\n\n// ─── Tab Navigation ───\nfunction switchTab(tabId) {\n  toggleSidebar(false);\n  // Update nav buttons\n  document.querySelectorAll('.nav-btn').forEach(btn => {\n    btn.classList.toggle('active', btn.dataset.tab === tabId);\n  });\n  // Update tab panels\n  document.querySelectorAll('.tab-panel').forEach(panel => {\n    panel.classList.toggle('active', panel.id === `tab-${tabId}`);\n  });\n  ensureTab(tabId);\n  // The Study Launcher always re-renders so it picks up the current week\n  // set anywhere else in the app (e.g. the Schedule tab).\n  if (tabId === 'study') renderStudySessionLauncher();\n  // Reset the content scroll and re-arm scroll-reveal for the newly shown panel.\n  var main = document.querySelector('.main-content');\n  if (main) main.scrollTop = 0;\n  updateScrollProgress();\n  observeReveals();\n}\n\ndocument.querySelectorAll('.nav-btn').forEach(btn => {\n  btn.addEventListener('click', () => switchTab(btn.dataset.tab));\n});\n\n// Collapsible headers are divs: make them keyboard-operable.\ndocument.addEventListener('keydown', function (e) {\n  var t = e.target;\n  if (!t || !t.classList || !t.classList.contains('collapsible-header')) return;\n  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); t.click(); }\n});\n\n// ─── Scroll-reveal + scroll-progress (gated behind reduced-motion via CSS) ───\nvar _revealObserver = null;\nfunction observeReveals() {\n  if (!('IntersectionObserver' in window)) {\n    document.querySelectorAll('.reveal').forEach(function (el) { el.classList.add('in'); });\n    return;\n  }\n  var root = document.querySelector('.main-content');\n  if (!_revealObserver) {\n    _revealObserver = new IntersectionObserver(function (entries) {\n      entries.forEach(function (e) {\n        if (e.isIntersecting) { e.target.classList.add('in'); _revealObserver.unobserve(e.target); }\n      });\n    }, { root: root, rootMargin: '0px 0px -8% 0px', threshold: 0.05 });\n  }\n  // Observe reveal elements in the currently active panel that aren't shown yet.\n  var panel = document.querySelector('.tab-panel.active');\n  if (!panel) return;\n  panel.querySelectorAll('.reveal:not(.in)').forEach(function (el) { _revealObserver.observe(el); });\n}\n\nfunction updateScrollProgress() {\n  var bar = document.getElementById('scrollProgress');\n  var main = document.querySelector('.main-content');\n  if (!bar || !main) return;\n  var max = main.scrollHeight - main.clientHeight;\n  var pct = max > 0 ? (main.scrollTop / max) * 100 : 0;\n  bar.style.width = pct.toFixed(1) + '%';\n}\n\n// ─── Sidebar Progress Update: see updateSidebarProgress() (HUB_DATA-aware) below ───\n\n// ─── Clipboard Helper ───\nasync function copyToClipboard(text) {\n  try {\n    await navigator.clipboard.writeText(text);\n    showToast('Copied to clipboard', 'success');\n  } catch {\n    // Fallback\n    const ta = document.createElement('textarea');\n    ta.value = text;\n    ta.style.position = 'fixed';\n    ta.style.opacity = '0';\n    document.body.appendChild(ta);\n    ta.select();\n    document.execCommand('copy');\n    ta.remove();\n    showToast('Copied to clipboard', 'success');\n  }\n}\n\n// ═══════════════════════════════════════════════════════\n//  TAB 1: HOME DASHBOARD\n// ═══════════════════════════════════════════════════════\n\n// Weeks and phase boundaries are derived from phase.weeks ranges,\n// so adding a phase (e.g. Phase 5/6) needs no changes here.\nfunction parseWeekRange(str) {\n  const m = String(str).match(/(\\d+)\\D+(\\d+)/);\n  return m ? { lo: +m[1], hi: +m[2] } : { lo: 1, hi: 1 };\n}\nconst TOTAL_WEEKS = HUB_DATA.phases.reduce((mx, p) => Math.max(mx, parseWeekRange(p.weeks).hi), 0) || 16;\nfunction phaseIdForWeek(week) {\n  for (let i = 0; i < HUB_DATA.phases.length; i++) {\n    if (week <= parseWeekRange(HUB_DATA.phases[i].weeks).hi) return HUB_DATA.phases[i].id;\n  }\n  return HUB_DATA.phases[HUB_DATA.phases.length - 1].id;\n}\n\nfunction getTotalTasks() {\n  let count = 0;\n  HUB_DATA.phases.forEach(phase => {\n    phase.tracks.forEach(track => { count += track.tasks.length; });\n  });\n  return count;\n}\n\nfunction getDoneTasks() {\n  const data = getData();\n  let count = 0;\n  HUB_DATA.phases.forEach((phase, pi) => {\n    phase.tracks.forEach((track, ti) => {\n      track.tasks.forEach((_, ii) => {\n        if (data.tasks[`p${phase.id}_t${ti}_i${ii}`]) count++;\n      });\n    });\n  });\n  return count;\n}\n\nfunction getProjectsBuilt() {\n  const data = getData();\n  let count = 0;\n  HUB_DATA.projects.forEach(proj => {\n    const ps = data.projects[proj.id];\n    if (ps && (ps.status === 'complete' || ps.status === 'Report drafted' || ps.status === 'Ready to publish' || ps.status === 'Published')) count++;\n  });\n  return count;\n}\n\nfunction getCurrentPhase() {\n  const data = getData();\n  return phaseIdForWeek(data.currentWeek || 1);\n}\n\nfunction getNextTask() {\n  const data = getData();\n  for (let pi = 0; pi < HUB_DATA.phases.length; pi++) {\n    const phase = HUB_DATA.phases[pi];\n    for (let ti = 0; ti < phase.tracks.length; ti++) {\n      const track = phase.tracks[ti];\n      for (let ii = 0; ii < track.tasks.length; ii++) {\n        const key = `p${phase.id}_t${ti}_i${ii}`;\n        if (!data.tasks[key]) {\n          return { key: key, task: track.tasks[ii], track: track.name, phase: phase.name, weeks: track.weeks };\n        }\n      }\n    }\n  }\n  return null;\n}\n\n// Wafer-map yield display: dies inside a circle, filled centre-out (edge die\n// loss mirrors real fabs). Derived purely from task-completion counts.\nlet _waferAnimated = false;\nfunction renderWaferMap(done, total, animate) {\n  const el = document.getElementById('waferMap');\n  if (!el) return;\n  const N = 11, size = 240, gap = 3;\n  const cell = (size - gap * (N + 1)) / N;\n  const cx = size / 2, cy = size / 2, R = size / 2 - 2;\n  const cells = [];\n  for (let r = 0; r < N; r++) {\n    for (let c = 0; c < N; c++) {\n      const x = gap + c * (cell + gap), y = gap + r * (cell + gap);\n      const ccx = x + cell / 2, ccy = y + cell / 2;\n      const dist = Math.hypot(ccx - cx, ccy - cy);\n      if (dist <= R - 3) cells.push({ x, y, dist });\n    }\n  }\n  const D = cells.length;\n  const filled = total > 0 ? Math.round(D * done / total) : 0;\n  // Mark the `filled` dies nearest the centre as complete.\n  const onSet = new Set(cells.slice().sort((a, b) => a.dist - b.dist).slice(0, filled));\n  let dies = '';\n  cells.forEach((p, i) => {\n    const on = onSet.has(p);\n    const color = on ? 'var(--state-run)' : 'var(--state-idle)';\n    const op = on ? '1' : '0.25';\n    const delay = animate ? (i * 5) + 'ms' : '0ms';\n    dies += '<rect class=\"wafer-die\" x=\"' + p.x.toFixed(1) + '\" y=\"' + p.y.toFixed(1) +\n      '\" width=\"' + cell.toFixed(1) + '\" height=\"' + cell.toFixed(1) + '\" rx=\"1.5\" fill=\"' +\n      color + '\" opacity=\"' + op + '\" style=\"animation-delay:' + delay + '\"/>';\n  });\n  el.innerHTML =\n    '<svg class=\"wafer-svg ' + (animate ? 'wafer-anim' : '') + '\" viewBox=\"0 0 ' + size + ' ' + size +\n    '\" role=\"img\" aria-label=\"Progress map: ' + done + ' of ' + total + ' tasks complete\">' +\n    '<circle cx=\"' + cx + '\" cy=\"' + cy + '\" r=\"' + R + '\" fill=\"none\" stroke=\"var(--border-light)\" stroke-width=\"1.5\"/>' +\n    '<circle cx=\"' + cx + '\" cy=\"' + cy + '\" r=\"' + (R - 6) + '\" fill=\"none\" stroke=\"var(--border)\" stroke-width=\"1\" opacity=\"0.6\"/>' +\n    dies + '<\u002Fsvg>';\n  const info = document.getElementById('waferDieInfo');\n  if (info) info.textContent = filled + ' / ' + D + ' tasks';\n}\n\nfunction renderDashboard() {\n  const total = getTotalTasks();\n  const done = getDoneTasks();\n  const pct = total > 0 ? Math.round((done / total) * 100) : 0;\n  const phase = getCurrentPhase();\n\n  renderWaferMap(done, total, !_waferAnimated);\n  _waferAnimated = true;\n\n  document.getElementById('dashProgressPct').textContent = pct + '%';\n  document.getElementById('dashProgressBar').style.width = pct + '%';\n  document.getElementById('dashStatPct').textContent = pct + '%';\n  document.getElementById('dashStatTasks').textContent = done + '/' + total;\n  document.getElementById('dashStatProjects').textContent = getProjectsBuilt();\n  document.getElementById('dashStatPhase').textContent = 'P' + phase;\n\n  // Up Next\n  const next = getNextTask();\n  const upNextEl = document.getElementById('dashUpNext');\n  if (next) {\n    var nextPhase = HUB_DATA.phases.find(function (p) { return p.name === next.phase; });\n    upNextEl.innerHTML = next.task +\n      '<div class=\"upnext-meta\"><span>' + next.track + '<\u002Fspan><span>Phase ' + (nextPhase ? nextPhase.id : phaseIdForWeek(getData().currentWeek || 1)) + '<\u002Fspan><span>Weeks ' + next.weeks + '<\u002Fspan><\u002Fdiv>';\n  } else {\n    upNextEl.innerHTML = 'Curriculum complete.<div class=\"upnext-meta\"><span>Every task closed out<\u002Fspan><\u002Fdiv>';\n  }\n\n  // Motivational tip (rotate based on time)\n  const tips = [\n    ...HUB_DATA.aiRules,\n    'Use AI to go deeper faster, document better, and ship more, not to skip the learning.',\n    'A 10x multiplier on zero is still zero. Build real skills first.',\n    'Every capstone project is a portfolio piece. Treat it like a job deliverable.',\n    'Consistency beats intensity. Show up every day, even if only for one hour.'\n  ];\n  const tipIdx = Math.floor(Date.now() / 60000) % tips.length;\n  document.getElementById('dashTip').textContent = tips[tipIdx];\n\n  renderCareerChecklist();\n  renderPhaseLadder();\n  renderWeekCard();\n  renderBurnup();\n  renderConsistency();\n  renderProfile();\n  maybeShowIntro();\n}\n\n// Planned cumulative task count by week: each track's tasks are spread evenly\n// across the weeks that track is scheduled for.\nvar _plannedCache = null;\nfunction plannedByWeek() {\n  if (_plannedCache) return _plannedCache;\n  var arr = new Array(TOTAL_WEEKS + 1).fill(0);\n  HUB_DATA.phases.forEach(function (p) {\n    p.tracks.forEach(function (t) {\n      var r = parseWeekRange(t.weeks);\n      var span = Math.max(1, r.hi - r.lo);\n      t.tasks.forEach(function (_, ii) {\n        var frac = t.tasks.length > 1 ? ii / (t.tasks.length - 1) : 1;\n        var w = Math.min(TOTAL_WEEKS, Math.max(1, Math.round(r.lo + span * frac)));\n        arr[w]++;\n      });\n    });\n  });\n  for (var i = 1; i <= TOTAL_WEEKS; i++) arr[i] += arr[i - 1];\n  _plannedCache = arr;\n  return arr;\n}\n\nfunction actualByWeek() {\n  var tw = getData().taskWeeks || {};\n  var arr = new Array(TOTAL_WEEKS + 1).fill(0);\n  Object.keys(tw).forEach(function (k) {\n    var w = Math.min(TOTAL_WEEKS, Math.max(1, tw[k] | 0));\n    arr[w]++;\n  });\n  for (var i = 1; i <= TOTAL_WEEKS; i++) arr[i] += arr[i - 1];\n  return arr;\n}\n\n// Planned vs actual completion. The one chart that answers \"am I on pace?\".\nfunction renderBurnup() {\n  var host = document.getElementById('dashBurnup');\n  if (!host) return;\n  var d = getData();\n  var week = Math.min(TOTAL_WEEKS, Math.max(1, d.currentWeek || 1));\n  var planned = plannedByWeek(), actual = actualByWeek();\n  var total = getTotalTasks();\n  var W = 760, H = 220, L = 44, Rr = 12, T = 14, B = 30;\n  var x = function (w) { return L + (w - 1) / (TOTAL_WEEKS - 1) * (W - L - Rr); };\n  var y = function (v) { return T + (1 - v / Math.max(1, total)) * (H - T - B); };\n\n  var pPath = '', aPath = '';\n  for (var w = 1; w <= TOTAL_WEEKS; w++) pPath += (w === 1 ? 'M' : 'L') + x(w).toFixed(1) + ' ' + y(planned[w]).toFixed(1) + ' ';\n  for (var w2 = 1; w2 <= week; w2++) aPath += (w2 === 1 ? 'M' : 'L') + x(w2).toFixed(1) + ' ' + y(actual[w2]).toFixed(1) + ' ';\n  var aFill = aPath + 'L' + x(week).toFixed(1) + ' ' + y(0).toFixed(1) + ' L' + x(1).toFixed(1) + ' ' + y(0).toFixed(1) + ' Z';\n\n  var grid = '';\n  [0, 0.25, 0.5, 0.75, 1].forEach(function (fr) {\n    var v = Math.round(total * fr), yy = y(v).toFixed(1);\n    grid += '<line x1=\"' + L + '\" y1=\"' + yy + '\" x2=\"' + (W - Rr) + '\" y2=\"' + yy + '\" stroke=\"var(--border)\" stroke-width=\"1\"/>';\n    grid += '<text x=\"' + (L - 8) + '\" y=\"' + (parseFloat(yy) + 3.5) + '\" text-anchor=\"end\" font-family=\"var(--font-mono)\" font-size=\"9\" fill=\"var(--text-muted)\">' + v + '<\u002Ftext>';\n  });\n  var ticks = '';\n  HUB_DATA.phases.forEach(function (p) {\n    var r = parseWeekRange(p.weeks);\n    var xx = x(r.hi).toFixed(1);\n    ticks += '<line x1=\"' + xx + '\" y1=\"' + T + '\" x2=\"' + xx + '\" y2=\"' + (H - B) + '\" stroke=\"var(--border)\" stroke-width=\"1\" stroke-dasharray=\"2 4\"/>';\n    ticks += '<text x=\"' + xx + '\" y=\"' + (H - B + 15) + '\" text-anchor=\"middle\" font-family=\"var(--font-mono)\" font-size=\"9\" fill=\"var(--text-muted)\">wk ' + r.hi + '<\u002Ftext>';\n  });\n\n  var nowX = x(week).toFixed(1);\n  var delta = actual[week] - planned[week];\n  var cls = delta > 1 ? 'ahead' : delta < -1 ? 'behind' : 'on';\n  var label = delta > 1 ? delta + ' tasks ahead of plan' : delta < -1 ? Math.abs(delta) + ' tasks behind plan' : 'on plan';\n\n  host.innerHTML =\n    '<div style=\"display:flex; align-items:baseline; justify-content:space-between; gap:var(--space-md); flex-wrap:wrap; margin-bottom:var(--space-md);\">' +\n      '<span class=\"eyebrow\" style=\"margin:0;\">Week ' + week + '<\u002Fspan>' +\n      '<span class=\"pace ' + cls + '\">' + label + '<\u002Fspan>' +\n    '<\u002Fdiv>' +\n    '<svg class=\"burnup\" viewBox=\"0 0 ' + W + ' ' + H + '\" role=\"img\" aria-label=\"Planned versus actual task completion by week\">' +\n      '<defs><linearGradient id=\"buFill\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\">' +\n        '<stop offset=\"0%\" stop-color=\"rgba(232,163,61,0.28)\"/><stop offset=\"100%\" stop-color=\"rgba(232,163,61,0)\"/>' +\n      '<\u002FlinearGradient><\u002Fdefs>' +\n      grid + ticks +\n      '<path d=\"' + aFill + '\" fill=\"url(#buFill)\"/>' +\n      '<path d=\"' + pPath + '\" fill=\"none\" stroke=\"var(--text-muted)\" stroke-width=\"1.5\" stroke-dasharray=\"5 5\"/>' +\n      '<path d=\"' + aPath + '\" fill=\"none\" stroke=\"var(--brand)\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/>' +\n      '<line x1=\"' + nowX + '\" y1=\"' + T + '\" x2=\"' + nowX + '\" y2=\"' + (H - B) + '\" stroke=\"var(--brand)\" stroke-width=\"1\" opacity=\"0.45\"/>' +\n      '<circle cx=\"' + nowX + '\" cy=\"' + y(actual[week]).toFixed(1) + '\" r=\"4\" fill=\"var(--brand)\"/>' +\n    '<\u002Fsvg>' +\n    '<div class=\"burnup-legend\">' +\n      '<span><i style=\"background:var(--brand);\"><\u002Fi>Actual<\u002Fspan>' +\n      '<span><i style=\"background:var(--text-muted);\"><\u002Fi>Planned<\u002Fspan>' +\n      '<span>' + actual[week] + ' of ' + total + ' tasks<\u002Fspan>' +\n    '<\u002Fdiv>' +\n    (actual[week] === 0 ? '<div class=\"hint\">Nothing logged yet, tick tasks in Progress Tracker and this curve starts drawing itself.<\u002Fdiv>' : '');\n}\n\n// This week: the focus topic, the tasks that belong to this week's tracks,\n// and how many of them are closed out.\nfunction renderWeekCard() {\n  var host = document.getElementById('dashWeekCard');\n  if (!host) return;\n  var d = getData();\n  var week = Math.min(TOTAL_WEEKS, Math.max(1, d.currentWeek || 1));\n  var wd = HUB_DATA.weeklyPlan[week - 1];\n  var focus = wd ? wd.focus : 'General review';\n  var trackNames = wd ? wd.tracks : [];\n\n  var rows = [], done = 0;\n  HUB_DATA.phases.forEach(function (p) {\n    p.tracks.forEach(function (t, ti) {\n      if (trackNames.indexOf(t.name) === -1) return;\n      t.tasks.forEach(function (task, ii) {\n        var key = 'p' + p.id + '_t' + ti + '_i' + ii;\n        var on = !!d.tasks[key];\n        if (on) done++;\n        rows.push('<div class=\"checkbox-row\">' +\n          '<input type=\"checkbox\" ' + (on ? 'checked' : '') + ' onchange=\"toggleTask(\\'' + key + '\\', this.checked)\">' +\n          '<span style=\"font-size:13 ById('dashPhaseLadder');\n  if (!el) return;\n  var cur = getCurrentPhase();\n  var html = '';\n  HUB_DATA.phases.forEach(function (p) {\n    var pct = getPhaseProgress(p);\n    var c = 'var(--phase-' + p.id + ')';\n    html += '<div class=\"phase-row' + (p.id === cur ? ' is-current' : '') + '\">' +\n      '<span class=\"phase-idx\" style=\"color:' + (p.id === cur ? c : '') + '\">P' + p.id + '<\u002Fspan>' +\n      '<span class=\"phase-name\">' + p.name + '<\u002Fspan>' +\n      '<span class=\"phase-weeks\">Wk ' + p.weeks + '<\u002Fspan>' +\n      '<span class=\"track-bar\"><span class=\"track-bar-fill\" style=\"display:block; width:' + pct + '%; background:' + c + '; color:' + c + ';\"><\u002Fspan><\u002Fspan>' +\n      '<span class=\"phase-pct\">' + pct + '%<\u002Fspan>' +\n    '<\u002Fdiv>';\n  });\n  el.innerHTML = html;\n}\n\nfunction copyQuizPrompt() {\n  const next = getNextTask();\n  const taskName = next ? next.task : 'the last task I completed';\n  const trackName = next ? next.track : 'my current track';\n  const prompt = `I just completed \"${taskName}\" in ${trackName}. Generate a 6-question quiz: 2 pure recall questions, 2 application questions where I have to apply the concept to a new scenario, and 2 synthesis questions where I connect this to other topics in the program. Ask one at a time and wait for my answer.`;\n  copyToClipboard(prompt);\n}\n\nfunction copyStuckPrompt() {\n  const next = getNextTask();\n  const taskName = next ? next.task : 'my current task';\n  const trackName = next ? next.track : 'my current track';\n  const prompt = `I am stuck on \"${taskName}\" in ${trackName}. Do NOT give me the answer. Instead ask me 3 to 5 diagnostic questions that will help me figure out what I'm missing. After I answer, give me targeted hints only.`;\n  copyToClipboard(prompt);\n}\n\nasync function generateTodaysPlan() {\n  const data = getData();\n  const phase = getCurrentPhase();\n  const week = data.currentWeek || 1;\n  const weekData = HUB_DATA.weeklyPlan[week - 1];\n  const focus = weekData ? weekData.focus : 'general review';\n  const tracks = weekData ? weekData.tracks.join(', ') : 'current track';\n  const done = getDoneTasks();\n  const total = getTotalTasks();\n\n  const prompt = `${learnerLine()}, currently in week ${week} of a process and manufacturing engineering program (Phase ${phase}). I am studying: ${tracks}. This week's focus: ${focus}. I have completed ${done}/${total} tasks (${Math.round(done/total*100)}% overall). Generate a specific time-blocked study plan for a 2-hour session today. Include what to study, in what order, with what approach. Be concrete and actionable.`;\n\n  openModal('Generating Today\\'s Plan...', '<div style=\"text-align:center; padding:var(--space-xl);\"><div class=\"spinner\"><\u002Fdiv><p style=\"margin-top:var(--space-md); color:var(--text-secondary);\">Calling AI...<\u002Fp><\u002Fdiv>');\n\n  const result = await callAI(prompt);\n  if (result) {\n    openModal(\"Today's Study Plan\", `<div class=\"ai-panel\"><div class=\"ai-label\">AI-Generated Plan<\u002Fdiv><div style=\"white-space:pre-wrap;\">${result.replace(/<\u002Fg,'&lt;').replace(/>/g,'&gt;')}<\u002Fdiv><\u002Fdiv>`);\n  } else {\n    closeModal();\n  }\n}\n\n// ═══════════════════════════════════════════════════════\n//  TAB 2: PROGRESS TRACKER\n// ═══════════════════════════════════════════════════════\n\nfunction getTrackStatus(phaseId, trackIdx, track) {\n  const data = getData();\n  let done = 0;\n  for (let i = 0; i < track.tasks.length; i++) {\n    if (data.tasks[`p${phaseId}_t${trackIdx}_i${i}`]) done++;\n  }\n  if (done === 0) return 'not started';\n  if (done === track.tasks.length) return 'complete';\n  return 'in progress';\n}\n\nfunction getPhaseProgress(phase) {\n  const data = getData();\n  let total = 0, done = 0;\n  phase.tracks.forEach((track, ti) => {\n    track.tasks.forEach((_, ii) => {\n      total++;\n      if (data.tasks[`p${phase.id}_t${ti}_i${ii}`]) done++;\n    });\n  });\n  return total > 0 ? Math.round((done / total) * 100) : 0;\n}\n\nfunction renderProgressTracker() {\n  const container = document.getElementById('progressContainer');\n  const data = getData();\n  let html = '';\n\n  // On a phone, seven fully expanded phases is thousands of pixels of scroll,\n  // so only the current phase opens; desktop keeps everything open.\n  const collapseOthers = window.innerWidth <= 900;\n  const openPhase = getCurrentPhase();\n\n  HUB_DATA.phases.forEach((phase, pi) => {\n    const phasePct = getPhaseProgress(phase);\n    const phaseColor = phase.color;\n    const isOpen = !collapseOthers || phase.id === openPhase;\n\n    html += `<div class=\"card reveal\" style=\"margin-bottom:var(--space-md); border-top:3px solid ${phaseColor};\">`;\n    html += `<div class=\"collapsible-header\" role=\"button\" tabindex=\"0\" aria-expanded=\"${isOpen}\" onclick=\"toggleCollapsible(this)\">`;\n    html += `<span class=\"arrow${isOpen ? ' open' : ''}\"><svg class=\"icon icon-caret\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M9 6l6 6-6 6\"/><\u002Fsvg><\u002Fspan>`;\n    html += `<span class=\"phase-head\">`;\n    html += `<span class=\"phase-numeral\" style=\"color:${phaseColor};\">${phase.id}<\u002Fspan>`;\n    html += `<span style=\"min-width:0;\"><span class=\"phase-title\">${phase.name}<\u002Fspan><span class=\"phase-meta\" style=\"display:block;\">Weeks ${phase.weeks} · ${phase.tracks.length} tracks<\u002Fspan><\u002Fspan>`;\n    html += `<\u002Fspan>`;\n    html += `<span class=\"phase-figure\" style=\"color:${phaseColor};\">${phasePct}<span style=\"font-family:var(--font-mono); font-size:12px; letter-spacing:0;\">%<\u002Fspan><\u002Fspan>`;\n    html += `<\u002Fdiv>`;\n\n    // Phase progress bar\n    html += `<div style=\"padding:0 var(--space-md) var(--space-sm);\">`;\n    html += `<div class=\"track-bar\"><div class=\"track-bar-fill\" style=\"width:${phasePct}%; background:${phaseColor}; color:${phaseColor};\"><\u002Fdiv><\u002Fdiv>`;\n    html += `<\u002Fdiv>`;\n\n    // Collapsible body with tracks\n    html += `<div class=\"collapsible-body${isOpen ? ' open' : ''}\" style=\"padding:0 var(--space-md) var(--space-md);\">`;\n\n    phase.tracks.forEach((track, ti) => {\n      const status = getTrackStatus(phase.id, ti, track);\n      const pillClass = status === 'complete' ? 'pill-complete' : status === 'in progress' ? 'pill-in-progress' : 'pill-not-started';\n      const pillLabel = status === 'complete' ? 'Complete' : status === 'in progress' ? 'In progress' : 'Not started';\n\n      html += `<div class=\"track-card\" style=\"border-left-color:${phaseColor};\">`;\n      html += `<div style=\"display:flex; align-items:center; justify-content:space-between; gap:var(--space-md); margin-bottom:12px;\">`;\n      html += `<div style=\"min-width:0;\"><div class=\"track-name\">${track.name}<\u002Fdiv><div class=\"track-weeks\">Weeks ${track.weeks}<\u002Fdiv><\u002Fdiv>`;\n      html += `<span class=\"pill ${pillClass}\">${pillLabel}<\u002Fspan>`;\n      html += `<\u002Fdiv>`;\n\n      // Task checkboxes\n      track.tasks.forEach((task, ii) => {\n        const key = `p${phase.id}_t${ti}_i${ii}`;\n        const checked = data.tasks[key] ? 'checked' : '';\n        html += `<div class=\"task-row\">`;\n        html += `<div class=\"checkbox-row\" style=\"flex:1; min-width:0;\">`;\n        html += `<input type=\"checkbox\" ${checked} onchange=\"toggleTask('${key}', this.checked)\">`;\n        html += `<span style=\"font-size:13px;${data.tasks[key] ? ' text-decoration:line-through; color:var(--text-muted);' : ''}\">${task}<\u002Fspan>`;\n        html += `<\u002Fdiv>`;\n        html += `<button class=\"btn btn-sm\" onclick=\"explainTask('${task.replace(/'/g, \"\\\\'\")}', '${track.name.replace(/'/g, \"\\\\'\")}', this)\">Explain<\u002Fbutton>`;\n        html += `<\u002Fdiv>`;\n        html += `<div id=\"explain_${key}\" style=\"display:none;\"><\u002Fdiv>`;\n      });\n\n      // Notes textarea\n      const noteKey = `p${phase.id}_t${ti}_note`;\n      const noteVal = data.notes[noteKey] || '';\n      html += `<div style=\"margin-top:var(--space-sm);\">`;\n      html += `<label>Notes<\u002Flabel>`;\n      html += `<textarea rows=\"2\" placeholder=\"Track notes...\" onchange=\"saveNote('${noteKey}', this.value)\" oninput=\"saveNote('${noteKey}', this.value)\">${noteVal.replace(/<\u002Fg,'&lt;').replace(/>/g,'&gt;')}<\u002Ftextarea>`;\n      html += `<\u002Fdiv>`;\n\n      html += `<\u002Fdiv>`;\n    });\n\n    html += `<\u002Fdiv><\u002Fdiv>`;\n  });\n\n  container.innerHTML = html;\n}\n\nfunction toggleCollapsible(header) {\n  header.setAttribute('role', 'button');\n  if (!header.hasAttribute('tabindex')) header.setAttribute('tabindex', '0');\n  const arrow = header.querySelector('.arrow');\n  const body = header.nextElementSibling.nextElementSibling || header.parentElement.querySelector('.collapsible-body');\n  // Find the collapsible body (skip the progress bar div)\n  let el = header.nextElementSibling;\n  while (el && !el.classList.contains('collapsible-body')) el = el.nextElementSibling;\n  if (el) {\n    el.classList.toggle('open');\n    if (arrow) arrow.classList.toggle('open');\n    header.setAttribute('aria-expanded', String(el.classList.contains('open')));\n  }\n  void body;\n}\n\nfunction toggleTask(key, checked) {\n  updateData(d => {\n    d.tasks[key] = checked;\n    d.taskWeeks = d.taskWeeks || {};\n    if (checked) { if (!d.taskWeeks[key]) d.taskWeeks[key] = d.currentWeek || 1; }\n    else { delete d.taskWeeks[key]; }\n  });\n  updateSidebarProgress();\n  renderDashboard();\n  renderProgressTracker();\n}\n\nfunction saveNote(key, value) {\n  updateData(d => { d.notes[key] = value; });\n}\n\nasync function explainTask(taskName, trackName, btn) {\n  const parentRow = btn.closest('.checkbox-row');\n  const explainDiv = parentRow.nextElementSibling;\n  if (!explainDiv) return;\n\n  if (explainDiv.style.display === 'block') {\n    explainDiv.style.display = 'none';\n    return;\n  }\n\n  explainDiv.style.display = 'block';\n  explainDiv.innerHTML = '<div class=\"ai-panel\"><div class=\"spinner\"><\u002Fdiv> <span style=\"color:var(--text-muted); font-size:12px;\">Loading explanation...<\u002Fspan><\u002Fdiv>';\n\n  const prompt = `${learnerLine()}. Explain this task in plain terms with a concrete manufacturing example: \"${taskName}\" (from the ${trackName} track). Max 150 words.`;\n  const result = await callAI(prompt);\n\n  if (result) {\n    explainDiv.innerHTML = `<div class=\"ai-panel\"><div class=\"ai-label\">AI Explanation<\u002Fdiv><div style=\"white-space:pre-wrap;\">${result.replace(/<\u002Fg,'&lt;').replace(/>/g,'&gt;')}<\u002Fdiv><\u002Fdiv>`;\n  } else {\n    explainDiv.innerHTML = '<div class=\"ai-panel\" style=\"color:var(--danger);\">Failed to load explanation. Check API key.<\u002Fdiv>';\n  }\n}\n\nfunction resetAllData() {\n  openModal('Confirm Reset', '<p style=\"color:var(--text-secondary);\">This will permanently delete all your progress, notes, and saved data. This cannot be undone.<\u002Fp>', '<button class=\"btn\" onclick=\"closeModal()\">Cancel<\u002Fbutton><button class=\"btn btn-danger\" onclick=\"confirmReset()\">Reset Everything<\u002Fbutton>');\n}\n\nfunction confirmReset() {\n  window._appData = getDefaultData();\n  saveData(window._appData);\n  closeModal();\n  updateSidebarProgress();\n  renderDashboard();\n  renderProgressTracker();\n  showToast('All progress has been reset', 'success');\n}\n\n// ─── Updated Sidebar Progress (uses HUB_DATA for total) ───\nfunction updateSidebarProgress() {\n  const total = getTotalTasks();\n  const done = getDoneTasks();\n  const pct = total > 0 ? Math.round((done / total) * 100) : 0;\n  document.getElementById('sidebarProgressPct').textContent = pct + '%';\n\n  // Segmented bar: one segment per phase, filled by that phase's progress.\n  var seg = document.getElementById('sidebarPhaseSegments');\n  if (seg) {\n    var html = '';\n    HUB_DATA.phases.forEach(function(ph) {\n      var p = getPhaseProgress(ph);\n      html += '<div class=\"phase-seg\"><div class=\"phase-seg-fill\" style=\"width:' + p + '%; background:' + ph.color + ';\"><\u002Fdiv><\u002Fdiv>';\n    });\n    seg.innerHTML = html;\n  }\n  // Legacy single bar (still present on some views), guard in case it's absent.\n  var bar = document.getElementById('sidebarProgressBar');\n  if (bar) bar.style.width = pct + '%';\n\n  renderStatusBar();\n}\n\n// Header status bar: derived entirely from stored data, no new keys.\nfunction renderStatusBar() {\n  var el = document.getElementById('statusBar');\n  if (!el) return;\n  var phase = getCurrentPhase();\n  var ph = HUB_DATA.phases[phase - 1];\n  var week = getData().currentWeek || 1;\n  var total = getTotalTasks(), done = getDoneTasks();\n  var yieldPct = total > 0 ? Math.round((done / total) * 100) : 0;\n\n  // Lamp: green if a session-log entry is dated today (recent activity), else amber.\n  var today = new Date().toISOString().slice(0, 10);\n  var log = getData().sessionLog || [];\n  var activeToday = log.some(function(e) { return e && e.date === today; });\n  var lamp = activeToday ? 'var(--state-run)' : 'var(--state-warn)';\n\n  var wk = ('0' + week).slice(-2);\n  var html = '';\n  html += '<div class=\"sb-group\"><span class=\"sb-dot\" style=\"background:' + ph.color + ';\"><\u002Fspan><span>' + ph.name + '<\u002Fspan><\u002Fdiv>';\n  html += '<div class=\"sb-group\"><span class=\"sb-week\">WK ' + wk + '<\u002Fspan><\u002Fdiv>';\n  html += '<div class=\"sb-group\"><span>Yield<\u002Fspan><span class=\"sb-yield\">' + yieldPct + '%<\u002Fspan><span class=\"sb-lamp\" style=\"color:' + lamp + '; background:' + lamp + ';\"><\u002Fspan><\u002Fdiv>';\n  el.innerHTML = html;\n}\n\n// ═══════════════════════════════════════════════════════\n//  TAB 3: PROJECT HUB\n// ═══════════════════════════════════════════════════════\n\nconst PROJECT_STATUSES = ['Not started', 'In progress', 'Report drafted', 'Ready to publish', 'Published'];\nconst REPORT_FIELDS = [\n  { key: 'background', label: 'Background' },\n  { key: 'problemStatement', label: 'Problem Statement' },\n  { key: 'objectives', label: 'Objectives / Scope' },\n  { key: 'methodology', label: 'Methodology' },\n  { key: 'results', label: 'Results & Data' },\n  { key: 'discussion', label: 'Discussion & Analysis' },\n  { key: 'challenges', label: 'Challenges & Solutions' },\n  { key: 'lessons', label: 'Lessons Learned' },\n  { key: 'nextSteps', label: 'Next Steps' },\n  { key: 'fmea', label: 'FMEA (Failure Modes & Effects)' },\n  { key: 'versionHistory', label: 'Version History / Changelog' },\n  { key: 'references', label: 'References' },\n  { key: 'aiToolsUsed', label: 'AI Tools Used' }\n];\n// Weighted grading rubric (weights sum to 100). Used by the copy-to-clipboard\n// grading prompt and shown as a reference in the project report area.\nconst REPORT_RUBRIC = [\n  { label: 'Problem & objectives', weight: 15, desc: 'Clear problem statement, scope, and measurable objectives' },\n  { label: 'Methodology & rigor', weight: 15, desc: 'Sound, reproducible approach; justified design choices' },\n  { label: 'Risk analysis (FMEA)', weight: 5, desc: 'Failure modes identified with severity/occurrence/detection reasoning and mitigations' },\n  { label: 'Results & data quality', weight: 20, desc: 'Quantified results, correct data handling, clear figures/tables' },\n  { label: 'Analysis & interpretation', weight: 15, desc: 'Insightful discussion; conclusions supported by the data' },\n  { label: 'Challenges & problem-solving', weight: 10, desc: 'Real obstacles and how they were resolved' },\n  { label: 'Communication & structure', weight: 10, desc: 'Clear, professional writing; logical flow' },\n  { label: 'Reproducibility & references', weight: 5, desc: 'Enough detail/refs to reproduce the work' },\n  { label: 'Reflection & next steps', weight: 5, desc: 'Honest lessons learned and concrete next steps' }\n];\nconst PUBLISH_CHECKLIST = [\n  { key: 'github_readme', label: 'GitHub README written' },\n  { key: 'code_pushed', label: 'Code pushed to GitHub' },\n  { key: 'linkedin', label: 'LinkedIn post drafted' },\n  { key: 'portfolio', label: 'Portfolio site entry written' },\n  { key: 'video', label: 'Demo video recorded' },\n  { key: 'fmea_done', label: 'FMEA completed' },\n  { key: 'changelog', label: 'Version history / changelog updated' }\n];\n\nfunction getProjectData(projId) {\n  const data = getData();\n  if (!data.projects[projId]) {\n    data.projects[projId] = {\n      status: 'Not started',\n      deliverables: {},\n      publishChecklist: {},\n      report: {}\n    };\n    saveData(data);\n  }\n  return data.projects[projId];\n}\n\n// Career-tier badges (interview prioritization metadata, not curriculum).\n// Tier 1 = amber flagship, Tier 2 = muted light-writeup, Tier 3 = no badge.\n// pullForward adds a second \"PULL FORWARD\" badge.\nfunction careerTierBadges(proj) {\n  let html = '';\n  if (proj.careerTier === 1) {\n    html += `<span class=\"pill pill-flagship\">Interview flagship<\u002Fspan>`;\n  } else if (proj.careerTier === 2) {\n    html += `<span class=\"pill pill-light\">Light writeup<\u002Fspan>`;\n  }\n  if (proj.pullForward) {\n    html += `<span class=\"pill\" style=\"color:var(--phase-2);\">Pull forward<\u002Fspan>`;\n  }\n  return html;\n}\n\n// Project hub is an index + one focused editor: 70+ briefs as stacked accordions\n// buried the report form and put every field in the DOM at once.\nvar _phSelected = null;\nvar _phQuery = '';\n\nfunction phStatusColor(status) {\n  if (status === 'Published') return 'var(--state-run)';\n  if (status === 'Ready to publish') return 'var(--phase-2)';\n  if (status === 'Not started') return 'var(--state-idle)';\n  return 'var(--state-warn)';\n}\n\nfunction phMatches(proj) {\n  if (!_phQuery) return true;\n  var q = _phQuery.toLowerCase();\n  return proj.title.toLowerCase().indexOf(q) !== -1 ||\n    proj.techStack.join(' ').toLowerCase().indexOf(q) !== -1;\n}\n\nfunction renderProjectHub() {\n  const container = document.getElementById('projectHubContainer');\n  if (!container) return;\n\n  if (!_phSelected || !HUB_DATA.projects.some(function (p) { return p.id === _phSelected; })) {\n    var flagship = HUB_DATA.projects.find(function (p) { return p.careerTier === 1; });\n    _phSelected = (flagship || HUB_DATA.projects[0]).id;\n  }\n\n  let html = '';\n  html += `<details class=\"card\" style=\"margin-bottom:var(--space-lg); border-left:2px solid var(--brand);\">`;\n  html += `<summary style=\"cursor:pointer; font-family:var(--font-mono); font-size:9.5px; font-weight:500; color:var(--brand); text-transform:uppercase; letter-spacing:0.16em;\">Why these tiers<\u002Fsummary>`;\n  html += `<p style=\"font-size:14px; color:var(--text-secondary); line-height:1.7; margin-top:var(--space-md); max-width:78ch;\">Two projects carry the interview. The baseline SPC dashboard (Track 1) doubles as your DMAIC portfolio case study, so it gets the most polish early. The end-to-end DMAIC project (Track 7) is the flagship: it ties every tool in the program together with a quantified result, which is exactly the signal a manufacturing, process or applications engineering manager is screening for. The minis support those two, they prove you can map a process, clean data, run a root-cause, automate a report and document to standard. Everything folds into the published portfolio in the final phase; treat each capstone like a real job deliverable.<\u002Fp>`;\n  html += `<\u002Fdetails>`;\n\n  html += `<div class=\"ph-layout\">`;\n  html += `<aside class=\"ph-index\" id=\"phIndex\"><\u002Faside>`;\n  html += `<section class=\"ph-detail\" id=\"phDetail\"><\u002Fsection>`;\n  html += `<\u002Fdiv>`;\n\n  container.innerHTML = html;\n  renderProjectIndex();\n  renderProjectDetail();\n}\n\nfunction renderProjectIndex() {\n  var el = document.getElementById('phIndex');\n  if (!el) return;\n  var data = getData();\n  var html = '';\n\n  html += '<input type=\"text\" placeholder=\"Search projects or tech…\" value=\"' + _phQuery.replace(/\"/g, '&quot;') +\n    '\" oninput=\"_phQuery=this.value; renderProjectIndex();\">';\n\n  var shown = 0;\n  HUB_DATA.phases.forEach(function (phase) {\n    var group = HUB_DATA.projects.filter(function (p) { return p.phase === phase.id && phMatches(p); });\n    if (!group.length) return;\n    html += '<div class=\"ph-group\">Phase ' + phase.id + ' · ' + phase.name + '<\u002Fdiv>';\n    group.forEach(function (proj) {\n      shown++;\n      var pd = data.projects[proj.id] || { status: 'Not started' };\n      var tier = proj.careerTier === 1 ? ' · Flagship' : '';\n      html += '<button class=\"ph-row' + (proj.id === _phSelected ? ' active' : '') + '\" onclick=\"selectProject(\\'' + proj.id + '\\')\">' +\n        '<span class=\"ph-dot\" style=\"background:' + phStatusColor(pd.status) + ';\"><\u002Fspan>' +\n        '<span><span class=\"ph-row-title\">' + proj.title + '<\u002Fspan>' +\n        '<span class=\"ph-row-meta\" style=\"display:block;\">' + (proj.type === 'capstone' ? 'Capstone' : 'Mini') +\n        ' · ' + proj.estimatedHours + ' h' + tier + '<\u002Fspan><\u002Fspan>' +\n      '<\u002Fbutton>';\n    });\n  });\n  if (!shown) html += '<div class=\"ph-group\" style=\"color:var(--text-secondary);\">No projects match that search.<\u002Fdiv>';\n  el.innerHTML = html;\n}\n\nfunction selectProject(projId) {\n  _phSelected = projId;\n  renderProjectIndex();\n  renderProjectDetail();\n  var d = document.getElementById('phDetail');\n  if (d) d.scrollTop = 0;\n}\n\nfunction projectMetricsHTML(projId) {\n  var proj = HUB_DATA.projects.find(function (p) { return p.id === projId; });\n  if (!proj) return '';\n  var pd = getProjectData(projId);\n  var meter = function (done, total) {\n    return '<div class=\"meter\"><i style=\"width:' + (total ? Math.round(done / total * 100) : 0) + '%;\"><\u002Fi><\u002Fdiv>';\n  };\n  var dTotal = proj.brief.deliverables.length;\n  var dDone = proj.brief.deliverables.filter(function (_, i) { return pd.deliverables['d' + i]; }).length;\n  var rTotal = REPORT_FIELDS.length;\n  var rDone = REPORT_FIELDS.filter(function (fd) { return (pd.report[fd.key] || '').trim(); }).length;\n  var pTotal = PUBLISH_CHECKLIST.length;\n  var pDone = PUBLISH_CHECKLIST.filter(function (c) { return pd.publishChecklist[c.key]; }).length;\n  return '<div class=\"ph-metric\"><div class=\"k\">Deliverables<\u002Fdiv><div class=\"v\">' + dDone + '/' + dTotal + '<\u002Fdiv>' + meter(dDone, dTotal) + '<\u002Fdiv>' +\n    '<div class=\"ph-metric\"><div class=\"k\">Report sections<\u002Fdiv><div class=\"v\">' + rDone + '/' + rTotal + '<\u002Fdiv>' + meter(rDone, rTotal) + '<\u002Fdiv>' +\n    '<div class=\"ph-metric\"><div class=\"k\">Publishing<\u002Fdiv><div class=\"v\">' + pDone + '/' + pTotal + '<\u002Fdiv>' + meter(pDone, pTotal) + '<\u002Fdiv>' +\n    '<div class=\"ph-metric\"><div class=\"k\">Status<\u002Fdiv><div class=\"v\" style=\"font-size:12px; color:' + phStatusColor(pd.status) + ';\">' + pd.status + '<\u002Fdiv><\u002Fdiv>';\n}\n\n// Patch the metric strip and index dot in place, a full re-render would steal\n// focus from whatever the user is typing in.\nfunction refreshProjectMetrics(projId, skipIndex) {\n  var m = document.getElementById('phMetrics');\n  if (m && projId === _phSelected) m.innerHTML = projectMetricsHTML(projId);\n  if (!skipIndex) renderProjectIndex();\n}\n\nfunction renderProjectDetail() {\n  var el = document.getElementById('phDetail');\n  if (!el) return;\n  var proj = HUB_DATA.projects.find(function (p) { return p.id === _phSelected; });\n  if (!proj) { el.innerHTML = ''; return; }\n  var pd = getProjectData(proj.id);\n  var phaseColor = HUB_DATA.phases[proj.phase - 1].color;\n  var diffColors = { beginner: '#6cc79f', intermediate: '#e8a33d', advanced: '#e5806f' };\n  var diffColor = diffColors[proj.difficulty] || 'var(--state-idle)';\n\n  var html = '<div class=\"card\" style=\"border-left:2px solid ' + (proj.careerTier === 1 ? 'var(--brand)' : phaseColor) + ';\">';\n  html += '<div class=\"ph-head\">';\n  html += '<div class=\"proj-title\">' + proj.title + '<\u002Fdiv>';\n  html += '<div class=\"proj-meta\">';\n  html += '<span class=\"badge badge-phase-' + proj.phase + '\">Phase ' + proj.phase + '<\u002Fspan>';\n  html += '<span class=\"badge\" style=\"background:rgba(255,255,255,0.05); color:var(--text-secondary);\">' + (proj.type === 'capstone' ? 'Capstone' : 'Mini') + '<\u002Fspan>';\n  html += '<span class=\"badge\" style=\"background:' + diffColor + '22; color:' + diffColor + ';\">' + proj.difficulty + '<\u002Fspan>';\n  html += careerTierBadges(proj);\n  html += '<span class=\"proj-hours\">' + proj.estimatedHours + ' h<\u002Fspan>';\n  html += '<\u002Fdiv>';\n  html += '<div class=\"ph-metrics\" id=\"phMetrics\">' + projectMetricsHTML(proj.id) + '<\u002Fdiv>';\n  html += '<\u002Fdiv>';\n  html += renderProjectBody(proj.id);\n  html += '<\u002Fdiv>';\n\n  el.innerHTML = html;\n  observeReveals();\n}\n\nfunction renderProjectBody(projId) {\n  const proj = HUB_DATA.projects.find(p => p.id === projId);\n  if (!proj) return '';\n  const pd = getProjectData(proj.id);\n  const phaseColor = HUB_DATA.phases[proj.phase - 1].color;\n  let html = '';\n\n    // Problem Statement\n    html += `<div style=\"margin-bottom:var(--space-md);\">`;\n    html += `<h3 class=\"sub-label\">Problem statement<\u002Fh3>`;\n    html += `<p style=\"font-size:13px; color:var(--text-secondary); line-height:1.6;\">${proj.brief.problem}<\u002Fp>`;\n    html += `<\u002Fdiv>`;\n\n    // Objectives\n    html += `<div style=\"margin-bottom:var(--space-md);\">`;\n    html += `<h3 class=\"sub-label\">Objectives<\u002Fh3>`;\n    html += `<ul style=\"list-style:disc; padding-left:var(--space-lg); font-size:13px; color:var(--text-secondary); line-height:1.8;\">`;\n    proj.brief.objectives.forEach(o => { html += `<li>${o}<\u002Fli>`; });\n    html += `<\u002Ful><\u002Fdiv>`;\n\n    // Deliverables Checklist\n    html += `<div style=\"margin-bottom:var(--space-md);\">`;\n    html += `<h3 class=\"sub-label\">Deliverables<\u002Fh3>`;\n    proj.brief.deliverables.forEach((d, di) => {\n      const dKey = `d${di}`;\n      const checked = pd.deliverables[dKey] ? 'checked' : '';\n      html += `<div class=\"checkbox-row\">`;\n      html += `<input type=\"checkbox\" ${checked} onchange=\"toggleDeliverable('${proj.id}','${dKey}',this.checked)\">`;\n      html += `<span style=\"font-size:13px;${pd.deliverables[dKey] ? ' text-decoration:line-through; color:var(--text-muted);' : ' color:var(--text-secondary);'}\">${d}<\u002Fspan>`;\n      html += `<\u002Fdiv>`;\n    });\n    html += `<\u002Fdiv>`;\n\n    // Tech Stack Tags\n    html += `<div style=\"margin-bottom:var(--space-lg);\">`;\n    html += `<h3 class=\"sub-label\">Tech stack<\u002Fh3>`;\n    html += `<div style=\"display:flex; gap:var(--space-sm); flex-wrap:wrap;\">`;\n    proj.techStack.forEach(t => { html += `<span class=\"tag\">${t}<\u002Fspan>`; });\n    html += `<\u002Fdiv><\u002Fdiv>`;\n\n    // ── Report Form ──\n    html += `<div style=\"border-top:1px solid var(--border); padding-top:var(--space-lg); margin-bottom:var(--space-lg);\">`;\n    html += `<h3 style=\"margin-bottom:var(--space-md);\">Project report<\u002Fh3>`;\n    REPORT_FIELDS.forEach(f => {\n      const val = (pd.report[f.key] || '').replace(/<\u002Fg, '&lt;').replace(/>/g, '&gt;');\n      html += `<div style=\"margin-bottom:var(--space-md);\">`;\n      html += `<div style=\"display:flex; align-items:center; justify-content:space-between; margin-bottom:var(--space-xs);\">`;\n      html += `<label style=\"margin-bottom:0;\">${f.label}<\u002Flabel>`;\n      html += `<button class=\"btn btn-sm\" onclick=\"draftReportSection('${proj.id}','${f.key}','${f.label}',this)\">Draft with AI<\u002Fbutton>`;\n      html += `<\u002Fdiv>`;\n      html += `<textarea rows=\"3\" placeholder=\"${f.label}...\" oninput=\"saveReportField('${proj.id}','
